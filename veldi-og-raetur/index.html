<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- ARTIFACT-START -->
<title>Veldi og rætur</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap">
<style>
/* Útlit: námsleið til vinstri, veldavélin á rúðustrikuðu blaði í miðjunni. Litur kafla 5 (● grænn) ber allt. */
:root{
  --bg:#f5f7f6; --surface:#ffffff; --paper:#fcfefd; --ink:#1a1a1a; --muted:#55605a; --line:#dbe3de; --grid:#e6efea; --hover:#eaf3ee;
  --k7:#0b7d4e; --k7-tint:#e2f0ea; --k7-ink:#075c39; --on-k7:#ffffff;
  --k6:#1f5fb5; --k5:#0b7d4e;
  --ok:#1b7443; --ok-tint:#e2f2e8; --bad:#b0281f; --bad-tint:#fbe5e2;
  --p2:#c95d07; --p1:#1f6fb5; --p0:#9b938b;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --math:"STIX Two Text","Cambria Math","Times New Roman",Georgia,serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101513; --surface:#18201c; --paper:#141b17; --ink:#f2ede7; --muted:#b5aca2; --line:#2c3a33; --grid:#1e2924; --hover:#22302a;
  --k7:#4cc28c; --k7-tint:#12301f; --k7-ink:#8fe0b6; --on-k7:#04170d;
  --k6:#6ea4ef; --k5:#4cc28c;
  --ok:#5fd18f; --ok-tint:#16301f; --bad:#ff8a7f; --bad-tint:#3a1a16;
  --p2:#f08a3c; --p1:#6ea4ef; --p0:#8f867d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101513; --surface:#18201c; --paper:#141b17; --ink:#f2ede7; --muted:#b5aca2; --line:#2c3a33; --grid:#1e2924; --hover:#22302a;
  --k7:#4cc28c; --k7-tint:#12301f; --k7-ink:#8fe0b6; --on-k7:#04170d;
  --k6:#6ea4ef; --k5:#4cc28c;
  --ok:#5fd18f; --ok-tint:#16301f; --bad:#ff8a7f; --bad-tint:#3a1a16;
  --p2:#f08a3c; --p1:#6ea4ef; --p0:#8f867d; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--font)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--k7);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}
.m{font-family:var(--math)}
i.v,.m i{font-family:var(--math);font-style:italic}

/* ---------- Haus ---------- */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.brand h1{font-size:1.35rem;display:flex;align-items:center;gap:.45em}
.sym{color:var(--k7)}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{width:140px;height:8px;border-radius:99px;background:var(--grid);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--k7);border-radius:99px;transition:width .4s}
.btn.navbtn{display:none}

/* ---------- Grind ---------- */
.layout{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;
  padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;padding-right:4px}
.nav-mod{margin-bottom:18px}
.nav-mod h3{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 6px;display:flex;gap:.5em;align-items:baseline}
.nav-mod h3 b{color:var(--k7);font-size:.95rem}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:10px;cursor:pointer;font-size:.95rem;color:var(--ink)}
.nav-item:hover{background:var(--hover)}
.nav-item.cur{background:var(--k7-tint);color:var(--k7-ink);font-weight:700}
.st{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.7rem;color:var(--on-k7)}
.nav-item.done .st{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.nav-item.cur .st{border-color:var(--k7)}
.nav-item .t{flex:1;min-width:0}
.lvl{font-size:.62rem;letter-spacing:.05em;color:var(--k7);white-space:nowrap}
.lvl .off{color:var(--line)}

main{min-width:0}
.ihead{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.ihead h2{font-size:clamp(1.5rem,3.4vw,2.05rem)}
.ihead .meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
.ifoot{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}

/* ---------- Hnappar og smáhlutir ---------- */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:.5em .9em;min-height:42px;cursor:pointer;font-weight:700;font-size:.92rem;display:inline-flex;align-items:center;gap:.45em;line-height:1.2}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--k7);border-color:var(--k7);color:var(--on-k7)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{min-height:34px;padding:.3em .7em;font-size:.85rem}
.btn .mm{font-family:var(--math);font-weight:600;font-size:1.08em}
.ref{display:inline-block;background:var(--k7);color:var(--on-k7);font:700 .7rem/1.4 var(--font);border-radius:5px;padding:.05em .42em;letter-spacing:.02em;vertical-align:middle}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.tint{background:var(--k7-tint);border-color:transparent}
.prose{display:flex;flex-direction:column;gap:14px;max-width:68ch}
.prose b{font-weight:700}
.good{color:var(--ok);font-weight:700}
.bad{color:var(--bad);font-weight:700;text-decoration:line-through;text-decoration-thickness:1px}
.rule{display:flex;flex-wrap:wrap;gap:.35em .6em;align-items:baseline}
.rule .mt{font-family:var(--math);font-size:1.12em}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mtl{font-family:var(--math);font-size:1.6rem;line-height:1.3}
.k{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--k7-ink)}
.mut{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{border:2px dashed var(--line);border-radius:99px;padding:.3em .8em;font-weight:700;font-size:.88rem;color:var(--muted)}
.badge.on{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-tint)}

/* ---------- Stærðfræðiletur ---------- */
.eqline{font-family:var(--math);display:inline-flex;align-items:center;white-space:nowrap;line-height:1.15}
.eqline sup{font-size:.62em;line-height:0;position:relative;top:-.55em;vertical-align:baseline}
.eqline .tm>sup.sq{line-height:1;top:0;align-self:flex-start;margin-top:-.15em;font-size:.62em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.66em;line-height:1.08;margin:0 .06em}
.fr>span:first-child{border-bottom:.09em solid currentColor;padding:0 .12em}
.side{display:inline-flex;align-items:center;border-radius:12px}
.eqs{margin:0 .35em;border-radius:8px;padding:0 .15em}
.op{margin:0 .2em}
.op0{margin:0 .04em 0 0}
.tm{display:inline-flex;align-items:center;border-radius:9px;position:relative}
.kchip,.br{display:inline-flex;align-items:center;border-radius:8px}
.in{display:inline-flex;align-items:center}
.zero{color:var(--muted)}
.par{font-size:1.08em}
.lab{position:absolute;left:50%;top:100%;transform:translateX(-50%);font:700 .42em/1 var(--font);background:var(--k7);color:var(--on-k7);border-radius:5px;padding:.25em .45em;margin-top:.3em;visibility:hidden;white-space:nowrap}
.show-A .tm.p2>.lab,.show-B .tm.p1>.lab,.show-C .tm.p0>.lab{visibility:visible}
.show-A .tm.p2,.show-B .tm.p1,.show-C .tm.p0{background:var(--k7-tint)}
.likecol .tm.m.p2>.bd,.likecol .in.p2{box-shadow:inset 0 -.11em var(--p2)}
.likecol .tm.m.p1>.bd,.likecol .in.p1{box-shadow:inset 0 -.11em var(--p1)}
.likecol .tm.m.p0>.bd,.likecol .in.p0{box-shadow:inset 0 -.11em var(--p0)}

/* ---------- Algebruvélin ---------- */
.engine{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.eng-main{display:flex;flex-direction:column;gap:12px;min-width:0}
.goal{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.goal .gl{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.goal .ge{font-family:var(--math);font-size:1.25rem}
.goal .ge sup{font-size:.62em}
.checks{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.checks li{font-size:.82rem;border-radius:99px;padding:.25em .7em .25em .5em;background:var(--grid);color:var(--muted);display:flex;gap:.4em;align-items:center;transition:background .25s,color .25s}
.checks li::before{content:"";width:.75em;height:.75em;border-radius:3px;border:2px solid currentColor;flex:none}
.checks li.ok{background:var(--ok-tint);color:var(--ok);font-weight:700}
.checks li.ok::before{background:currentColor;border-radius:50%}
.stage{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px;
  border:1px solid var(--line);border-radius:18px;min-height:170px;display:flex;align-items:center;overflow-x:auto;padding:30px 16px 34px;position:relative}
.stage-in{margin:auto}
.stage .eqline{font-size:clamp(1.45rem,4.4vw,2.6rem)}
.stage .side{min-height:2.1em;padding:.15em .1em;min-width:1.4em;justify-content:center}
.stage .tm{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding:.06em .14em;transition:background .15s,box-shadow .15s}
.stage .tm:hover{background:var(--hover)}
.stage .tm.sel{background:var(--k7-tint);box-shadow:0 0 0 2px var(--k7)}
.stage .kchip{border-bottom:2px dotted var(--k7);cursor:grab;padding:0 .06em}
.stage .br{cursor:grab}
.stage sup.sq{cursor:pointer;border-radius:4px;padding:0 .12em;color:var(--k7-ink);font-weight:600}
.stage sup.sq:hover{background:var(--k7-tint)}
.gap{display:inline-block;width:.34em;align-self:stretch;position:relative}
.dragging .gap.over::after{content:"";position:absolute;left:50%;top:12%;bottom:12%;width:4px;margin-left:-2px;border-radius:2px;background:var(--k7);box-shadow:0 0 0 3px var(--k7-tint)}
.dragging .eqs{background:var(--k7-tint);color:var(--k7-ink)}
.dragging .eqs.over{background:var(--k7);color:var(--on-k7)}
.dragging .side.over{background:var(--k7-tint)}
.dragging .can{outline:2px dashed var(--k7);outline-offset:2px}
.dragging .over.tm,.dragging .over.br{outline:3px solid var(--k7);background:var(--k7-tint)}
.lifted{opacity:.28}
.dragghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;font-family:var(--math);background:var(--surface);border-radius:10px;padding:.05em .25em;box-shadow:0 10px 28px rgba(0,0,0,.22),0 0 0 2px var(--k7);white-space:nowrap;display:inline-flex;align-items:center}
.dragghost sup{font-size:.62em;line-height:0;position:relative;top:-.55em}
.tm.hint{animation:hint 1.1s ease-in-out 3}
@keyframes hint{50%{box-shadow:0 0 0 4px var(--k7);background:var(--k7-tint)}}
.flipped{animation:flip .9s ease}
@keyframes flip{0%{color:var(--k7);transform:scale(1.8)}60%{color:var(--k7)}}
.fresh{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.55);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.eng-msg{min-height:3.1em;border-radius:12px;padding:.6em .9em;font-size:.95rem;background:var(--surface);border:1px solid var(--line);display:flex;gap:.6em;align-items:flex-start}
.eng-msg .ic{flex:none;font-weight:700;width:1.5em;height:1.5em;border-radius:50%;display:grid;place-items:center;font-size:.8rem;background:var(--grid);color:var(--muted)}
.eng-msg.step .ic{background:var(--k7);color:var(--on-k7)}
.eng-msg.err{background:var(--bad-tint);border-color:transparent}
.eng-msg.err .ic{background:var(--bad);color:var(--surface)}
.eng-msg.hint{background:var(--k7-tint);border-color:transparent}
.eng-msg b{font-family:var(--math);font-size:1.08em}
.acts{display:flex;flex-direction:column;gap:10px}
.ctx{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:42px}
.ctx .lbl{font-size:.82rem;color:var(--muted);margin-right:4px}
.glob{display:flex;flex-wrap:wrap;gap:6px;border-top:1px dashed var(--line);padding-top:10px}
.scale-in{width:5.5em;border:1px solid var(--line);border-radius:10px;padding:.45em .6em;background:var(--surface);font-family:var(--math)}
.done-ban{border-radius:14px;padding:14px 16px;background:var(--ok-tint);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.done-ban h4{font-size:1.1rem;color:var(--ok)}
.done-ban .abcv{font-family:var(--math);font-size:1.1rem}
.done-ban.warn{background:var(--k7-tint)}
.done-ban.warn h4{color:var(--k7-ink)}
.help{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.help div{font-size:.82rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;line-height:1.35}
.help b{display:block;color:var(--ink);font-size:.86rem;margin-bottom:2px}
.eng-log{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 10px;position:sticky;top:16px}
.eng-log h4{font-size:.95rem}
.eng-log .sub{font-size:.8rem;color:var(--muted);margin-bottom:8px}
.eng-log ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;counter-reset:ln;max-height:460px;overflow:auto}
.eng-log li{counter-increment:ln;display:grid;grid-template-columns:1.6em minmax(0,1fr);gap:2px 6px;padding:6px 6px;border-radius:9px;cursor:pointer;align-items:center}
.eng-log li::before{content:counter(ln);font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;grid-row:span 2}
.eng-log li:hover{background:var(--hover)}
.eng-log li.cur{background:var(--k7-tint);cursor:default}
.eng-log .ln{overflow-x:auto}
.eng-log .ln .eqline{font-size:1.05rem}
.eng-log .tg{font-size:.74rem;color:var(--muted);display:flex;gap:6px;align-items:center}

.probs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.probs .pn{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.probs .pn.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.probs .pn.cur{border-color:var(--k7);box-shadow:0 0 0 3px var(--k7-tint)}
.probs .lab2{font-size:.85rem;color:var(--muted);margin-right:6px}

/* ---------- Spurningar ---------- */
.quiz{display:flex;flex-direction:column;gap:16px;max-width:780px}
.qdots{display:flex;gap:6px;flex-wrap:wrap}
.qdots span{width:14px;height:14px;border-radius:50%;background:var(--grid);border:2px solid var(--line)}
.qdots span.cur{border-color:var(--k7)}
.qdots span.y{background:var(--ok);border-color:var(--ok)}
.qdots span.n{background:var(--bad);border-color:var(--bad)}
.qcard{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;border:1px solid var(--line);border-radius:18px;padding:34px 18px;display:flex;justify-content:center;overflow-x:auto}
.qcard .eqline{font-size:clamp(1.6rem,5vw,2.6rem)}
.qbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qbtns .btn{min-height:58px;font-size:1.05rem;justify-content:center}
.qbtns .btn.pri:disabled{opacity:1}
.fb{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fb.y{background:var(--ok-tint)}
.fb.n{background:var(--bad-tint)}
.fb h4{font-size:1.05rem}
.fb.y h4{color:var(--ok)} .fb.n h4{color:var(--bad)}
.fb .eqline{font-size:1.3rem}

/* ---------- Gröf ---------- */
.plotwrap{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;overflow:hidden}
.plot{width:100%;height:auto;display:block}
.plot .gl{stroke:var(--grid);stroke-width:1}
.plot .ax{stroke:var(--muted);stroke-width:1.4}
.plot .xaxis{stroke:var(--ink);stroke-width:2.4}
.plot .cv{fill:none;stroke:var(--k7);stroke-width:3.4;stroke-linecap:round}
.plot .hl{stroke:var(--k6);stroke-width:2.6;stroke-dasharray:7 5}
.plot .drop{stroke:var(--muted);stroke-width:1.4;stroke-dasharray:3 4}
.plot .dot{fill:var(--surface);stroke:var(--ink);stroke-width:3}
.plot .dot.hit{fill:var(--k7);stroke:var(--ink)}
.plot text{fill:var(--muted);font:12px var(--font)}
.plot .tl{fill:var(--ink);font:italic 600 15px var(--math)}
.plot .tk{fill:var(--k6);font:italic 600 15px var(--math)}
.ctrl{display:grid;grid-template-columns:auto minmax(0,1fr) 3.2em;gap:10px 12px;align-items:center}
.ctrl label{font-family:var(--math);font-style:italic;font-size:1.2rem;font-weight:600}
.ctrl output{font-family:var(--math);font-size:1.15rem;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--k7);height:30px}
.count{font-size:2.4rem;font-weight:700;color:var(--k7);line-height:1}
.gview{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.gside{display:flex;flex-direction:column;gap:14px}

/* ---------- A, B, C ---------- */
.abc{display:flex;flex-direction:column;gap:16px}
.abc-eq{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px 14px 40px;display:flex;justify-content:center;overflow-x:auto}
.abc-eq .eqline{font-size:clamp(1.6rem,5vw,2.5rem)}
.abc-eq .tm{padding:.05em .14em}
.abc-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.abc-f{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.abc-f .fl{display:flex;align-items:center;gap:8px}
.abc-f label{font-family:var(--math);font-size:1.5rem;font-weight:600;font-style:italic}
.abc-f input{flex:1;min-width:0;font-family:var(--math);font-size:1.4rem;border:2px solid var(--line);border-radius:10px;padding:.2em .45em;background:var(--paper)}
.abc-f.ok{border-color:var(--ok);background:var(--ok-tint)}
.abc-f.no{border-color:var(--bad)}
.abc-f .what{font-size:.82rem;color:var(--muted)}
.abc-f .msg{font-size:.86rem;color:var(--bad)}
.abc-f.ok .msg{color:var(--ok)}
.pm{min-width:42px;justify-content:center;font-family:var(--math)}

/* ---------- Kennsluefni ---------- */

/* ================= Brot ================= */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t}return a||1};
class F{
  constructor(n,d=1){if(d===0)throw new Error('Deilt með 0');if(d<0){n=-n;d=-d}const g=gcd(n,d);this.n=n/g;this.d=d/g}
  static of(x){return x instanceof F?x:new F(x,1)}
  add(o){o=F.of(o);return new F(this.n*o.d+o.n*this.d,this.d*o.d)}
  sub(o){return this.add(F.of(o).neg())}
  mul(o){o=F.of(o);return new F(this.n*o.n,this.d*o.d)}
  div(o){o=F.of(o);return new F(this.n*o.d,this.d*o.n)}
  neg(){return new F(-this.n,this.d)} abs(){return new F(Math.abs(this.n),this.d)}
  isZero(){return this.n===0} isNeg(){return this.n<0} isOne(){return this.n===1&&this.d===1} isInt(){return this.d===1}
  eq(o){o=F.of(o);return this.n===o.n&&this.d===o.d} val(){return this.n/this.d}
}
const F0=new F(0),F1=new F(1),MINUS='−';
const fT=f=>(f.n<0?MINUS:'')+Math.abs(f.n)+(f.d===1?'':'/'+f.d);
function toF(s){const m=s.split('.');if(m.length===1)return new F(parseInt(s,10));const k=m[1].length;return new F(parseInt(m[0]+m[1],10),10**k)}
function fpow(b,e){let r=F1;for(let i=0;i<e;i++)r=r.mul(b);return r}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM=matchMedia('(prefers-reduced-motion: reduce)');

/* ================= Veldisvísar: k + n·n ================= */
const E=(k,n=0)=>({k:F.of(k),n:F.of(n)});
const eAdd=(a,b)=>({k:a.k.add(b.k),n:a.n.add(b.n)});
const eNeg=a=>({k:a.k.neg(),n:a.n.neg()});
const eSub=(a,b)=>eAdd(a,eNeg(b));
const eMulF=(a,f)=>({k:a.k.mul(f),n:a.n.mul(f)});
const eMul=(a,b)=>a.n.isZero()?eMulF(b,a.k):b.n.isZero()?eMulF(a,b.k):null;
const eEq=(a,b)=>a.k.eq(b.k)&&a.n.eq(b.n);
const eNum=a=>a.n.isZero();
const eZero=a=>a.k.isZero()&&a.n.isZero();
const eOne=a=>a.n.isZero()&&a.k.isOne();
const eNegLook=a=>!eZero(a)&&a.k.val()<=0&&a.n.val()<=0;
const eComp=a=>!a.k.isZero()&&!a.n.isZero();
const isP=e=>e&&e.op;
function pVal(p){const{op,a,b}=p;return op==='+'?eAdd(a,b):op==='−'?eSub(a,b):op==='·'?eMul(a,b):eMulF(a,new F(1,b.k.n))}
const fracS=f=>Math.abs(f.n)+(f.d===1?'':'/'+f.d);
function eT(e){ // texti
  const nT=c=>c.isOne()?'n':c.eq(-1)?'n':(fracS(c.abs())+'n');
  if(e.n.isZero())return fT(e.k);
  const nPart=(e.n.isNeg()?MINUS:'')+nT(e.n);
  if(e.k.isZero())return nPart;
  if(e.n.isNeg()&&!e.k.isNeg())return fT(e.k)+MINUS+nT(e.n);
  return nPart+(e.k.isNeg()?MINUS:'+')+fracS(e.k.abs());
}
const mfr=(a,b)=>`<span class="mfr"><span>${a}</span><span>${b}</span></span>`;
function eH(e){ // HTML í veldisvísi
  if(e.n.isZero()&&e.k.d!==1)return (e.k.isNeg()?MINUS:'')+mfr(Math.abs(e.k.n),e.k.d);
  return esc(eT(e)).replace(/n/g,'<i>n</i>');
}
const opd=e=>eComp(e)||(e.n.isZero()&&e.k.isNeg()&&false)?'('+eH(e)+')':eH(e);
function pH(p){
  if(p.op==='÷')return mfr(eH(p.a),p.b.k.n);
  const a=p.op==='·'&&eComp(p.a)?'('+eH(p.a)+')':opd(p.a);
  const b=p.op!=='+'&&(eComp(p.b)||(p.op==='−'||p.op==='·')&&eNegLook(p.b)&&!eComp(p.b))?'('+eH(p.b)+')':opd(p.b);
  return `${a}${p.op==='·'?'·':p.op}${b}`;
}
function parseLin(s){
  s=String(s).replace(/[−–]/g,'-').replace(/\s/g,'').replace(/,/g,'.');
  if(!s)return null;
  const re=/([+-]?)(\d+(?:\.\d+)?(?:\/\d+)?)?(n?)/y;let i=0,k=F0,n=F0,any=false;
  while(i<s.length){re.lastIndex=i;const m=re.exec(s);if(!m||m[0]==='')return null;
    if(!m[2]&&!m[3])return null;
    let c=F1;if(m[2]){const[a,b]=m[2].split('/');c=toF(a);if(b){if(+b===0)return null;c=c.div(+b)}}
    if(m[1]==='-')c=c.neg();
    if(m[3])n=n.add(c);else k=k.add(c);
    i=re.lastIndex;any=true;}
  return any?{k,n}:null;
}

/* ================= Þættir ================= */
let UID=0;const nid=()=>'f'+(++UID);
const N=v=>({id:nid(),t:'n',v:F.of(v)});
const Pw=(b,e)=>({id:nid(),t:'p',b,e});
const Gp=(f,e)=>({id:nid(),t:'g',f,e});
const Rt=(k,f)=>({id:nid(),t:'r',k,f});
const cloneF=f=>f.t==='g'||f.t==='r'?{...f,f:f.f.map(cloneF)}:{...f};
const cloneS=st=>({num:st.num.map(cloneF),den:st.den.map(cloneF)});
const isLetter=b=>typeof b==='string';
const baseKey=b=>isLetter(b)?b:'#'+fT(b);
function find(st,id){
  const walk=(list,where,parent)=>{for(let i=0;i<list.length;i++){const f=list[i];if(f.id===id)return{list,idx:i,f,where,parent};if(f.f){const r=walk(f.f,where,f);if(r)return r}}return null};
  return walk(st.num,'num',null)||walk(st.den,'den',null);
}

/* ================= Lesari ================= */
function parseX(src){
  const s=String(src).replace(/\s/g,'').replace(/[−–]/g,'-').replace(/\*/g,'·');
  const parts=s.split('//');
  return{num:parseProd(parts[0]),den:parts[1]?parseProd(parts[1]):[]};
}
function parseProd(s){
  let i=0;const out=[];
  const expo=()=>{if(s[i]!=='^')return null;i++;
    if(s[i]==='{'){const j=s.indexOf('}',i);const e=parseLin(s.slice(i+1,j));if(!e)throw new Error('Veldisvísir?');i=j+1;return e}
    const m=s.slice(i).match(/^-?\d+/);if(!m)throw new Error('Veldisvísir vantar');i+=m[0].length;return E(+m[0])};
  const close=(j)=>{let d=1;j++;while(j<s.length&&d){if(s[j]==='(')d++;else if(s[j]===')')d--;j++}if(d)throw new Error('Svigi lokast ekki');return j};
  while(i<s.length){
    const ch=s[i];
    if(ch==='·'){i++;continue}
    if(ch==='('){const j=close(i);const inner=parseProd(s.slice(i+1,j-1));i=j;const e=expo();if(e)out.push(Gp(inner,e));else out.push(...inner);continue}
    if(ch==='R'){i++;const m=s.slice(i).match(/^\d*/);const k=m[0]?+m[0]:2;i+=m[0].length;if(s[i]!=='(')throw new Error('Rót: ( vantar');const j=close(i);out.push(Rt(k,parseProd(s.slice(i+1,j-1))));i=j;continue}
    if(ch==='-'||/\d/.test(ch)){
      let neg=false;if(ch==='-'){neg=true;i++}
      const m=s.slice(i).match(/^\d+(\/\d+)?/);
      let v;if(m){const[a,b]=m[0].split('/');v=new F(+a,b?+b:1);i+=m[0].length}else v=F1;
      if(neg)v=v.neg();
      const e=m?expo():null;
      if(e)out.push(Pw(v,e));else out.push(N(v));continue}
    if(/[a-z]/.test(ch)){i++;const e=expo()||E(1);out.push(Pw(ch,e));continue}
    throw new Error('Skil ekki „'+ch+'“');
  }
  return out;
}

/* ================= Tölugildi (til athugunar) ================= */
function valS(st,env){const pr=l=>l.reduce((r,f)=>r*valF(f,env),1);return pr(st.num)/pr(st.den)}
function valE(e,env){const x=isP(e)?pVal(e):e;return x.k.val()+x.n.val()*env.n}
function valF(f,env){
  if(f.t==='n')return f.v.val();
  if(f.t==='p')return Math.pow(isLetter(f.b)?env[f.b]:f.b.val(),valE(f.e,env));
  if(f.t==='g')return Math.pow(f.f.reduce((r,g)=>r*valF(g,env),1),valE(f.e,env));
  return Math.pow(f.f.reduce((r,g)=>r*valF(g,env),1),1/f.k);
}

/* ================= HTML ================= */
const numH=v=>v.d===1?String(Math.abs(v.n)):`<span class="fr"><span>${Math.abs(v.n)}</span><span>${v.d}</span></span>`;
function supH(f,I){
  if(isP(f.e))return `<sup class="pend"${I?` data-pend="${f.id}"`:''}>${pH(f.e)}</sup>`;
  if(f.t==='p'&&eOne(f.e))return '';
  return `<sup>${eH(f.e)}</sup>`;
}
function baseH(b){if(isLetter(b))return `<i>${b}</i>`;const s=(b.isNeg()?MINUS:'')+numH(b);return b.isNeg()||b.d!==1?'('+s+')':s}
function facH(f,I,o,lead){
  const sel=o.sel===f.id?' sel':'',hi=o.hi&&o.hi.includes(f.id)?' hint':'';
  const at=`class="fc k-${f.t}${sel}${hi}" data-id="${f.id}"`;
  if(f.t==='n'){
    const s=(f.v.isNeg()?MINUS:'')+numH(f.v);
    return `<span ${at}>${s}</span>`;
  }
  if(f.t==='p')return `<span ${at}>${baseH(f.b)}${supH(f,I)}</span>`;
  if(f.t==='g')return `<span ${at}><span class="par">(</span>${listH(f.f,I,o)}<span class="par">)</span>${supH(f,I)}</span>`;
  return `<span ${at}><span class="rsign">${f.k!==2?`<sup class="ri">${f.k}</sup>`:''}√</span><span class="rb">${listH(f.f,I,o)}</span></span>`;
}
function listH(list,I,o={}){
  let h='';
  list.forEach((f,i)=>{
    const nx=list[i+1];
    if(f.t==='n'&&nx&&f.v.isInt()&&Math.abs(f.v.n)===1&&nx.t!=='n'&&!(nx.t==='p'&&!isLetter(nx.b))){
      h+=f.v.isNeg()?`<span class="fc k-n" data-id="${f.id}">${MINUS}</span>`:`<span class="fc k-n one" data-id="${f.id}"></span>`;return;
    }
    if(i>0){const pv=list[i-1];
      const needDot=f.t==='n'||(f.t==='p'&&!isLetter(f.b))||(pv.t==='r'&&f.t==='r')||(pv.t==='g'&&f.t==='g')||(pv.t==='p'&&!isLetter(pv.b)&&f.t==='p'&&!isLetter(f.b));
      if(needDot)h+='<span class="dot">·</span>';}
    h+=facH(f,I,o);
  });
  return h;
}
function exprH(st,I=false,o={}){
  const n=listH(st.num,I,o)||'<span class="fc one1">1</span>';
  if(!st.den.length&&!(I&&o.showDen))return `<span class="xline">${n}</span>`;
  return `<span class="xline"><span class="xfrac"><span class="xnum" data-lvl="num">${n}</span><span class="xbar" data-drop="bar"></span><span class="xden" data-lvl="den">${listH(st.den,I,o)||(I?'<span class="ph">nefnari</span>':'1')}</span></span></span>`;
}

/* ================= Greining ================= */
function allF(st){const out=[];const w=(l,where,par)=>l.forEach(f=>{out.push({f,where,par});if(f.f)w(f.f,where,f)});w(st.num,'num',null);w(st.den,'den',null);return out}
const isPerfectPow=v=>{if(!v.isInt()||Math.abs(v.n)<4)return null;const n=Math.abs(v.n);for(let e=6;e>=2;e--){const b=Math.round(Math.pow(n,1/e));for(const bb of [b-1,b,b+1])if(bb>1&&Math.pow(bb,e)===n)return{b:bb,e}}return null};
function analyze(st){
  const A=allF(st);
  const pend=A.some(x=>(x.f.t==='p'||x.f.t==='g')&&isP(x.f.e));
  const roots=A.some(x=>x.f.t==='r'),groups=A.some(x=>x.f.t==='g');
  const top=[...st.num.map(f=>({f,w:'num'})),...st.den.map(f=>({f,w:'den'}))];
  const keys={};let dup=false;top.forEach(({f})=>{if(f.t==='p'){const k=baseKey(f.b);if(keys[k])dup=true;keys[k]=1}});
  const nn=st.num.filter(f=>f.t==='n').length,nd=st.den.filter(f=>f.t==='n').length;
  let numsOk=nn<=1&&nd<=1;
  if(nn===1&&nd===1){const a=st.num.find(f=>f.t==='n').v,b=st.den.find(f=>f.t==='n').v;if(!a.isInt()||!b.isInt()||gcd(a.n,b.n)>1)numsOk=false}
  if(st.num.some(f=>f.t==='n'&&f.v.isOne()&&st.num.length>1)||st.den.some(f=>f.t==='n'&&f.v.isOne()))numsOk=false;
  const numPow=top.some(({f})=>f.t==='p'&&!isLetter(f.b)&&!isP(f.e)&&eNum(f.e)&&f.e.k.isInt());
  const negE=top.some(({f})=>f.t==='p'&&!isP(f.e)&&eNegLook(f.e));
  const zeroE=top.some(({f})=>f.t==='p'&&!isP(f.e)&&eZero(f.e));
  const s1=!roots,s2=!groups,s3=!dup&&numsOk&&!pend&&!numPow&&!zeroE,s4=!negE;
  return{pend,roots,groups,dup,numsOk,numPow,negE,zeroE,s1,s2,s3,s4,done:s1&&s2&&s3&&s4&&!pend};
}

/* ================= Aðgerðir ================= */
// Hver aðgerð skilar {st,tag,lab,msg} eða {prompt} eða {err}
const BL=b=>isLetter(b)?`<i>${b}</i>`:baseH(b);
function opCombine(st0,ida,idb){
  const st=cloneS(st0),A=find(st,ida),B=find(st,idb);
  if(A.list!==B.list){
    if(A.parent||B.parent)return{err:'Þessir þættir eru ekki á sama stað. Opnaðu svigann eða rótina fyrst.'};
    return opCross(st,A,B);
  }
  const a=A.f,b=B.f;
  if([a,b].some(f=>(f.t==='p'||f.t==='g')&&isP(f.e)))return{err:'Reiknaðu fyrst veldisvísinn sem er merktur (smelltu á hann).'};
  if(a.t==='n'&&b.t==='n'){
    const r=a.v.mul(b.v);
    return{prompt:{kind:'num',lhs:`${fv(a.v)} · ${fv(b.v)}`,exp:r,lab:'',tag:'tölur saman',
      fb:v=>v.eq(r.neg())?'Formerkið: '+(a.v.isNeg()!==b.v.isNeg()?'plús sinnum mínus er mínus.':'mínus sinnum mínus er plús.'):v.eq(a.v.add(b.v))?'Hér á að margfalda, ekki leggja saman.':'',
      apply:()=>{A.list.splice(B.idx,1,N(r));A.list.splice(A.list.indexOf(a),1);return st},
      msg:`Tölurnar margfaldaðar: ${fv(a.v)} · ${fv(b.v)} = ${fv(r)}.`}};
  }
  if(a.t==='r'&&b.t==='r'){
    if(a.k!==b.k)return{err:'Aðeins rætur með sama rótarvísi má setja undir eina rót.'};
    const m=Rt(a.k,[...a.f,...b.f]);B.list.splice(B.idx,1,m);B.list.splice(B.list.indexOf(a),1);
    return{st,tag:'sami rótarvísir',lab:'R1',msg:'Sami rótarvísir: allt sett undir eina rót. Nú má sameina undir rótinni.'};
  }
  if(a.t==='p'&&b.t==='p'){
    if(baseKey(a.b)!==baseKey(b.b))return{err:`Ólíkir stofnar: ${BL(a.b)} og ${BL(b.b)}. Aðeins sami stofn sameinast.`};
    const nf=Pw(a.b,{op:'+',a:a.e,b:b.e});B.list.splice(B.idx,1,nf);B.list.splice(B.list.indexOf(a),1);
    return{st,tag:'sami stofn',lab:'V1',msg:`Sami stofn margfaldaður: veldisvísarnir lagðir saman. Smelltu á veldisvísinn til að reikna.`,fresh:[nf.id]};
  }
  if(a.t==='g'||b.t==='g')return{err:'Opnaðu svigann fyrst: smelltu á veldið við svigann.'};
  if(a.t==='r'||b.t==='r')return{err:'Breyttu rótinni fyrst í brotið veldi: smelltu á rótarmerkið.'};
  return{err:'Tala og bókstafur sameinast ekki. Tölur saman, stafir saman.'};
}
function opCross(st,A,B){
  const top=A.where==='num'?A:B,bot=A.where==='num'?B:A,a=top.f,b=bot.f;
  if([a,b].some(f=>(f.t==='p'||f.t==='g')&&isP(f.e)))return{err:'Reiknaðu fyrst veldisvísinn sem er merktur.'};
  if(a.t==='n'&&b.t==='n'){
    const r=a.v.div(b.v);
    return{prompt:{kind:'num',lhs:`${fv(a.v)} : ${fv(b.v)}`,exp:r,tag:'tölur deilt',lab:'',
      fb:v=>v.eq(b.v.div(a.v))?'Teljarinn deilt með nefnaranum, ekki öfugt.':'',
      apply:()=>{top.list.splice(top.list.indexOf(a),1);bot.list.splice(bot.list.indexOf(b),1);
        if(r.n!==1)st.num.unshift(N(r.n));if(r.d!==1)st.den.unshift(N(r.d));return st},msg:`Stytt: ${fv(a.v)} : ${fv(b.v)} = ${fv(r)}.`}};
  }
  if(a.t==='p'&&b.t==='p'){
    if(baseKey(a.b)!==baseKey(b.b))return{err:`Ólíkir stofnar: ${BL(a.b)} og ${BL(b.b)}. Aðeins sami stofn styttist.`};
    const both=eNum(a.e)&&eNum(b.e)&&!eNegLook(a.e)&&!eNegLook(b.e);
    if(!both){
      const nf=Pw(a.b,{op:'−',a:a.e,b:b.e});top.list.splice(top.list.indexOf(a),1,nf);bot.list.splice(bot.list.indexOf(b),1);
      return{st,tag:'deiling, sami stofn',lab:'V2',msg:'Sami stofn uppi og niðri: veldi niðri dregið frá veldinu uppi. <b>SVIGI</b> utan um það sem er dregið frá!',fresh:[nf.id]};
    }
    const cmp=a.e.k.val()-b.e.k.val(),ok=cmp>0?'u':cmp<0?'d':'j';
    return{prompt:{kind:'choice',lhs:`${BL(a.b)}<sup>${eH(a.e)}</sup> uppi og ${BL(a.b)}<sup>${eH(b.e)}</sup> niðri. Hvar eru fleiri ${BL(a.b)}?`,
      choices:[['u','Uppi'],['d','Niðri'],['j','Jafnmörg']],ok,
      wrong:`Uppi eru ${eT(a.e)} stykki og niðri ${eT(b.e)}. ${ok==='u'?'Fleiri uppi':ok==='d'?'Fleiri niðri':'Jafnmörg'}.`,
      apply:()=>{
        top.list.splice(top.list.indexOf(a),1);bot.list.splice(bot.list.indexOf(b),1);
        if(ok==='d')bot.list.splice(bot.idx>bot.list.length?bot.list.length:bot.idx,0,Pw(a.b,{op:'−',a:b.e,b:a.e}));
        else top.list.splice(Math.min(top.idx,top.list.length),0,Pw(a.b,{op:'−',a:a.e,b:b.e}));
        return st},tag:'deiling, sami stofn',lab:'V2',
      msg:ok==='j'?'Jafnmörg uppi og niðri: veldið verður 0.':`Afgangurinn fer þangað sem fleiri voru (${ok==='u'?'uppi':'niðri'}). Stærra veldið mínus það minna.`}};
  }
  return{err:'Aðeins sami stofn styttist upp og niður (eða tölur).'};
}
const fv=v=>(v.isNeg()?'('+fT(v)+')':fT(v));
function opMove(st0,id){
  const st=cloneS(st0),A=find(st,id),f=A.f;
  if(A.parent)return{err:'Opnaðu svigann eða rótina fyrst.'};
  if(f.t!=='p'||isP(f.e))return{err:'Aðeins þáttur með <b>mínus-veldi</b> fer yfir brotastrikið. Þá verður veldið jákvætt.'};
  if(!eNegLook(f.e))return{err:`${BL(f.b)}<sup>${eH(f.e)}</sup> hefur jákvætt veldi og á að vera kyrrt. Aðeins mínus-veldi fara yfir strikið.`};
  A.list.splice(A.idx,1);const nf=Pw(f.b,eNeg(f.e));(A.where==='num'?st.den:st.num).push(nf);
  return{st,tag:'neikvætt veldi',lab:'V6',msg:`${BL(f.b)}<sup>${eH(f.e)}</sup> fór yfir brotastrikið og varð ${BL(f.b)}<sup>${eH(nf.e)}</sup>. Mínusinn í veldinu hverfur.`,fresh:[nf.id]};
}
function opTap(st0,id,pendHit){
  const st=cloneS(st0);let A=find(st,id);if(!A)return null;let f=A.f;
  // pending veldisvísir
  if((f.t==='p'||f.t==='g')&&isP(f.e)){
    const p=f.e,r=pVal(p);

function expFb(p,r,v,tries){

    const wrong=new F(p.a.k.n+p.b.k.n,p.a.k.d+p.b.k.d);if(eNum(v)&&v.k.eq(wrong))return`Samnefna fyrst! Ekki leggja saman nefnarana. Finndu sameiginlegan nefnara.`;

function numPowFb(b,e,r,v){

function normalize(st){

      if(f.t==='p'&&!isLetter(f.b)&&!isP(f.e)&&eOne(f.e))l[i]=N(f.b);

    for(let i=l.length-1;i>=0;i--)if(l[i].t==='n'&&l[i].v.isOne()&&l.length>1)l.splice(i,1)};

function nextAction(st){

  for(const x of A)if((x.f.t==='p'||x.f.t==='g')&&isP(x.f.e))return{kind:'tap',id:x.f.id,h:'Smelltu á merkta veldisvísinn og reiknaðu hann.',step:0};
  for(const x of A)if(x.f.t==='p'&&!isLetter(x.f.b)&&eNum(x.f.e)&&x.f.e.k.isInt()&&!x.f.e.k.isNeg()&&!(x.par&&x.par.t==='r'))return{kind:'tap',id:x.f.id,h:`Reiknaðu ${baseH(x.f.b)}<sup>${eH(x.f.e)}</sup>: smelltu á það.`,step:3};
  for(const x of A)if(x.f.t==='p'&&eNum(x.f.e)&&eZero(x.f.e))return{kind:'tap',id:x.f.id,h:'Veldið 0: smelltu á þáttinn. Mundu: a⁰ = 1.',step:3};
  // rætur
  for(const L of [st.num,st.den]){const rs=L.filter(f=>f.t==='r');for(let i=0;i<rs.length;i++)for(let j=i+1;j<rs.length;j++)if(rs[i].k===rs[j].k)return{kind:'drag',a:rs[i].id,b:rs[j].id,h:'Sami rótarvísir: dragðu aðra rótina ofan á hina svo allt fari undir eina rót.',step:1}}
  for(const x of A)if(x.f.t==='n'&&x.par&&x.par.t==='r'&&isPerfectPow(x.f.v))return{kind:'tap',id:x.f.id,h:`FACT: smelltu á ${fT(x.f.v)} og skrifaðu hana sem veldi.`,step:1};
  for(const x of A)if(x.f.t==='r')return{kind:'tap',id:x.f.id,h:'① Rót → brotið veldi: smelltu á rótarmerkið.',step:1};
  for(const x of A)if(x.f.t==='g')return{kind:'tap',id:x.f.id,h:'② Sviginn: smelltu á veldið við svigann. Það fer á alla þættina.',step:2};
  for(const x of A)if(x.f.t==='p'&&!isLetter(x.f.b)&&eNum(x.f.e)&&!x.f.e.k.isInt()&&isPerfectPow(x.f.b))return{kind:'tap',id:x.f.id,h:`FACT: smelltu á ${fT(x.f.b)} og skrifaðu hana sem veldi.`,step:1};
  for(const L of [st.num,st.den]){
    const seen={};for(const f of L){const k=f.t==='n'?'#num':f.t==='p'?baseKey(f.b):null;if(!k)continue;if(seen[k])return{kind:'drag',a:f.id,b:seen[k].id,h:k==='#num'?'Tölurnar saman: dragðu aðra töluna á hina.':`③ Sami stofn: dragðu ${BL(f.b)} á hinn ${BL(f.b)}-ið.`,step:3};seen[k]=f}}
  for(const a of st.num){if(a.t==='n')continue;const b=st.den.find(g=>g.t==='p'&&a.t==='p'&&baseKey(g.b)===baseKey(a.b));if(b)return{kind:'drag',a:a.id,b:b.id,h:`③ Sami stofn uppi og niðri: dragðu ${BL(a.b)} uppi á ${BL(a.b)} niðri.`,step:3}}
  const na=st.num.find(f=>f.t==='n'),nd=st.den.find(f=>f.t==='n');
  if(na&&nd&&(gcd(na.v.n,nd.v.n)>1||!na.v.isInt()||!nd.v.isInt()))return{kind:'drag',a:na.id,b:nd.id,h:'Styttu tölurnar: dragðu töluna uppi á töluna niðri.',step:3};
  if(nd&&nd.v.isOne())return{kind:'none',h:'',step:4};
  for(const L of [st.num,st.den])for(const f of L)if(f.t==='p'&&!isP(f.e)&&eNegLook(f.e))return{kind:'move',id:f.id,h:`④ Mínus-veldi: dragðu ${BL(f.b)}<sup>${eH(f.e)}</sup> yfir brotastrikið.`,step:4};
  return null;

const TAGMAP={'V1':'v1','V2':'v2','V5':'v5','V3':'v3','V6':'neg','R1':'root','FACT':'fact','0':'zero','':'num'};
function autoSolve(st,max=80){

const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const L1=()=>pick(['x','a','b','y']);
const ex=(b,e)=>e===1?b:`${b}^${e}`;
const GEN={
  v1:()=>{const b=L1(),c=pick(['y','x','a','b'].filter(q=>q!==b));return pick([`${ex(b,R(2,6))}${ex(b,R(2,6))}`,`${R(2,5)}${ex(b,R(1,5))}·${R(2,5)}${ex(b,R(2,5))}`,`${ex(b,R(2,4))}${ex(c,R(1,3))}·${ex(b,R(1,4))}${ex(c,R(2,4))}`])},
  v5:()=>{const b=L1();return pick([`(${b}^${R(2,5)})^${R(2,4)}`,`${ex(b,R(1,4))}(${b}^${R(2,4)})^${R(2,3)}`])},
  v3:()=>{const b=L1();return pick([`(${R(2,3)}${b}^${R(2,4)})^${R(2,3)}`,`${ex(b,R(1,3))}(${R(2,3)}${b}^${R(2,3)}y^${R(2,4)})^${R(2,3)}`,`(${pick([2,3])}${b}y^${R(2,4)})^2`])},
  v2:()=>{const b=pick(['a','x']),c=b==='a'?'b':'y';let p,q,r,s;do{p=R(1,7);r=R(1,7);q=R(1,7);s=R(1,7)}while(p===r||q===s);const d=R(2,4);return pick([`${ex(b,p)}${ex(c,q)}//${ex(b,r)}${ex(c,s)}`,`${d*R(2,4)}${ex(b,R(4,8))}//${d}${ex(b,R(1,3))}`,`${ex(b,p)}${ex(c,q)}${b}//${c}${ex(b,r)}${ex(c,s)}`])},
  minus:()=>{const m=pick([2,3]),k=m*m*R(1,3),b=L1();return pick([`${k}${ex(b,R(1,3))}(-1/${m}${b})^2`,`(-${b}^${R(2,3)})^3`,`(-2${b})^4//${pick([4,8])}${b}^${R(1,3)}`,`(-${b}^2)^${pick([2,3])}${b}`])},
  mix1:()=>GEN[pick(['v1','v5','v3','v2'])](),
  neg:()=>{const b=L1(),c=b==='y'?'x':'y';return pick([`${R(2,5)}${b}^{-${R(1,4)}}${ex(c,R(1,3))}`,`${ex(b,R(1,4))}//${b}^{-${R(1,3)}}`,`${b}^{-${R(1,3)}}${c}//${ex(b,R(1,3))}${c}^{-${R(1,3)}}`])},
  nexp:()=>{const p=R(2,3),q=R(2,6),r=R(1,4);return pick([`a^{${p}n+${q}}//a^{n+${r}}`,`x^{n+${R(1,3)}}x^{${R(1,3)}-n}`,`a^{n+${R(1,3)}}a^{${R(1,2)}-2n}//a^{${R(2,4)}+n}a`,`(x^{${R(2,3)}n})^2//(-x^{n-${R(1,3)}})^2`])},
  root:()=>{const b=L1(),s=R(2,9),c=R(2,4),d=R(2,6);return pick([`R(${s*s}${b}^${2*R(1,4)})`,`R3(${c*c*c}${b}^${3*R(1,3)})`,`R3(${c*c*c})//R(${d*d})`,`R(${s*s}${b}^${2*R(2,4)})//R(${d*d}${b}^2)`])},
  frac:()=>{const b=L1(),c=pick([2,3]);return pick([`(${c**4}${b}^2)^{1/4}`,`${b}^{1/2}${b}^{1/3}`,`${b}^{1/2}${b}^{1/4}//${b}^{3/4}`,`${b}^{2/3}${b}^{1/3}//${b}^{1/2}${b}^{1/2}`,`(${c*c}${b}^4)^{1/2}`])},
  rootmerge:()=>{const p=R(1,2),q=R(1,2);return pick([`R3(a^${p}b^${q})R3(a^${3-p}b^${6-q})`,`R(2x^${pick([1,3])})R(8x^${pick([1,3])})`,`R3(x^2y)R3(x^${pick([1,4])}y^2)`])},
  mixall:()=>GEN[pick(['v1','v3','v2','minus','neg','nexp','root','frac','rootmerge'])]()
};

function powStrH(s){ // '(-2/3)^2' -> html
  const m=s.match(/^(-?)(\()?(-?)(\d+)(?:\/(\d+))?\)?\^(\d+)$/);

}
