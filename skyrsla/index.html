<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#183e43">
<title>Skýrslusmiðja farartækja</title>
<style>
:root{--ink:#183e43;--muted:#5d7373;--paper:#f7f6f1;--line:#dce3df;--accent:#177d88;--warn:#9a5a1e;--warnbg:#fbf1e4;--ok:#2f7a4f;--okbg:#e7f3ec;--bad:#a3402a;--card:#fff;--soft:#eef3f0;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600}
button:hover{background:#eaf1ed}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.primary:hover{background:#286169}
button.small{padding:4px 10px;font-size:13px;border-radius:8px}
button.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;font-weight:600}
:focus-visible{outline:3px solid #dfaa53;outline-offset:2px}
input,select,textarea{border:1px solid #cad5cf;border-radius:9px;padding:9px 11px;background:#fff;width:100%}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--accent)}
textarea{resize:vertical;min-height:110px;line-height:1.5}
h1{font:600 30px/1.2 Georgia,serif;margin:0 0 8px}
h2{font-size:21px;margin:0 0 6px}
p{margin:0 0 10px}
.muted{color:var(--muted)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:12px;align-items:center}
.brand b{font-size:26px;letter-spacing:-1px;border-left:5px solid var(--accent);padding-left:12px}
.brand span{font-size:12px;color:var(--muted);line-height:1.35}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.reminder{background:var(--warnbg);color:var(--warn);border-bottom:1px solid #ecd6b8;padding:8px 24px;font-size:14px}
.reminder b{color:#7a4413}

.shell{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1180px;margin:0 auto;gap:24px;padding:22px 24px 60px}
.steps{position:sticky;top:12px;align-self:start;display:flex;flex-direction:column;gap:2px}
.steps button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:10px;font-weight:550;color:var(--muted)}
.steps button:hover{background:#eaf1ed}
.steps button[aria-current=step]{background:var(--ink);color:#fff}
.steps .dot{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--ink);font-size:12px;font-weight:700}
.steps .done .dot{background:var(--ok);color:#fff}
.steps .part .dot{background:#f1dcbf;color:#7a4413}
.steps button[aria-current=step] .dot{box-shadow:0 0 0 2px #fff}
.progress{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:4px 10px 12px}
.progress i{display:block;height:100%;background:var(--ok);transition:width .3s}
.ptext{font-size:12px;color:var(--muted);margin:0 10px}

.head{margin-bottom:18px}
.head .eyebrow{font-size:12px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.head p{color:var(--muted);max-width:720px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.q{margin-bottom:6px}
.q>label,.q>.lbl{display:block;font-weight:700;margin-bottom:4px;font-size:16px}
.q .req{color:var(--bad);font-weight:700}
.help{font-size:14px;color:var(--muted);margin:0 0 10px}
.help ul{margin:4px 0 0;padding-left:20px}
.starters{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.starters span{font-size:12px;color:var(--muted);align-self:center}
.starters button{font-size:13px;font-weight:500;padding:3px 10px;border-radius:99px;background:var(--soft);border-color:transparent}
.meter{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:12px;color:var(--muted)}
.meter .bar{flex:0 0 110px;height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;background:#d39b52}
.meter.good .bar i{background:var(--ok)}
.meter.good b{color:var(--ok)}
details.ex{margin-top:10px;font-size:14px;border-left:3px solid var(--accent);padding:2px 0 2px 12px}
details.ex summary{cursor:pointer;color:var(--accent);font-weight:600}
details.ex blockquote{margin:8px 0 2px;font-style:italic;color:#335}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}

.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.goal{display:block;border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:#fff}
.goal:has(input:checked){border-color:var(--accent);background:#eef7f7}
.goal b{display:block;margin-bottom:4px}
.goal small{color:var(--muted);font-size:13px;display:block}
.goal input{float:right}

.concepts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.concept{display:flex;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:#fff}
.concept:has(input:checked){border-color:var(--accent);background:#eef7f7}
.concept b{display:block}
.concept small{color:var(--muted);font-size:13px;line-height:1.4;display:block}

.photo{border:2px dashed #b9c8c1;border-radius:14px;padding:16px;text-align:center;background:#fafcfb}
.photo.has{border-style:solid;border-color:var(--line);padding:10px}
.photo.must:not(.has){border-color:#d39b52;background:var(--warnbg)}
.photo img{max-width:100%;max-height:340px;border-radius:10px;display:block;margin:0 auto 10px}
.photo .act{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pick{display:inline-block;background:var(--ink);color:#fff;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer}
.pick:hover{background:#286169}
.pick input{display:none}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:10px}
.gitem{border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff}
.gitem img{width:100%;height:140px;object-fit:cover;border-radius:8px;display:block;margin-bottom:6px}
.gitem input{font-size:13px;padding:6px 8px}
.gitem .bar2{display:flex;justify-content:space-between;margin-top:6px}

table.grid{width:100%;border-collapse:collapse;font-size:14px}
table.grid th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:6px;border-bottom:1px solid var(--line)}
table.grid td{padding:4px;border-bottom:1px solid #eef2ef;vertical-align:middle}
table.grid input,table.grid select{padding:6px 8px;font-size:14px}
.wrapx{overflow-x:auto}
.sum{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:15px}
.sum.ok{background:var(--okbg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{font-size:13px;font-weight:500;padding:3px 10px;border-radius:99px}

.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #eef2ef;cursor:pointer}
.check input{margin-top:5px;width:18px;height:18px}
.alert{border-radius:14px;padding:14px 16px;margin-bottom:16px;font-size:15px}
.alert.warn{background:var(--warnbg);border:1px solid #ecd6b8;color:#6e3e12}
.alert.ok{background:var(--okbg);border:1px solid #bfe0cb;color:#1f5a38}
.alert ul{margin:6px 0 0;padding-left:20px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:20}
.toast.show{opacity:1}
.selfrow{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid #eef2ef}
.selfrow textarea{min-height:70px;grid-column:1/-1}
.selfrow b{display:block}
.selfrow small{color:var(--muted)}

/* skýrslan */
.paper{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 24px rgba(24,62,67,.08);padding:56px 64px;max-width:820px;margin:0 auto}
.report{font:15.5px/1.6 Arial,"Helvetica Neue",sans-serif;color:#1a1a1a}
.report h1{font:700 30px/1.2 Arial,sans-serif;text-align:center;margin:0 0 6px;color:#111}
.report h2{font:400 23px/1.3 Arial,sans-serif;margin:30px 0 10px;color:#111;break-after:avoid}
.report h3{font:700 15.5px/1.4 Arial,sans-serif;margin:16px 0 4px;break-after:avoid}
.report p{margin:0 0 10px}
.report ul{margin:0 0 10px;padding-left:24px}
.report blockquote{margin:6px 0 14px 36px;font-style:italic}
.report figure{margin:12px 0;break-inside:avoid;text-align:center}
.report figure img{max-width:100%;max-height:420px;border-radius:2px}
.report figcaption{font-size:13px;color:#555;margin-top:4px}
.report table{border-collapse:collapse;margin:8px 0 14px;font-size:14.5px;break-inside:avoid}
.report th,.report td{border:1px solid #333;padding:6px 10px;text-align:left;vertical-align:top}
.report th{font-weight:700;background:#f3f3f3}
.report .cover{display:flex;flex-direction:column;min-height:900px;break-after:page;padding-top:30px}
.report .cover .sub{text-align:center;color:#444;margin-bottom:22px}
.report .cover .main img{max-height:440px}
.report .cover .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.report .cover .foot figure{margin:0;flex:0 0 46%}
.report .cover .foot figure img{max-height:220px}
.report .cover .meta{text-align:right;font-size:14.5px;line-height:1.55}
.report .ph{border:2px dashed #999;color:#777;background:#fafafa;display:flex;align-items:center;justify-content:center;min-height:180px;font-style:italic;padding:12px}
.report .cover .main .ph{min-height:320px}
.report .missing{background:#fff1d6;color:#8a4b0d;font-style:italic;padding:0 4px;border-radius:3px}
.report .pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.report .pics figure{margin:0}
.report .pics img{width:100%;height:150px;object-fit:cover}
.report .dots{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 12px}
.report .dots span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;background:#bbb}
.report .dots .y{background:#2f7a4f}.report .dots .n{background:#b5543a}
.report .box{border:1px solid #333;padding:10px 14px;margin:8px 0 16px;break-inside:avoid}
.report .appendix{break-before:page}
.report td.num{text-align:center;white-space:nowrap}

@media screen and (max-width:820px){
  .shell{grid-template-columns:1fr;padding:14px 16px 50px;gap:12px}
  .steps{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .steps button .t{display:none}
  .steps button[aria-current=step] .t{display:inline;white-space:nowrap}
  .progress,.ptext{display:none}
  .top,.reminder{padding-left:16px;padding-right:16px}
  .paper{padding:24px 18px}
  .report .cover{min-height:0}
  .report .cover .foot{flex-direction:column;align-items:stretch}
  .report .cover .meta{text-align:left}
}
@page{size:A4;margin:18mm 18mm 16mm}
@media print{
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .noprint,.top,.reminder,.steps,.toast{display:none!important}
  .shell{display:block;padding:0;max-width:none}
  .paper{border:0;box-shadow:none;padding:0;max-width:none;border-radius:0}
  .report .cover{min-height:250mm;padding-top:10mm}
  .report .missing{background:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Skýrslusmiðja</b><span>Vísindasmiðja · Farartæki<br>Hanna · smíða · prófa · bæta</span></div>
  <div class="tools">
    <button id="bSave" title="Sækja öryggisafrit af allri vinnunni (líka myndum)">Vista afrit</button>
    <button id="bOpen" title="Opna öryggisafrit sem var vistað áður">Opna afrit</button>
    <button id="bReset" title="Hreinsa allt og byrja á nýrri skýrslu">Ný skýrsla</button>
  </div>
</header>
<div class="reminder">📸 <b>Munið:</b> takið mynd af <b>lokaafurðinni</b> og af <b>stöðinni ykkar eftir frágang</b>. Skýrslan verður ekki tilbúin til útprentunar fyrr en báðar myndirnar eru komnar inn.</div>
<div class="shell">
  <nav class="steps" id="steps" aria-label="Skref"></nav>
  <main id="view" tabindex="-1"></main>
</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ---------- Gögn ---------- */
const GOALS={
  sigla:{name:'Siglt með farm',short:'Sigling',
    crit:'Tækið siglir með farm yfir Bugðu, t.d. hálfan lítra af vatni (500 g). Band er í tækinu svo hægt sé að ná því til baka.',
    measure:'Farmur (g)',ok:'Komst yfir með farminn?',
    rq:'Er hægt að smíða farartæki sem siglir yfir Bugðu með 500 g farm og hvernig hafa flotkraftur og knýr (t.d. frá teygju eða blöðru) áhrif á það hvort tækið kemst yfir?',
    measures:['Massi tækisins tóms (g)','Mesti farmur sem tækið bar (g)','Lengd tækisins (cm)','Breidd tækisins (cm)','Tími yfir ána (s)','Breidd árinnar (m)'],
    concepts:['flot','thyngd','knyr','teygja','massamidja','thettleiki']},
  flug:{name:'Flug og lending',short:'Flug',
    crit:'Tækið lendir á sama stað í a.m.k. 3 af 10 tilraunum þegar það flýgur 5 metra eða lengra – EÐA flýgur þvert yfir Sólina á skólalóðinni (eða sambærilega vegalengd inni) í 3 af 10 tilraunum.',
    measure:'Vegalengd (m)',ok:'Lenti á markstaðnum?',
    rq:'Er hægt að smíða farartæki sem flýgur a.m.k. 5 metra og lendir á sama stað í 3 af 10 tilraunum og hvaða áhrif hafa lögun vængja og þyngdardreifing á flugið?',
    measures:['Massi tækisins (g)','Vænghaf (cm)','Lengd tækisins (cm)','Lengsta flug (m)','Meðalvegalengd (m)','Fjarlægð frá markstað að meðaltali (cm)'],
    concepts:['lyfti','loftmot','thyngd','massamidja','knyr','tregda']},
  stigi:{name:'Nákvæm ferð niður stiga',short:'Stigi',
    crit:'Tækinu er ýtt fram af tröppu í stiganum með margföldunartöflunni. Það fer sjálft yfir næstu tröppu fyrir neðan en stoppar í tröppunni þar fyrir neðan, í a.m.k. 3 af 10 tilraunum.',
    measure:'Hvar stoppaði tækið?',ok:'Stoppaði í réttri tröppu?',
    rq:'Er hægt að smíða farartæki sem fer sjálft yfir eina tröppu og stoppar í þeirri næstu í 3 af 10 tilraunum og hvernig hafa núningur og hreyfiorka áhrif á hvar það stoppar?',
    measures:['Massi tækisins (g)','Lengd tækisins (cm)','Hæð tröppu (cm)','Dýpt tröppu (cm)','Efni undir tækinu (þar sem það snertir)'],
    concepts:['orka','nuning','thyngd','tregda','massamidja']}
};
const CONCEPTS=[
  {id:'thyngd',n:'Þyngdarafl',d:'Jörðin togar allt niður. Þyngd = massi × 9,8 N/kg.'},
  {id:'flot',n:'Flotkraftur',d:'Vatnið ýtir hlutnum upp jafn fast og þyngd vatnsins sem hann ryður frá sér (lögmál Arkímedesar).'},
  {id:'thettleiki',n:'Eðlismassi',d:'Hversu mikill massi er í ákveðnu rúmmáli. Hlutur með minni eðlismassa en vatn flýtur.'},
  {id:'lyfti',n:'Lyftikraftur',d:'Vængir beina loftinu niður og loftið ýtir vængnum upp á móti.'},
  {id:'loftmot',n:'Loftmótstaða',d:'Loftið hægir á hlut á hreyfingu. Stærri flötur og meiri hraði gefa meiri mótstöðu.'},
  {id:'nuning',n:'Núningur',d:'Kraftur þar sem fletir snertast. Hann vinnur á móti hreyfingu og getur stöðvað tæki.'},
  {id:'knyr',n:'Verkun og gagnverkun',d:'3. lögmál Newtons: ef tækið ýtir lofti eða vatni aftur á bak ýtir það tækinu áfram.'},
  {id:'tregda',n:'Tregða',d:'1. lögmál Newtons: hlutur heldur áfram á sömu ferð nema kraftur breyti hreyfingunni.'},
  {id:'orka',n:'Stöðuorka og hreyfiorka',d:'Þegar tækið fer niður breytist stöðuorka í hreyfiorku. Núningur breytir henni svo í varma.'},
  {id:'teygja',n:'Teygjuorka',d:'Teygja eða blaðra geymir orku sem breytist í hreyfiorku þegar hún losnar.'},
  {id:'massamidja',n:'Massamiðja og jafnvægi',d:'Hvar þyngdin er staðsett ræður því hvort tækið er stöðugt, veltur eða stingst niður.'},
  {id:'thrystingur',n:'Þrýstingur',d:'Kraftur sem dreifist á flöt. Loft í blöðru er undir þrýstingi og streymir út.'}
];
const SELF=[
  {id:'honnun',n:'Hönnun og útlit',max:3},
  {id:'skyrsla',n:'Skýrslugerð um hönnun, smíði og prófun tækisins',max:5},
  {id:'samheldni',n:'Samheldni í hópnum, vinnubrögð og stemning',max:3},
  {id:'arangur',n:'Árangur við að leysa markmiðið',max:3},
  {id:'umgengni',n:'Umgengni og frágangur',max:5},
  {id:'frumleiki',n:'Frumleiki',max:5}
];
const CHECKS=[
  'Rusl er komið í ruslið og flokkað rétt',
  'Afgangsefni er skilað á sinn stað',
  'Verkfæri eru komin á sinn stað (límbyssur teknar úr sambandi)',
  'Borð og gólf við stöðina eru hrein',
  'Stólar eru komnir á sinn stað',
  'Farartækið er geymt á merktum stað',
  'Hermes (sendiboðinn) fór í Hádegismóa og hjálpaði til við frágang þar'
];
const EX={
  purpose:'Í þessari tilraun ætlum við að kanna hvort hægt sé að byggja hring úr Pringles-flögum sem stendur sjálfur, án þess að nota lím, límband eða annan stuðning. Við viljum einnig skoða hvaða kraftar gera það mögulegt að flögurnar haldist saman þótt ekkert sé að festa þær.',
  rq:'Er hægt að byggja sjálfberandi hring úr Pringles-flögum án líms eða annars stuðnings og hvað veldur því að hringurinn helst uppi?',
  hypothesis:'Við höldum að flögurnar geti stutt hver aðra ef þeim er raðað nógu þétt saman og hver flaga skarast við þá næstu. Við teljum að þyngdarafl og núningur hafi áhrif á það hvort hringurinn stendur eða hrynur.',
  hardest:'Við teljum að erfiðasti hluti verkefnisins verði að loka hringnum án þess að hann hrynji.',
  build:'Fyrst tókum við nokkrar Pringles-flögur og skoðuðum lögun þeirra. Við tókum eftir því að flögurnar eru bognar og geta því legið hver upp að annarri á ákveðinn hátt. […] Fyrsta tilraunin hrundi áður en okkur tókst að loka hringnum. Við prófuðum því aftur og breyttum því hvernig flögurnar sköruðust.',
  results:'Í fyrstu þremur tilraununum hrundi byggingin áður en okkur tókst að loka hringnum. Við tókum eftir því að hringurinn varð stöðugri þegar flögurnar sköruðust hæfilega mikið og hallinn á þeim var svipaður.',

/* ---------- Ástand og vistun ---------- */
const today=()=>new Date().toISOString().slice(0,10);
const blank=()=>({v:1,a:{date:today(),subject:'Þemadagar – Vísindasmiðja'},concepts:[],trials:Array.from({length:10},()=>({ver:'1',val:'',ok:'',note:''})),measures:[],photos:{},gal:{},roles:{},checks:{},self:{},step:0});
let S=blank();
const DB={db:null,
  open(){return new Promise(r=>{try{const q=indexedDB.open('nasa-skyrsla',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{this.db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})},
  get(k){return new Promise(r=>{if(!this.db)return r(null);try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})},
  set(k,v){return new Promise(r=>{if(!this.db)return r(false);try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>r(true);t.onerror=()=>r(false)}catch(e){r(false)}})}
};
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(async()=>{const ok=await DB.set('state',S);if(!ok)toast('Ekki tókst að vista í vafranum – munið að „Vista afrit“.')},400)}
function changed(){save();renderSteps()}

/* ---------- Hjálparföll ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const words=s=>(s||'').trim().split(/\s+/).filter(Boolean).length;
const lines=s=>(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
const members=()=>lines(S.a.members);
const goal=()=>GOALS[S.a.goal]||null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800)}
function joinNames(a){return a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' og '+a[a.length-1]}
const MON=['janúar','febrúar','mars','apríl','maí','júní','júlí','ágúst','september','október','nóvember','desember'];
function isDate(d){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||'');return m?`${+m[3]}. ${MON[+m[2]-1]} ${m[1]}`:''}
function allFields(st){const out=[];(st.f||[]).forEach(f=>f.type==='row'?out.push(...f.f):out.push(f));return out}
function trialStats(){const t=S.trials.filter(x=>x.ok);const y=t.filter(x=>x.ok==='ja').length;return{n:t.length,y,rate:t.length?Math.round(100*y/t.length):0}}

function fieldDone(f){
  const a=S.a;
  switch(f.type){
    case 'text':case 'date':case 'goal':case 'radio':return !!(a[f.k]||'').trim();
    case 'area':return f.min?words(a[f.k])>=f.min:!!(a[f.k]||'').trim();
    case 'lines':return lines(a[f.k]).length>=(f.min||1);
    case 'photo':return !!S.photos[f.k];
    case 'gallery':return (S.gal[f.k]||[]).length>0;
    case 'concepts':return S.concepts.length>=2;
    case 'conceptx':return S.concepts.length>0&&S.concepts.every(c=>words(a['c_'+c])>=15);
    case 'trials':return trialStats().n>=3;
    case 'measures':return S.measures.filter(m=>m.l&&m.v).length>=2;
    case 'roles':{const m=members();return m.length>0&&m.every(n=>(S.roles[n]||'').trim())}
    case 'checks':return CHECKS.every((_,i)=>S.checks[i]);
    case 'self':return SELF.every(c=>S.self[c.id]&&S.self[c.id].s&&words(S.self[c.id].w)>=8);
  }
  return true;
}
function stepProgress(st){const fs=allFields(st).filter(f=>f.need);if(!fs.length)return null;const d=fs.filter(fieldDone).length;return{d,n:fs.length}}

/* ---------- Valmynd ---------- */
function renderSteps(){
  let D=0,N=0;
  const h=STEPS.map((st,i)=>{const p=stepProgress(st);if(p){D+=p.d;N+=p.n}
    const cls=p?(p.d===p.n?'done':p.d>0?'part':''):'';
    return `<button class="${cls}" data-go="${i}" ${S.step===i?'aria-current="step"':''}><span class="dot">${p&&p.d===p.n?'✓':i+1}</span><span class="t">${esc(st.t)}</span></button>`}).join('');
  const pct=N?Math.round(100*D/N):0;
  $('#steps').innerHTML=h+`<div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div><p class="ptext">${pct}% lokið</p>`;
}
$('#steps').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(+b.dataset.go)});
function go(i){S.step=Math.max(0,Math.min(STEPS.length-1,i));save();render();window.scrollTo({top:0});$('#view').focus({preventScroll:true})}

/* ---------- Reitir ---------- */
function meterHTML(f){const n=words(S.a[f.k]);const ok=n>=f.min;return `<div class="meter ${ok?'good':''}" data-meter="${f.k}"><span class="bar"><i style="width:${Math.min(100,100*n/f.min)}%"></i></span><span>${n} orð · ${ok?'<b>gott!</b>':'markmið: a.m.k. '+f.min}</span></div>`}
function updMeter(k,min){const el=document.querySelector(`[data-meter="${k}"]`);if(el)el.outerHTML=meterHTML({k,min})}
function exHTML(f){
  let h='';
  if(f.goalEx&&goal())h+=`<details class="ex"><summary>Dæmi fyrir ykkar markmið (${esc(goal().short)})</summary><blockquote>${esc(goal().rq)}</blockquote><p class="muted">Ekki afrita – skrifið ykkar eigin spurningu sem passar við ykkar hönnun.</p></details>`;
  if(f.ex)h+=`<details class="ex"><summary>Dæmi úr fyrirmyndarskýrslu (Pringles-hringurinn)</summary><blockquote>${esc(EX[f.ex])}</blockquote></details>`;
  return h;
}
function lbl(f,forId){return `<${forId?'label for="'+forId+'"':'div class="lbl"'}>${esc(f.l)}${f.need?'':' <span class="muted" style="font-weight:400">(valfrjálst)</span>'}</${forId?'label':'div'}>${f.h?`<div class="help">${f.h}</div>`:''}`}

function fieldHTML(f){
  const a=S.a,id='f_'+f.k;
  switch(f.type){
  case 'row':return `<div class="row">${f.f.map(x=>`<div>${fieldHTML(x)}</div>`).join('')}</div>`;
  case 'text':case 'date':return `<div class="q">${lbl(f,id)}<input id="${id}" type="${f.type}" data-k="${f.k}" value="${esc(a[f.k])}" placeholder="${esc(f.ph||'')}"></div>`;
  case 'lines':return `<div class="q">${lbl(f,id)}<textarea id="${id}" data-k="${f.k}" placeholder="${esc(f.ph||'')}" style="min-height:120px">${esc(a[f.k])}</textarea></div>`;
  case 'area':return `<div class="q">${lbl(f,id)}<textarea id="${id}" data-k="${f.k}" data-min="${f.min}" ${f.small?'style="min-height:80px"':''}>${esc(a[f.k])}</textarea>
    ${f.min?meterHTML(f):''}

function trialSumText(){const g=goal(),st=trialStats();if(!st.n)return 'Engar tilraunir skráðar enn. Fyllið út „Já“ eða „Nei“ fyrir hverja tilraun.';

const V=$('#view');
V.addEventListener('input',e=>{const t=e.target,d=t.dataset;
  if(d.k){S.a[d.k]=t.value;if(d.min)updMeter(d.k,+d.min);changed();return}
  if(d.tr){S.trials[+d.tr][d.f]=t.value;const s=$('#trialSum');if(s){s.innerHTML=trialSumText();s.classList.toggle('ok',trialStats().y>=3)}changed();return}
  if(d.m){S.measures[+d.m][d.f]=t.value;changed();return}
  if(d.cap){S.gal[d.cap][+d.i].cap=t.value;changed();return}
  if(d.role!==undefined){S.roles[d.role]=t.value;changed();return}
  if(d.self){(S.self[d.self]=S.self[d.self]||{})[d.f]=t.value;if(d.f==='s'){const tot=SELF.reduce((s,c)=>s+(+((S.self[c.id]||{}).s)||0),0);$('#selfTot').innerHTML=`Samtals: <b>${tot}</b> af 25 stigum`}changed();return}
});
V.addEventListener('change',async e=>{const t=e.target,d=t.dataset;
  if(t.name==='goal'){S.a.goal=t.value;changed();return}
  if(d.radio){S.a[d.radio]=t.value;changed();return}
  if(d.concept){const c=d.concept;S.concepts=t.checked?[...new Set([...S.concepts,c])]:S.concepts.filter(x=>x!==c);changed();return}
  if(d.check){S.checks[d.check]=t.checked;changed();return}
  if(d.photo&&t.files[0]){toast('Vinn úr mynd…');const src=await shrink(t.files[0]);if(src){S.photos[d.photo]=src;changed();render();toast('Mynd vistuð ✓')}return}
  if(d.gal&&t.files.length){toast('Vinn úr myndum…');const g=S.gal[d.gal]=S.gal[d.gal]||[];for(const fl of t.files){const src=await shrink(fl);if(src)g.push({src,cap:''})}changed();render();toast('Myndir vistaðar ✓');return}
});
V.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.go!==undefined){go(+d.go);return}
  if(d.start){const ta=document.getElementById('f_'+d.start);let v=ta.value;const txt=d.txt;
    if(v&&!/\s$/.test(v))v+=txt.startsWith(' ')?'':(/[.!?]$/.test(v.trim())?' ':' ');
    ta.value=v+txt;S.a[d.start]=ta.value;ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);updMeter(d.start,+ta.dataset.min);changed();return}
  if(d.delphoto){if(confirm('Fjarlægja myndina?')){delete S.photos[d.delphoto];changed();render()}return}
  if(d.delg){S.gal[d.delg].splice(+d.i,1);changed();render();return}
  if(d.mv){const g=S.gal[d.mv],i=+d.i;[g[i-1],g[i]]=[g[i],g[i-1]];changed();render();return}
  if(b.id==='addTrial'){const last=S.trials[S.trials.length-1];S.trials.push({ver:last?last.ver:'1',val:'',ok:'',note:''});changed();render();return}
  if(d.deltr){S.trials.splice(+d.deltr,1);changed();render();return}
  if(d.addm!==undefined){S.measures.push({l:d.addm,v:''});changed();render();return}
  if(d.delm){S.measures.splice(+d.delm,1);changed();render();return}
  if(b.id==='bPrint'){window.print();return}
});

/* Minnka myndir svo þær komist í vistun og skýrslu */
function shrink(file,max=1400){return new Promise(res=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.82))};
  img.onerror=()=>{URL.revokeObjectURL(url);toast('Ekki tókst að lesa myndina. Prófið JPG eða PNG.');res(null)};img.src=url})}

const miss=t=>`<p><span class="missing">[${esc(t)}]</span></p>`;

function ph(src,label,alt){return src?`<img src="${src}" alt="${esc(alt||label)}">`:`<div class="ph">[${esc(label)}]</div>`}
function pics(k){const g=S.gal[k]||[];if(!g.length)return '';return `<div class="pics">${g.map((p,i)=>`<figure><img src="${p.src}" alt="${esc(p.cap)}"><figcaption>Mynd: ${esc(p.cap||'')}</figcaption></figure>`).join('')}</div>`}
function list(k,label){const l=lines(S.a[k]);return l.length?`<ul>${l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:miss('Vantar: '+label)}

  const fi=STEPS.findIndex(s=>s.id==='fragangur');
  $('#view').innerHTML=`<div class="head noprint"><div class="eyebrow">Skref ${STEPS.length} af ${STEPS.length}</div><h1>Skýrslan ykkar</h1><p>Svona lítur skýrslan út. Lesið hana yfir saman – lagið það sem vantar eða hljómar ekki rétt með því að fara aftur í viðkomandi skref.</p></div>
  ${mustMissing.length?`<div class="alert warn noprint"><b>📸 Skýrslan er ekki tilbúin.</b> Það vantar ${esc(joinNames(mustMissing))}. Gangið frá stöðinni ykkar og takið myndirnar áður en skýrslunni er skilað. <button class="link" data-go="${fi}">Fara í Frágang →</button></div>`:''}
  ${todo.length?`<div class="alert warn noprint"><b>Þetta á eftir að klára (${todo.length}):</b><ul>${todo.slice(0,12).map(([i,t,l])=>`<li><button class="link" data-go="${i}">${esc(t)}</button>: ${esc(l)}</li>`).join('')}${todo.length>12?`<li>… og ${todo.length-12} í viðbót</li>`:''}</ul></div>`
    :`<div class="alert ok noprint"><b>Allt er komið! 🎉</b> Lesið skýrsluna yfir einu sinni enn og prentið hana síðan eða vistið sem PDF.</div>`}
  <div class="panel noprint" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <button class="primary" id="bPrint" ${mustMissing.length?'disabled':''}>🖨️ Prenta / vista sem PDF</button>
    <span class="muted" style="font-size:14px">${mustMissing.length?'Opnast þegar myndirnar af lokaafurð og stöð eru komnar.':'Veljið „Vista sem PDF“ í prentglugganum ef þið skilið rafrænt.'}</span>
  </div>
  <div class="paper">${buildReport()}</div>
  <div class="nav noprint"><button data-go="${STEPS.length-2}">← ${esc(STEPS[STEPS.length-2].t)}</button><span></span></div>`;
}
/* Ekki prenta með Ctrl+P fyrr en myndirnar eru komnar */
window.addEventListener('beforeprint',()=>{if(STEPS[S.step].report&&(!S.photos.final||!S.photos.station))toast('Munið myndirnar af lokaafurð og stöð eftir frágang!');if(!STEPS[S.step].report){S.step=STEPS.length-1;render()}});

/* ---------- Afrit ---------- */
$('#bSave').onclick=()=>{const name=(S.a.title||'skyrsla').replace(/[^\wÁÐÉÍÓÚÝÞÆÖáðéíóúýþæö-]+/g,'-');const b=new Blob([JSON.stringify(S)],{type:'application/json'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download=`${name}-afrit.json`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Afrit sótt ✓')};
$('#bOpen').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const d=JSON.parse(await f.text());if(!d||!d.a)throw 0;S=Object.assign(blank(),d);changed();render();toast('Afrit opnað ✓')}catch(err){toast('Þetta er ekki gilt afrit.')}};
$('#bReset').onclick=()=>{if(confirm('Byrja á nýrri skýrslu? Öll vinna sem er á þessu tæki hverfur. Vistið afrit fyrst ef þið viljið geyma hana.')){S=blank();changed();render()}};

(async()=>{await DB.open();const d=await DB.get('state');if(d&&d.a)S=Object.assign(blank(),d);render()})();
</script>
</body>
</html>
