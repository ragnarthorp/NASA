const SKILL={
  raða:{t:'Raða á staðalform',tip:'Færðu alla liði yfir á vinstri hlið. Formerkið snýst þegar liður fer yfir =. Sameinaðu svo líka liði.',go:'2-4'},
  svigar:{t:'Margfalda inn í sviga',tip:'Talan fyrir framan margfaldast við hvern lið í sviganum. x · x = x².',go:'2-5'},
  minus:{t:'Mínus fyrir framan sviga',tip:'Mínus fyrir framan sviga snýr öllum formerkjum inni í honum.',go:'2-6'},
  sq:{t:'Svigi í öðru veldi (Þ1/Þ2)',tip:'(a + b)² er ekki a² + b². Notaðu Þ1/Þ2: miðliðurinn 2ab gleymist oft.',go:'2-7'},
  prod:{t:'Tveir svigar margfaldaðir',tip:'Hver liður í fyrri sviganum sinnum hver liður í þeim seinni: fjórar margfaldanir.',go:'2-8'},
  abc:{t:'Lesa A, B og C',tip:'Formerkið fylgir: −5x gefur B = −5. Liður sem vantar er 0.',go:'3-3'},
  D:{t:'Reikna D',tip:'Settu B í sviga: (−5)² = 25. Reiknaðu 4·A·C sér og passaðu mínus mínus.',go:'4-2'},
  none:{t:'D < 0: engin lausn',tip:'Ef D er mínus er ekki hægt að taka rótina. Svarið er „engin lausn“.',go:'4-4'},
  formula:{t:'Lausnarformúlan (−B og 2A)',tip:'−B snýr formerkinu á B. Deilt er með 2A undir öllu strikinu.',go:'4-3'},
  frac:{t:'Brot í lausnum',tip:'Lausnin getur verið brot: (−3 + 5)/4 = 2/4 = 1/2. Styttu brotið.',go:'4-5'},
  noC:{t:'Vantar C: x út fyrir sviga',tip:'Ekki deila með x! Þá týnist lausnin x = 0.',go:'5-2'},
  noB:{t:'Vantar B: x² = tala',tip:'Mundu ±. Ef talan er neikvæð er engin lausn.',go:'5-3'}
};
function rootsInt(){let r=R(-7,7),s;do s=R(-7,7);while(s===r);return[r,s]}
const QG={
  std:()=>{const[r,s]=rootsInt();return stdStr(1,-(r+s),r*s)},
  stdA:()=>{const a=pick([2,3]),[r,s]=rootsInt();return stdStr(a,-a*(r+s),a*r*s)},
  Aneg:()=>{const[r,s]=rootsInt();return stdStr(-1,r+s,-r*s)},
  noC:()=>GS5.sNoC(),noB:()=>GS5.sNoB(),
  none:()=>{const[a,b,c]=genCoef('none');return stdStr(a,b,c)},
  one:()=>{const[a,b,c]=genCoef('one');return stdStr(a,b,c)},
  frac:()=>{const[a,b,c]=genCoef('frac');return stdStr(a,b,c)},
  arrange:()=>genS('combo'),
  bracket:()=>{const[r,s]=rootsInt();const m=-(r+s),n=-r*s;if(!m||!n)return null;return `x(x${sg(m)})=${n}`},
  minus:()=>{const[r,s]=rootsInt();const p=NZ(-6,6),q=-r*s,rr=r+s-p;if(!q)return null;return `x^2-(${sstr([[p,1],[q,0]])})=${sstr([[rr,1]])}`},
  square:()=>{const[r,s]=rootsInt();const m=NZ(-5,5),b=2*m+(r+s),c=m*m-r*s;return `(x${sg(m)})^2=${sstr([[b,1],[c,0]])}`},
  product:()=>{const[r,s]=rootsInt();const m=NZ(-6,6),n=-(r+s)-m,c=m*n-r*s;if(!n||!c)return null;return `(x${sg(m)})(x${sg(n)})=${c}`}
};
const LEVELS={1:['std','std','noC','noB','Aneg','stdA'],2:['arrange','bracket','minus','none','one','stdA','noC','noB'],3:['square','product','frac','minus','bracket','none','arrange'],0:Object.keys(QG)};
function genQ(type){for(let t=0;t<80;t++){const s=QG[type]();if(!s)continue;try{const st=parseEq(s),p=ePoly(st);if(deg(p)!==2)continue;const{A,B,C}=stdCoef(st);const D=B.mul(B).sub(A.mul(C).mul(4));if(!D.isNeg()&&!fsqrt(D))continue;if(type!=='none'&&D.isNeg()&&type!=='noB')continue;return s}catch(_){}}return 'x^2-2x-8=0'}
function buildTest(n,lvl){
  let pool=shuffle(LEVELS[lvl]);const out=[];
  if(lvl===0&&!pool.slice(0,n).includes('none'))pool=['none',...pool.filter(x=>x!=='none')];
  for(let i=0;i<n;i++){const ty=pool[i%pool.length];out.push({ty,eq:genQ(ty)})}
  return shuffle(out);
}
function expandAll(st){
  const tags=new Set();let refs=[];let guard=0;
  while(guard++<30){
    const all=[...st.L,...st.R],sq=all.find(t=>t.t==='g'&&t.sq),g2=all.find(t=>t.t==='g'&&t.br.length===2),g=all.find(t=>t.t==='g');
    let r;
    if(sq){tags.add('sq');r=sq.br[0].length===2?opSquare(st,sq.id):opUnfold(st,sq.id)}
    else if(g2){tags.add('prod');r=kTriv(g2.k)&&!g2.k.c.isNeg()?opMulBr(st,g2.id):opDistribute(st,g2.id,0)}
    else if(g){tags.add(g.k.c.isNeg()&&kTriv(g.k)?'minus':g.k.c.isNeg()?'minus':'svigar');r=opDistribute(st,g.id,0)}
    else break;
    if(r.lab)refs.push(r.lab);st=r.st;
  }
  return{st,tags:[...tags],refs};
}
function solveFull(eq,ty){
  const st0=parseEq(eq),out=[];
  const a0=analyze(st0);let st=st0;
  if(a0.groups){const ex=expandAll(st0);st=ex.st;out.push({h:eqH(st),lab:'Margfaldað upp úr svigum'+(ex.refs.length?' ('+[...new Set(ex.refs)].join(', ')+')':''),tag:ex.tags[0]||'svigar'})}
  const c=stdCoef(st0),{A,B,C}=c;
  const p=ePoly(st0);const needFlip=(p[2]||F0).isNeg();
  if(!a0.std||needFlip)out.push({h:eqStd(c),lab:'Allt yfir vinstra megin, sameinað og raðað'+(needFlip?', ·(−1)':''),tag:'raða'});
  const fin=(xs)=>xs.length?xs.map(x=>`<span class="m">x = ${nH(x)}</span>`).join(' eða '):'Engin lausn';
  if(ty==='noC'||(C.isZero()&&!B.isZero())){
    const r=B.neg().div(A);
    out.push({h:`<i>x</i>(${sideT(stdSide({A,B,C:F0}).map(m=>M(m.c,m.p-1))).replace(/x/g,'<i>x</i>')}) = 0`,lab:'x tekið út fyrir sviga',tag:'noC'});
    out.push({h:`<i>x</i> = 0 &nbsp;eða&nbsp; <i>x</i> = ${nH(r)}`,lab:'Núllreglan',tag:'noC'});
    return{lines:out,ans:fin([F0,r]),note:'Lausnarformúlan virkar líka (C = 0).'};
  }
  if(ty==='noB'||(B.isZero()&&!C.isZero())){
    const k=C.neg().div(A);
    out.push({h:`<i>x</i><sup>2</sup> = ${nH(k)}`,lab:'x² eitt sér',tag:'noB'});
    if(k.isNeg()){out.push({h:`${nH(k)} &lt; 0 → engin tala í öðru veldi verður neikvæð`,lab:'Engin lausn',tag:'noB'});return{lines:out,ans:fin([])}}
    const sk=fsqrt(k);out.push({h:`<i>x</i> = ±${sqrtX(nH(k))} = ±${nH(sk)}`,lab:'Rót með ±',tag:'noB'});
    return{lines:out,ans:fin([sk,sk.neg()])};
  }
  out.push({h:`<i>A</i> = ${nH(A)}, &nbsp;<i>B</i> = ${nH(B)}, &nbsp;<i>C</i> = ${nH(C)}`,lab:'Lesa af A, B og C',tag:'abc'});
  const B2=B.mul(B),AC4=A.mul(C).mul(4),D=B2.sub(AC4);
  out.push({h:`<i>D</i> = (${nH(B)})<sup>2</sup> − 4 · (${nH(A)}) · (${nH(C)}) = ${nH(B2)} ${AC4.isNeg()?'+ '+nH(AC4.abs()):'− '+nH(AC4)} = ${nH(D)}`,lab:'Reikna D',tag:'D'});
  if(D.isNeg()){out.push({h:`<i>D</i> = ${nH(D)} &lt; 0`,lab:'D < 0: engin lausn',tag:'none'});return{lines:out,ans:fin([])}}
  const sD=fsqrt(D),mB=B.neg(),A2=A.mul(2),x1=mB.add(sD).div(A2),x2=mB.sub(sD).div(A2);
  out.push({h:`<i>x</i> = ${fracX(`−(${nH(B)}) ± ${sqrtX(nH(D))}`,`2 · (${nH(A)})`)} = ${fracX(`${nH(mB)} ± ${nH(sD)}`,nH(A2))}`,lab:'Inn í lausnarformúluna',tag:'formula'});
  const isFr=x=>x.d!==1;
  if(D.isZero()){out.push({h:`<i>x</i> = ${fracX(nH(mB),nH(A2))} = ${nH(x1)}`,lab:'D = 0: ein lausn',tag:isFr(x1)?'frac':'formula'});return{lines:out,ans:fin([x1])}}
  out.push({h:`<i>x</i><sub>1</sub> = ${fracX(`${nH(mB)} + ${nH(sD)}`,nH(A2))} = ${nH(x1)} &nbsp;&nbsp; <i>x</i><sub>2</sub> = ${fracX(`${nH(mB)} − ${nH(sD)}`,nH(A2))} = ${nH(x2)}`,lab:'Reikna lausnirnar',tag:isFr(x1)||isFr(x2)?'frac':'formula'});
  return{lines:out,ans:fin([x1,x2]),note:ty==='guess'?'':''};
}
