<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- ARTIFACT-START -->
<title>Annars stigs jöfnur</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap">
<style>
/* Útlit: námsleið til vinstri, algebruvélin á rúðustrikuðu blaði í miðjunni. Litur kafla 7 (■ appelsínugulur) ber allt. */
:root{
  --bg:#f7f6f4; --surface:#ffffff; --paper:#fffdfb; --ink:#1a1a1a; --muted:#5e5954; --line:#e2ddd7; --grid:#f0e8e0; --hover:#f4eee8;
  --k7:#c95d07; --k7-tint:#fbede2; --k7-ink:#8a3f04; --on-k7:#ffffff;
  --k6:#1f5fb5; --k5:#0b7d4e;
  --ok:#1b7443; --ok-tint:#e2f2e8; --bad:#b0281f; --bad-tint:#fbe5e2;
  --p2:#c95d07; --p1:#1f6fb5; --p0:#9b938b;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --math:"STIX Two Text","Cambria Math","Times New Roman",Georgia,serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15120f; --surface:#1f1a16; --paper:#1b1713; --ink:#f2ede7; --muted:#b5aca2; --line:#3a322b; --grid:#272019; --hover:#2a231d;
  --k7:#f08a3c; --k7-tint:#3b2414; --k7-ink:#ffb47c; --on-k7:#1c0f05;
  --k6:#6ea4ef; --k5:#4cc28c;
  --ok:#5fd18f; --ok-tint:#16301f; --bad:#ff8a7f; --bad-tint:#3a1a16;
  --p2:#f08a3c; --p1:#6ea4ef; --p0:#8f867d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15120f; --surface:#1f1a16; --paper:#1b1713; --ink:#f2ede7; --muted:#b5aca2; --line:#3a322b; --grid:#272019; --hover:#2a231d;
  --k7:#f08a3c; --k7-tint:#3b2414; --k7-ink:#ffb47c; --on-k7:#1c0f05;
  --k6:#6ea4ef; --k5:#4cc28c;
  --ok:#5fd18f; --ok-tint:#16301f; --bad:#ff8a7f; --bad-tint:#3a1a16;
  --p2:#f08a3c; --p1:#6ea4ef; --p0:#8f867d; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--font)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--k7);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}
.m{font-family:var(--math)}
i.v,.m i{font-family:var(--math);font-style:italic}

/* ---------- Haus ---------- */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.brand h1{font-size:1.35rem;display:flex;align-items:center;gap:.45em}
.sym{color:var(--k7)}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{width:140px;height:8px;border-radius:99px;background:var(--grid);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--k7);border-radius:99px;transition:width .4s}
.btn.navbtn{display:none}

/* ---------- Grind ---------- */
.layout{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;
  padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;padding-right:4px}
.nav-mod{margin-bottom:18px}
.nav-mod h3{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 6px;display:flex;gap:.5em;align-items:baseline}
.nav-mod h3 b{color:var(--k7);font-size:.95rem}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:10px;cursor:pointer;font-size:.95rem;color:var(--ink)}
.nav-item:hover{background:var(--hover)}
.nav-item.cur{background:var(--k7-tint);color:var(--k7-ink);font-weight:700}
.st{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.7rem;color:var(--on-k7)}
.nav-item.done .st{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.nav-item.cur .st{border-color:var(--k7)}
.nav-item .t{flex:1;min-width:0}
.lvl{font-size:.62rem;letter-spacing:.05em;color:var(--k7);white-space:nowrap}
.lvl .off{color:var(--line)}

main{min-width:0}
.ihead{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.ihead h2{font-size:clamp(1.5rem,3.4vw,2.05rem)}
.ihead .meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
.ifoot{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}

/* ---------- Hnappar og smáhlutir ---------- */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:.5em .9em;min-height:42px;cursor:pointer;font-weight:700;font-size:.92rem;display:inline-flex;align-items:center;gap:.45em;line-height:1.2}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--k7);border-color:var(--k7);color:var(--on-k7)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{min-height:34px;padding:.3em .7em;font-size:.85rem}
.btn .mm{font-family:var(--math);font-weight:600;font-size:1.08em}
.ref{display:inline-block;background:var(--k7);color:var(--on-k7);font:700 .7rem/1.4 var(--font);border-radius:5px;padding:.05em .42em;letter-spacing:.02em;vertical-align:middle}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.tint{background:var(--k7-tint);border-color:transparent}
.prose{display:flex;flex-direction:column;gap:14px;max-width:68ch}
.prose b{font-weight:700}
.good{color:var(--ok);font-weight:700}
.bad{color:var(--bad);font-weight:700;text-decoration:line-through;text-decoration-thickness:1px}
.rule{display:flex;flex-wrap:wrap;gap:.35em .6em;align-items:baseline}
.rule .mt{font-family:var(--math);font-size:1.12em}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mtl{font-family:var(--math);font-size:1.6rem;line-height:1.3}
.k{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--k7-ink)}
.mut{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{border:2px dashed var(--line);border-radius:99px;padding:.3em .8em;font-weight:700;font-size:.88rem;color:var(--muted)}
.badge.on{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-tint)}

/* ---------- Stærðfræðiletur ---------- */
.eqline{font-family:var(--math);display:inline-flex;align-items:center;white-space:nowrap;line-height:1.15}
.eqline sup{font-size:.62em;line-height:0;position:relative;top:-.55em;vertical-align:baseline}
.eqline .tm>sup.sq{line-height:1;top:0;align-self:flex-start;margin-top:-.15em;font-size:.62em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.66em;line-height:1.08;margin:0 .06em}
.fr>span:first-child{border-bottom:.09em solid currentColor;padding:0 .12em}
.side{display:inline-flex;align-items:center;border-radius:12px}
.eqs{margin:0 .35em;border-radius:8px;padding:0 .15em}
.op{margin:0 .2em}
.op0{margin:0 .04em 0 0}
.tm{display:inline-flex;align-items:center;border-radius:9px;position:relative}
.kchip,.br{display:inline-flex;align-items:center;border-radius:8px}
.in{display:inline-flex;align-items:center}
.zero{color:var(--muted)}
.par{font-size:1.08em}
.lab{position:absolute;left:50%;top:100%;transform:translateX(-50%);font:700 .42em/1 var(--font);background:var(--k7);color:var(--on-k7);border-radius:5px;padding:.25em .45em;margin-top:.3em;visibility:hidden;white-space:nowrap}
.show-A .tm.p2>.lab,.show-B .tm.p1>.lab,.show-C .tm.p0>.lab{visibility:visible}
.show-A .tm.p2,.show-B .tm.p1,.show-C .tm.p0{background:var(--k7-tint)}
.likecol .tm.m.p2>.bd,.likecol .in.p2{box-shadow:inset 0 -.11em var(--p2)}
.likecol .tm.m.p1>.bd,.likecol .in.p1{box-shadow:inset 0 -.11em var(--p1)}
.likecol .tm.m.p0>.bd,.likecol .in.p0{box-shadow:inset 0 -.11em var(--p0)}

/* ---------- Algebruvélin ---------- */
.engine{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.eng-main{display:flex;flex-direction:column;gap:12px;min-width:0}
.goal{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.goal .gl{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.goal .ge{font-family:var(--math);font-size:1.25rem}
.goal .ge sup{font-size:.62em}
.checks{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.checks li{font-size:.82rem;border-radius:99px;padding:.25em .7em .25em .5em;background:var(--grid);color:var(--muted);display:flex;gap:.4em;align-items:center;transition:background .25s,color .25s}
.checks li::before{content:"";width:.75em;height:.75em;border-radius:3px;border:2px solid currentColor;flex:none}
.checks li.ok{background:var(--ok-tint);color:var(--ok);font-weight:700}
.checks li.ok::before{background:currentColor;border-radius:50%}
.stage{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px;
  border:1px solid var(--line);border-radius:18px;min-height:170px;display:flex;align-items:center;overflow-x:auto;padding:30px 16px 34px;position:relative}
.stage-in{margin:auto}
.stage .eqline{font-size:clamp(1.45rem,4.4vw,2.6rem)}
.stage .side{min-height:2.1em;padding:.15em .1em;min-width:1.4em;justify-content:center}
.stage .tm{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding:.06em .14em;transition:background .15s,box-shadow .15s}
.stage .tm:hover{background:var(--hover)}
.stage .tm.sel{background:var(--k7-tint);box-shadow:0 0 0 2px var(--k7)}
.stage .kchip{border-bottom:2px dotted var(--k7);cursor:grab;padding:0 .06em}
.stage .br{cursor:grab}
.stage sup.sq{cursor:pointer;border-radius:4px;padding:0 .12em;color:var(--k7-ink);font-weight:600}
.stage sup.sq:hover{background:var(--k7-tint)}
.gap{display:inline-block;width:.34em;align-self:stretch;position:relative}
.dragging .gap.over::after{content:"";position:absolute;left:50%;top:12%;bottom:12%;width:4px;margin-left:-2px;border-radius:2px;background:var(--k7);box-shadow:0 0 0 3px var(--k7-tint)}
.dragging .eqs{background:var(--k7-tint);color:var(--k7-ink)}
.dragging .eqs.over{background:var(--k7);color:var(--on-k7)}
.dragging .side.over{background:var(--k7-tint)}
.dragging .can{outline:2px dashed var(--k7);outline-offset:2px}
.dragging .over.tm,.dragging .over.br{outline:3px solid var(--k7);background:var(--k7-tint)}
.lifted{opacity:.28}
.dragghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;font-family:var(--math);background:var(--surface);border-radius:10px;padding:.05em .25em;box-shadow:0 10px 28px rgba(0,0,0,.22),0 0 0 2px var(--k7);white-space:nowrap;display:inline-flex;align-items:center}
.dragghost sup{font-size:.62em;line-height:0;position:relative;top:-.55em}
.tm.hint{animation:hint 1.1s ease-in-out 3}
@keyframes hint{50%{box-shadow:0 0 0 4px var(--k7);background:var(--k7-tint)}}
.flipped{animation:flip .9s ease}
@keyframes flip{0%{color:var(--k7);transform:scale(1.8)}60%{color:var(--k7)}}
.fresh{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.55);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.eng-msg{min-height:3.1em;border-radius:12px;padding:.6em .9em;font-size:.95rem;background:var(--surface);border:1px solid var(--line);display:flex;gap:.6em;align-items:flex-start}
.eng-msg .ic{flex:none;font-weight:700;width:1.5em;height:1.5em;border-radius:50%;display:grid;place-items:center;font-size:.8rem;background:var(--grid);color:var(--muted)}
.eng-msg.step .ic{background:var(--k7);color:var(--on-k7)}
.eng-msg.err{background:var(--bad-tint);border-color:transparent}
.eng-msg.err .ic{background:var(--bad);color:var(--surface)}
.eng-msg.hint{background:var(--k7-tint);border-color:transparent}
.eng-msg b{font-family:var(--math);font-size:1.08em}
.acts{display:flex;flex-direction:column;gap:10px}
.ctx{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:42px}
.ctx .lbl{font-size:.82rem;color:var(--muted);margin-right:4px}
.glob{display:flex;flex-wrap:wrap;gap:6px;border-top:1px dashed var(--line);padding-top:10px}
.scale-in{width:5.5em;border:1px solid var(--line);border-radius:10px;padding:.45em .6em;background:var(--surface);font-family:var(--math)}
.done-ban{border-radius:14px;padding:14px 16px;background:var(--ok-tint);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.done-ban h4{font-size:1.1rem;color:var(--ok)}
.done-ban .abcv{font-family:var(--math);font-size:1.1rem}
.done-ban.warn{background:var(--k7-tint)}
.done-ban.warn h4{color:var(--k7-ink)}
.help{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.help div{font-size:.82rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;line-height:1.35}
.help b{display:block;color:var(--ink);font-size:.86rem;margin-bottom:2px}
.eng-log{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 10px;position:sticky;top:16px}
.eng-log h4{font-size:.95rem}
.eng-log .sub{font-size:.8rem;color:var(--muted);margin-bottom:8px}
.eng-log ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;counter-reset:ln;max-height:460px;overflow:auto}
.eng-log li{counter-increment:ln;display:grid;grid-template-columns:1.6em minmax(0,1fr);gap:2px 6px;padding:6px 6px;border-radius:9px;cursor:pointer;align-items:center}
.eng-log li::before{content:counter(ln);font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;grid-row:span 2}
.eng-log li:hover{background:var(--hover)}
.eng-log li.cur{background:var(--k7-tint);cursor:default}
.eng-log .ln{overflow-x:auto}
.eng-log .ln .eqline{font-size:1.05rem}
.eng-log .tg{font-size:.74rem;color:var(--muted);display:flex;gap:6px;align-items:center}

.probs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.probs .pn{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.probs .pn.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.probs .pn.cur{border-color:var(--k7);box-shadow:0 0 0 3px var(--k7-tint)}
.probs .lab2{font-size:.85rem;color:var(--muted);margin-right:6px}

/* ---------- Spurningar ---------- */
.quiz{display:flex;flex-direction:column;gap:16px;max-width:780px}
.qdots{display:flex;gap:6px;flex-wrap:wrap}
.qdots span{width:14px;height:14px;border-radius:50%;background:var(--grid);border:2px solid var(--line)}
.qdots span.cur{border-color:var(--k7)}
.qdots span.y{background:var(--ok);border-color:var(--ok)}
.qdots span.n{background:var(--bad);border-color:var(--bad)}
.qcard{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;border:1px solid var(--line);border-radius:18px;padding:34px 18px;display:flex;justify-content:center;overflow-x:auto}
.qcard .eqline{font-size:clamp(1.6rem,5vw,2.6rem)}
.qbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qbtns .btn{min-height:58px;font-size:1.05rem;justify-content:center}
.qbtns .btn.pri:disabled{opacity:1}
.fb{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fb.y{background:var(--ok-tint)}
.fb.n{background:var(--bad-tint)}
.fb h4{font-size:1.05rem}
.fb.y h4{color:var(--ok)} .fb.n h4{color:var(--bad)}
.fb .eqline{font-size:1.3rem}

/* ---------- Gröf ---------- */
.plotwrap{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;overflow:hidden}
.plot{width:100%;height:auto;display:block}
.plot .gl{stroke:var(--grid);stroke-width:1}
.plot .ax{stroke:var(--muted);stroke-width:1.4}
.plot .xaxis{stroke:var(--ink);stroke-width:2.4}
.plot .cv{fill:none;stroke:var(--k7);stroke-width:3.4;stroke-linecap:round}
.plot .hl{stroke:var(--k6);stroke-width:2.6;stroke-dasharray:7 5}
.plot .drop{stroke:var(--muted);stroke-width:1.4;stroke-dasharray:3 4}
.plot .dot{fill:var(--surface);stroke:var(--ink);stroke-width:3}
.plot .dot.hit{fill:var(--k7);stroke:var(--ink)}
.plot text{fill:var(--muted);font:12px var(--font)}
.plot .tl{fill:var(--ink);font:italic 600 15px var(--math)}
.plot .tk{fill:var(--k6);font:italic 600 15px var(--math)}
.ctrl{display:grid;grid-template-columns:auto minmax(0,1fr) 3.2em;gap:10px 12px;align-items:center}
.ctrl label{font-family:var(--math);font-style:italic;font-size:1.2rem;font-weight:600}
.ctrl output{font-family:var(--math);font-size:1.15rem;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--k7);height:30px}
.count{font-size:2.4rem;font-weight:700;color:var(--k7);line-height:1}
.gview{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.gside{display:flex;flex-direction:column;gap:14px}

/* ---------- A, B, C ---------- */
.abc{display:flex;flex-direction:column;gap:16px}
.abc-eq{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px 14px 40px;display:flex;justify-content:center;overflow-x:auto}
.abc-eq .eqline{font-size:clamp(1.6rem,5vw,2.5rem)}
.abc-eq .tm{padding:.05em .14em}
.abc-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.abc-f{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.abc-f .fl{display:flex;align-items:center;gap:8px}
.abc-f label{font-family:var(--math);font-size:1.5rem;font-weight:600;font-style:italic}
.abc-f input{flex:1;min-width:0;font-family:var(--math);font-size:1.4rem;border:2px solid var(--line);border-radius:10px;padding:.2em .45em;background:var(--paper)}
.abc-f.ok{border-color:var(--ok);background:var(--ok-tint)}
.abc-f.no{border-color:var(--bad)}
.abc-f .what{font-size:.82rem;color:var(--muted)}
.abc-f .msg{font-size:.86rem;color:var(--bad)}
.abc-f.ok .msg{color:var(--ok)}
.pm{min-width:42px;justify-content:center;font-family:var(--math)}

/* ---------- Kennsluefni ---------- */

<script>
(()=>{
'use strict';

/* ================= Brot ================= */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t}return a||1};
class F{
  constructor(n,d=1){if(d===0)throw new Error('Deilt með 0');if(d<0){n=-n;d=-d}const g=gcd(n,d);this.n=n/g;this.d=d/g}
  static of(x){return x instanceof F?x:new F(x,1)}
  add(o){o=F.of(o);return new F(this.n*o.d+o.n*this.d,this.d*o.d)}
  sub(o){return this.add(F.of(o).neg())}
  mul(o){o=F.of(o);return new F(this.n*o.n,this.d*o.d)}
  div(o){o=F.of(o);return new F(this.n*o.d,this.d*o.n)}
  neg(){return new F(-this.n,this.d)}
  abs(){return new F(Math.abs(this.n),this.d)}
  isZero(){return this.n===0}
  isNeg(){return this.n<0}
  isOne(){return this.n===1&&this.d===1}
  eq(o){o=F.of(o);return this.n===o.n&&this.d===o.d}
  val(){return this.n/this.d}
}
const F0=new F(0),F1=new F(1);
const MINUS='−';
const fT=f=>(f.n<0?MINUS:'')+Math.abs(f.n)+(f.d===1?'':'/'+f.d);
function toF(s){const m=s.split('.');if(m.length===1)return new F(parseInt(s,10));const k=m[1].length;return new F(parseInt(m[0]+m[1],10),10**k)}

/* ================= Liðir ================= */
let UID=0;const nid=()=>'t'+(++UID);
const M=(c,p)=>({id:nid(),t:'m',c:F.of(c),p});
const G=(k,br,sq)=>({id:nid(),t:'g',k,br,sq:!!sq});
const cloneT=t=>t.t==='m'?{...t}:{...t,k:{...t.k},br:t.br.map(b=>b.map(m=>({...m})))};
const cloneS=st=>({L:st.L.map(cloneT),R:st.R.map(cloneT)});
const kTriv=k=>k.p===0&&k.c.abs().isOne();
const sgnOf=t=>(t.t==='m'?t.c:t.k.c).isNeg();
const other=s=>s==='L'?'R':'L';
function find(st,id){for(const side of ['L','R']){const idx=st[side].findIndex(t=>t.id===id);if(idx>=0)return{side,idx,term:st[side][idx]}}return null}

/* ================= Lesari ================= */
function parseEq(src){
  const s=String(src).replace(/[−–]/g,'-').replace(/²/g,'^2').replace(/³/g,'^3').replace(/[·*\s]/g,'').replace(/,/g,'.').replace(/X/g,'x');
  const parts=s.split('=');
  if(parts.length!==2)throw new Error('Jafnan þarf að hafa eitt =-merki.');
  if(!parts[0]||!parts[1])throw new Error('Það vantar eitthvað öðrum megin við =.');
  return{L:parseSide(parts[0],0),R:parseSide(parts[1],0)};
}
function parseSide(s,depth){
  let i=0;const out=[];
  const num=()=>{const m=s.slice(i).match(/^\d+(\.\d+)?/);if(!m)return null;i+=m[0].length;return toF(m[0])};
  const int=()=>{const m=s.slice(i).match(/^\d+/);if(!m)throw new Error('Það vantar tölu í veldisvísinn.');i+=m[0].length;return +m[0]};
  while(i<s.length){
    let sign=1;
    while(s[i]==='+'||s[i]==='-'){if(s[i]==='-')sign=-sign;i++}
    let coef=num();
    if(coef&&s[i]==='/'){i++;const d=num();if(!d)throw new Error('Það vantar nefnara í brotið.');coef=coef.div(d)}
    let xp=0;const br=[];let sq=false;
    while(i<s.length&&(s[i]==='x'||s[i]==='(')){
      if(s[i]==='x'){i++;let e=1;if(s[i]==='^'){i++;e=int()}xp+=e}
      else{
        if(depth>0)throw new Error('Svigar inni í svigum eru ekki studdir.');
        let d=1,j=i+1;while(j<s.length&&d){if(s[j]==='(')d++;else if(s[j]===')')d--;j++}
        if(d)throw new Error('Svigi lokast ekki.');
        const inner=parseSide(s.slice(i+1,j-1),depth+1);i=j;
        if(!inner.length)throw new Error('Tómur svigi.');
        let pw=1;if(s[i]==='^'){i++;pw=int()}
        if(pw===1)br.push(inner);else if(pw===2){br.push(inner);sq=true}else throw new Error('Aðeins svigi í öðru veldi er studdur.');
      }
    }
    if(!coef&&!xp&&!br.length)throw new Error('Skil ekki „'+(s.slice(i,i+4)||s)+'“.');
    if(i<s.length&&s[i]!=='+'&&s[i]!=='-')throw new Error('Skil ekki „'+s.slice(i,i+4)+'“.');
    if(!coef)coef=F1;
    coef=coef.mul(sign);
    if(br.length){
      if(sq&&br.length>1)throw new Error('Svigi í öðru veldi verður að standa einn.');
      out.push(G({c:coef,p:xp},br,sq));
    }else if(!coef.isZero())out.push(M(coef,xp));
  }
  return out;
}

/* ================= Margliður (til athugunar) ================= */
const clean=r=>{for(const k in r)if(r[k].isZero())delete r[k];return r};
const padd=(a,b)=>{const r={...a};for(const k in b)r[k]=r[k]?r[k].add(b[k]):b[k];return clean(r)};
const pmul=(a,b)=>{const r={};for(const x in a)for(const y in b){const k=+x+ +y;r[k]=(r[k]||F0).add(a[x].mul(b[y]))}return clean(r)};
const pscale=(a,f)=>{const r={};for(const k in a)r[k]=a[k].mul(f);return clean(r)};
const bPoly=b=>b.reduce((r,m)=>padd(r,{[m.p]:m.c}),{});
const tPoly=t=>{if(t.t==='m')return{[t.p]:t.c};let r={[t.k.p]:t.k.c};const bs=t.sq?[t.br[0],t.br[0]]:t.br;for(const b of bs)r=pmul(r,bPoly(b));return r};
const sPoly=s=>s.reduce((r,t)=>padd(r,tPoly(t)),{});
const ePoly=st=>padd(sPoly(st.L),pscale(sPoly(st.R),new F(-1)));
const deg=p=>{let d=-1;for(const k in p)d=Math.max(d,+k);return d};
function proportional(a,b){const ka=Object.keys(a).sort(),kb=Object.keys(b).sort();if(ka.join()!==kb.join())return false;if(!ka.length)return true;const r=a[ka[0]].div(b[ka[0]]);return ka.every(k=>a[k].div(b[k]).eq(r))}
const polyToSide=p=>Object.keys(p).map(Number).sort((a,b)=>b-a).map(k=>M(p[k],k));

/* ================= Texti ================= */
const SUP={2:'²',3:'³',4:'⁴',5:'⁵',6:'⁶'};
function monoAbsT(c,p){const a=c.abs();const co=(p>0&&a.isOne())?'':fT(a);return co+(p?'x'+(p>1?(SUP[p]||'^'+p):''):'')}

const signedT=t=>(sgnOf(t)?MINUS:'+')+termAbsT(t);
const firstT=t=>(sgnOf(t)?MINUS:'')+termAbsT(t);
function sideT(s){if(!s.length)return'0';return s.map((t,i)=>i?(sgnOf(t)?' − ':' + ')+termAbsT(t):firstT(t)).join('')}
const eqT=st=>sideT(st.L)+' = '+sideT(st.R);
const paren=m=>m.c.isNeg()?'('+MINUS+monoAbsT(m.c,m.p)+')':monoAbsT(m.c,m.p);
const kText=k=>(k.c.isNeg()?MINUS:'')+(kTriv(k)?'1':monoAbsT(k.c,k.p));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= HTML stærðfræði ================= */
const pc=p=>p>2?3:p;
const fH=f=>f.d===1?String(f.n):`<span class="fr"><span>${f.n}</span><span>${f.d}</span></span>`;
function monoAbsH(c,p){const a=c.abs();const co=(p>0&&a.isOne())?'':fH(a);return co+(p?'<i>x</i>'+(p>1?`<sup>${p}</sup>`:''):'')}
function innerH(b){return b.map((m,i)=>{const n=m.c.isNeg();const op=i?(n?MINUS:'+'):(n?MINUS:'');return `<span class="in p${pc(m.p)}">${op?`<span class="op${i?'':' op0'}">${op}</span>`:''}<span class="bd">${monoAbsH(m.c,m.p)}</span></span>`}).join('')}
const gapH=(k,i)=>`<span class="gap" data-drop="gap" data-side="${k}" data-idx="${i}"></span>`;
const LAB={2:'A',1:'B',0:'C'};
function termH(t,i,key,I,o){
  const n=sgnOf(t),opc=i?'op':'op op0',opTxt=i?(n?MINUS:'+'):(n?MINUS:'');
  const cls=(o.sel&&o.sel.includes(t.id)?' sel':'')+(o.hi&&o.hi.includes(t.id)?' hint':'');
  const ia=I?` tabindex="0" role="button" aria-label="${esc(signedT(t))}"`:'';
  if(t.t==='m'){
    const lab=o.labels&&LAB[t.p]?`<span class="lab">${LAB[t.p]} = ${fT(t.c)}</span>`:'';
    return `<span class="tm m p${pc(t.p)}${cls}" data-kind="m" data-id="${t.id}" data-side="${key}"${I?' data-drag="m"':''}${ia}>${opTxt?`<span class="${opc}">${opTxt}</span>`:''}<span class="bd">${monoAbsH(t.c,t.p)}</span>${lab}</span>`;
  }
  const kd=I?` data-drag="k" data-id="${t.id}"`:'';
  let kh;
  if(kTriv(t.k))kh=n?`<span class="kchip"${kd}><span class="${opc}">${MINUS}</span></span>`:(opTxt?`<span class="${opc}">+</span>`:'');
  else kh=`<span class="kchip"${kd}>${opTxt?`<span class="${opc}">${opTxt}</span>`:''}${monoAbsH(t.k.c,t.k.p)}</span>`;
  const bh=t.br.map((b,bi)=>`<span class="br"${I?' data-drag="br"':''} data-gid="${t.id}" data-bi="${bi}"><span class="par">(</span>${innerH(b)}<span class="par">)</span></span>`).join('')+(t.sq?`<sup class="sq"${I?` data-sq="${t.id}"`:''}>2</sup>`:'');
  return `<span class="tm g${cls}" data-kind="g" data-id="${t.id}" data-side="${key}"${ia}>${kh}${bh}</span>`;
}
function sideH(s,key,I,o){
  let h=`<span class="side" data-side="${key}"${I?' data-drop="side"':''}>`;
  if(!s.length)return h+(I?gapH(key,0):'')+'<span class="zero">0</span></span>';
  s.forEach((t,i)=>{if(I)h+=gapH(key,i);h+=termH(t,i,key,I,o)});
  if(I)h+=gapH(key,s.length);
  return h+'</span>';
}
const eqH=(st,I=false,o={})=>`<span class="eqline">${sideH(st.L,'L',I,o)}<span class="eqs"${I?' data-drop="eq"':''}>=</span>${sideH(st.R,'R',I,o)}</span>`;
const eqStrH=(s,o)=>eqH(parseEq(s),false,o||{});
const sideOnlyH=(s,o={})=>`<span class="eqline">${sideH(s,'L',false,o)}</span>`;

/* ================= Aðgerðir vélarinnar ================= */
function negT(t){if(t.t==='m')t.c=t.c.neg();else t.k={...t.k,c:t.k.c.neg()}}
function opMove(st0,id,to){
  const st=cloneS(st0),f=find(st,id),before=signedT(f.term);
  st[f.side].splice(f.idx,1);negT(f.term);
  const o=other(f.side);if(to==null||to>st[o].length)to=st[o].length;
  st[o].splice(to,0,f.term);
  return{st,tag:'færa yfir =',msg:`<b>${before}</b> fór yfir = og varð <b>${signedT(f.term)}</b>. Formerkið snýst.`,flip:[id]};
}
function opReorder(st0,id,gap){
  const st=cloneS(st0),f=find(st,id);
  if(gap===f.idx||gap===f.idx+1)return null;
  const [t]=st[f.side].splice(f.idx,1);st[f.side].splice(gap>f.idx?gap-1:gap,0,t);
  return{st,tag:'raða',msg:'Liðnum var raðað á nýjan stað. Röðin breytir engu, því formerkið fylgir liðnum.'};
}
function opCombine(st0,ids){
  const st=cloneS(st0),fs=ids.map(id=>find(st,id));
  const side=fs[0].side,p=fs[0].term.p;
  if(fs.some(f=>f.side!==side||f.term.t!=='m'||f.term.p!==p))return{err:'Aðeins má sameina líka liði: sama veldi af x og sömu megin við =.'};
  let sum=F0;fs.forEach(f=>sum=sum.add(f.term.c));
  const ord=[...fs].sort((a,b)=>a.idx-b.idx);
  const expr=ord.map((f,i)=>i?(f.term.c.isNeg()?' − ':' + ')+monoAbsT(f.term.c,p):(f.term.c.isNeg()?MINUS:'')+monoAbsT(f.term.c,p)).join('');
  const tIdx=fs[fs.length-1].idx,newIdx=tIdx-fs.filter(f=>f.idx<tIdx).length;
  st[side]=st[side].filter(t=>!ids.includes(t.id));
  let fresh=[];
  if(!sum.isZero()){const nm=M(sum,p);st[side].splice(newIdx,0,nm);fresh=[nm.id]}
  const res=sum.isZero()?'0':(sum.isNeg()?MINUS:'')+monoAbsT(sum,p);
  return{st,tag:'sameina líka liði',msg:`<b>${expr} = ${res}</b>`+(sum.isZero()?'. Liðirnir styttast út.':'. Stuðlarnir eru lagðir saman, x-ið helst eins.'),fresh};
}
function opDistribute(st0,gid,bi){
  const st=cloneS(st0),f=find(st,gid),g=f.term;
  if(g.sq)return{err:'Fyrst þarf að reikna veldið. (a + b)² er (a + b)(a + b), ekki a² + b². Smelltu á litla ² eða notaðu Þ1/Þ2.'};
  const k=g.k,nb=g.br[bi].map(m=>M(m.c.mul(k.c),m.p+k.p));
  let msg,tag;
  if(kTriv(k)&&!k.c.isNeg()){msg='Sviginn fjarlægður. Plús fyrir framan sviga breytir engu.';tag='losa sviga'}
  else if(kTriv(k)){msg='Mínus fyrir framan sviga: <b>öll</b> formerki inni í sviganum snúast.';tag='mínus inn í sviga'}
  else{
    const kt=kText(k);
    msg=`<b>${kt}</b> margfaldaðist við hvern lið: <b>${g.br[bi].map(m=>(k.c.isNeg()?'('+kt+')':kt)+'·'+paren(m)).join(',  ')}</b>.`;
    if(k.c.isNeg()&&g.br[bi].some(m=>m.c.isNeg()))msg+=' Mínus sinnum mínus = plús.';
    tag='margfalda inn í sviga';
  }
  if(g.br.length===1)st[f.side].splice(f.idx,1,...nb);else{g.br[bi]=nb;g.k={c:F1,p:0}}
  return{st,tag,msg,fresh:nb.map(m=>m.id)};
}
function opMulBr(st0,gid){
  const st=cloneS(st0),f=find(st,gid),g=f.term;
  if(g.br.length!==2)return null;
  const [b0,b1]=g.br,prods=[],parts=[];
  for(const a of b0)for(const b of b1){prods.push(M(a.c.mul(b.c),a.p+b.p));parts.push(paren(a)+'·'+paren(b))}
  const conj=b0.length===2&&b1.length===2&&b0[0].c.eq(b1[0].c)&&b0[0].p===b1[0].p&&b0[1].p===b1[1].p&&b0[1].c.eq(b1[1].c.neg());
  if(kTriv(g.k)&&!g.k.c.isNeg())st[f.side].splice(f.idx,1,...prods);else g.br=[prods];
  return{st,tag:'hver liður við hvern',lab:conj?'Þ3':'',msg:`Hver liður í fyrri sviganum margfaldaðist við hvern lið í þeim seinni: <b>${parts.join(',  ')}</b>.`+(conj?' Þetta er samokareglan (Þ3): x-liðirnir munu styttast út.':' Næst: sameinaðu líka liði.'),fresh:prods.map(m=>m.id)};
}
function opUnfold(st0,gid){
  const st=cloneS(st0),g=find(st,gid).term;
  g.sq=false;g.br=[g.br[0],g.br[0].map(m=>M(m.c,m.p))];
  return{st,tag:'(a)² = (a)(a)',msg:'Í öðru veldi þýðir: sviginn sinnum sjálfan sig. Nú má margfalda svigana saman, hvern lið við hvern.'};
}
function opSquare(st0,gid){
  const st=cloneS(st0),f=find(st,gid),g=f.term,b=g.br[0];
  if(b.length!==2)return{err:'Þ1 og Þ2 virka aðeins á sviga með tveimur liðum.'};
  const [a,c]=b;
  const t=[M(a.c.mul(a.c),2*a.p),M(a.c.mul(c.c).mul(2),a.p+c.p),M(c.c.mul(c.c),2*c.p)];
  const lab=t[1].c.isNeg()?'Þ2':'Þ1';
  if(kTriv(g.k)&&!g.k.c.isNeg())st[f.side].splice(f.idx,1,...t);else{g.sq=false;g.br=[t]}
  const aT=monoAbsT(a.c,a.p),bT=monoAbsT(c.c,c.p);
  return{st,tag:lab==='Þ1'?'ferningsregla':'ferningsregla',lab,msg:`${lab}: fyrri liður í öðru veldi, ${lab==='Þ1'?'plús':'mínus'} tvisvar sinnum margfeldið, seinni liður í öðru veldi. Hér er a = <b>${aT}</b> og b = <b>${bT}</b>.`,fresh:t.map(m=>m.id)};
}
function opFactor(st0,ids,fac){
  const st=cloneS(st0),fs=ids.map(id=>find(st,id)).sort((a,b)=>a.idx-b.idx),side=fs[0].side;
  const inner=fs.map(f=>M(f.term.c.div(fac.c),f.term.p-fac.p));
  const pos=fs[0].idx;
  st[side]=st[side].filter(t=>!ids.includes(t.id));
  const g=G({c:fac.c,p:fac.p},[inner],false);
  st[side].splice(pos,0,g);
  const ft=kText(fac);
  return{st,tag:'taka út fyrir sviga',msg:`<b>${ft}</b> tekið út fyrir sviga: hverjum lið deilt með <b>${ft}</b>. Margfaldaðu aftur inn til að prófa!`,fresh:[g.id]};
}
function opScale(st0,f){
  const st=cloneS(st0);const ids=[];
  for(const s of ['L','R'])for(const t of st[s]){if(t.t==='m')t.c=t.c.mul(f);else t.k={...t.k,c:t.k.c.mul(f)};ids.push(t.id)}
  const tag=f.n===1&&f.d>1?':'+f.d:'·('+fT(f)+')';
  return{st,tag,msg:`Allir liðir <b>báðum megin</b> ${f.n===1&&f.d>1?'deilt með '+f.d:'margfaldaðir með '+(f.isNeg()?'('+fT(f)+')':fT(f))}.`+(f.isNeg()?' Öll formerki snúast.':''),flip:f.isNeg()?ids:[]};
}
function opSwap(st0){const st=cloneS(st0);return{st:{L:st.R,R:st.L},tag:'skipta um hliðar',msg:'Hliðunum var víxlað. a = b er það sama og b = a, og ekkert formerki breytist.'}}

/* ================= Greining ================= */
function analyze(st){
  const all=[...st.L,...st.R],groups=all.some(t=>t.t==='g');
  const rZero=!st.R.length,lZero=!st.L.length;
  const uniq=s=>{const ps=s.filter(t=>t.t==='m').map(t=>t.p);return new Set(ps).size===ps.length};
  const combined=uniq(st.L)&&uniq(st.R);
  const ps=st.L.map(t=>t.t==='m'?t.p:-1);let ordered=true;for(let i=0;i+1<ps.length;i++)if(ps[i]<=ps[i+1])ordered=false;
  const poly=ePoly(st),d=deg(poly),lp=sPoly(st.L);
  const std=!groups&&rZero&&!lZero&&combined&&ordered;
  return{groups,rZero,lZero,combined,ordered,d,std,A:lp[2]||F0,B:lp[1]||F0,C:lp[0]||F0};
}
function likePair(s){const seen={};for(const t of s){if(t.t!=='m')continue;if(seen[t.p])return[seen[t.p],t];seen[t.p]=t}return null}
function hintFor(st,goal){
  if(goal==='factor'){
    if(st.R.length){const t=st.R[0];return{h:`Færðu <b>${signedT(t)}</b> yfir = fyrst, svo 0 verði hægra megin.`,ids:[t.id]}}
    if(st.L.some(t=>t.t==='g'))return{h:'Ef x er ekki fyrir framan svigann: ýttu á „Til baka“ og veldu x (eða t.d. 2x) þegar þú tekur út fyrir sviga.',ids:[]};
    return{h:'Smelltu á báða liðina svo þeir verði valdir. Ýttu svo á „Taka út fyrir sviga…“ og veldu x.',ids:st.L.map(t=>t.id)};
  }
  for(const s of ['L','R'])for(const t of st[s])if(t.t==='g'&&t.sq)return{h:'Byrjaðu á sviganum í öðru veldi. Smelltu á litla ² til að skrifa hann sem (…)(…), eða veldu hann og notaðu Þ1/Þ2.',ids:[t.id]};
  for(const s of ['L','R'])for(const t of st[s])if(t.t==='g'&&t.br.length===2){
    if(!kTriv(t.k))return{h:`Dragðu <b>${kText(t.k)}</b> inn í annan svigann fyrst, eða margfaldaðu svigana saman.`,ids:[t.id]};
    return{h:'Margfaldaðu svigana saman: dragðu annan svigann á hinn. Hver liður margfaldast við hvern.',ids:[t.id]};
  }
  for(const s of ['L','R'])for(const t of st[s])if(t.t==='g'){
    if(kTriv(t.k)&&!t.k.c.isNeg())return{h:'Plús fyrir framan sviga: veldu svigann og ýttu á „Losa sviga“.',ids:[t.id]};
    if(kTriv(t.k))return{h:'Mínus fyrir framan sviga: dragðu mínusinn inn í svigann. Þá snúast <b>öll</b> formerkin inni.',ids:[t.id]};
    return{h:`Dragðu <b>${kText(t.k)}</b> inn í svigann. Það margfaldast við hvern lið.`,ids:[t.id]};
  }
  if(!st.L.length&&st.R.length)return{h:'Allt er hægra megin. Ýttu á ⇄ Skipta um hliðar.',ids:[]};
  if(st.R.length){const t=st.R[0];const n=cloneT(t);negT(n);return{h:`Færðu <b>${signedT(t)}</b> yfir =. Þá snýst formerkið: <b>${signedT(t)}</b> verður <b>${signedT(n)}</b>.`,ids:[t.id]}}
  const lp=likePair(st.L);if(lp)return{h:`Sameinaðu <b>${signedT(lp[0])}</b> og <b>${signedT(lp[1])}</b>: dragðu annan á hinn.`,ids:[lp[0].id,lp[1].id]};
  const a=analyze(st);
  if(!a.ordered){const t=[...st.L].sort((x,y)=>y.p-x.p)[0];return{h:`Raðaðu liðunum: x² fremst, svo x, svo talan án x. Dragðu <b>${signedT(t)}</b> fremst.`,ids:[t.id]}}
  if(goal==='std+'&&a.A.isNeg())return{h:'A er mínus. Margfaldaðu báðar hliðar með (−1). Þá snúast öll formerkin.',ids:[]};
  return{h:'Jafnan er komin á staðalform.',ids:[]};
}
function factorCands(ts){
  const allInt=ts.every(t=>t.c.d===1);
  const g=allInt?ts.reduce((a,t)=>gcd(a,t.c.n),0):1;
  const mp=Math.min(...ts.map(t=>t.p));
  const out=[];
  for(let d=g;d>=1;d--)if(g%d===0)for(let j=mp;j>=0;j--){if(d===1&&j===0)continue;out.push({c:new F(d),p:j})}
  if(ts[0].c.isNeg()){out.unshift({c:new F(-1),p:0});if(g>1||mp>0)out.unshift({c:new F(-g),p:mp})}
  return out.slice(0,7);
}

/* ================= Algebruvélin ================= */

/* ================= Slembidæmi ================= */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const NZ=(a,b)=>{let v;do v=R(a,b);while(v===0);return v};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
function tstr(c,p,first){const f=F.of(c);if(f.isZero())return'';const s=f.isNeg()?'-':(first?'':'+');const a=f.abs();const co=(p>0&&a.isOne())?'':(a.d===1?String(a.n):a.n+'/'+a.d);return s+co+(p===0?'':p===1?'x':'x^'+p)}
function sstr(list){let o='',first=true;for(const[c,p]of list){const t=tstr(c,p,first);if(t){o+=t;first=false}}return o||'0'}
const sg=m=>m<0?String(m):'+'+m;
const GENS={
  move:()=>{const a=pick([1,1,2,3]),b=NZ(-9,9),c=NZ(-20,20);return pick([`${sstr([[a,2],[b,1]])}=${c}`,`${sstr([[a,2]])}=${sstr([[b,1],[c,0]])}`,`${sstr([[a,2],[c,0]])}=${sstr([[b,1]])}`])},
  like:()=>{const a=R(2,6),d=pick([R(1,a-1),-R(1,3)]),b=NZ(-8,8),e=NZ(-8,8),c=R(-9,9),f=NZ(-9,9);return `${sstr([[a,2],[b,1],[c,0]])}=${sstr(shuffle([[d,2],[e,1],[f,0]]))}`},
  order:()=>{const a=R(1,4),b=NZ(-9,9),c=NZ(-12,12);const L=shuffle([[a,2],[b,1],[c,0]]);if(L[0][1]===2)L.push(L.shift());return pick([`${sstr(L)}=0`,`${c}=${sstr([[a,2],[-b,1]].reverse())}`])},
  bracket:()=>{const k=R(2,5),m=NZ(-7,7),b=NZ(-9,9),c=NZ(-9,9),n=NZ(-15,15);return pick([`${k}(x^2${sg(m)})=${sstr([[b,1]])}`,`x(x${sg(m)})=${n}`,`${k}x(x${sg(m)})=${sstr([[b,1],[c,0]])}`])},
  minus:()=>{const a=R(2,4),b=NZ(-7,7),c=NZ(-9,9),d=NZ(-6,6);return pick([`${sstr([[a,2]])}-(${sstr([[b,1],[c,0]])})=${sstr([[d,1]])}`,`x^2-${R(2,4)}(x${sg(c)})=${sstr([[d,1]])}`])},
  square:()=>{const m=NZ(-6,6),b=NZ(-8,8),c=NZ(-15,15),a=R(2,3);return pick([`(x${sg(m)})^2=${sstr([[b,1],[c,0]])}`,`(${a}x${sg(m)})^2=${sstr([[c,0]])}`])},
  product:()=>{const m=NZ(-7,7),n=NZ(-7,7),c=NZ(-12,12),a=R(2,3),b=NZ(-6,6);return pick([`(x${sg(m)})(x${sg(n)})=${c}`,`(x${sg(m)})(${a}x${sg(n)})=${sstr([[b,1]])}`,`(x${sg(Math.abs(m))})(x-${Math.abs(m)})=${sstr([[b,1]])}`])},
  negA:()=>{const a=R(1,3),b=NZ(-8,8),c=NZ(-12,12);return pick([`${Math.abs(c)}-x^2=${sstr([[b,1]])}`,`${sstr([[b,1],[-a,2]])}=${c}`,`x(${Math.abs(b)}-x)=${c}`])},
  mixed:()=>GENS[pick(['bracket','minus','square','product','negA','like'])]()
};
function genEq(key){
  for(let i=0;i<60;i++){const s=GENS[key]();try{const st=parseEq(s),p=ePoly(st);if(deg(p)!==2)continue;if(key!=='negA'&&key!=='mixed'&&p[2].isNeg())continue;if(key==='negA'&&!p[2].isNeg())continue;if(Object.keys(p).length<2&&key!=='square')continue;return s}catch(_){}}
  return 'x^2+2x=8';
}
function genABC(level){
  const a=pick([1,1,2,3,-1,-2,5]),b=NZ(-9,9),c=NZ(-12,12);
  if(level===1)return `${sstr([[a,2],[b,1],[c,0]])}=0`;
  return pick([`${sstr([[a,2],[c,0]])}=0`,`${sstr([[a,2],[b,1]])}=0`,`${sstr(shuffle([[a,2],[b,1],[c,0]]))}=0`,`${sstr([[pick([-1,1]),2],[pick([-1,1]),1],[c,0]])}=0`,`${sstr([[new F(1,pick([2,3,4])),2],[b,1],[c,0]])}=0`]);
}

function plotSVG(o){
  const W=520,H=380,[x0,x1]=o.xr,[y0,y1]=o.yr;
  const sx=x=>(x-x0)/(x1-x0)*W,sy=y=>H-(y-y0)/(y1-y0)*H;
  const id='cp'+(++CLIP);
  let g=`<defs><clipPath id="${id}"><rect x="0" y="0" width="${W}" height="${H}"/></clipPath></defs>`;
  for(let x=Math.ceil(x0);x<=x1;x++)g+=`<line class="gl" x1="${sx(x)}" y1="0" x2="${sx(x)}" y2="${H}"/>`;
  for(let y=Math.ceil(y0);y<=y1;y++)g+=`<line class="gl" x1="0" y1="${sy(y)}" x2="${W}" y2="${sy(y)}"/>`;
  g+=`<line class="ax" x1="${sx(0)}" y1="0" x2="${sx(0)}" y2="${H}"/><line class="xaxis" x1="0" y1="${sy(0)}" x2="${W}" y2="${sy(0)}"/>`;
  for(let x=Math.ceil(x0);x<=x1;x++)if(x&&x%2===0)g+=`<text x="${sx(x)}" y="${sy(0)+16}" text-anchor="middle">${String(x).replace('-',MINUS)}</text>`;
  for(let y=Math.ceil(y0);y<=y1;y++)if(y&&y%2===0)g+=`<text x="${sx(0)-6}" y="${sy(y)+4}" text-anchor="end">${String(y).replace('-',MINUS)}</text>`;
  g+=`<text class="tl" x="${W-6}" y="${sy(0)-8}" text-anchor="end">x</text><text class="tl" x="${sx(0)+8}" y="14">y</text>`;
  let d='';const N=260;for(let i=0;i<=N;i++){const x=x0+(x1-x0)*i/N,y=o.fn(x);const Y=Math.max(-2000,Math.min(2000,sy(y)));d+=(i?'L':'M')+sx(x).toFixed(1)+' '+Y.toFixed(1)}
  g+=`<g clip-path="url(#${id})">`;
  if(o.hline!=null)g+=`<line class="hl" x1="0" y1="${sy(o.hline)}" x2="${W}" y2="${sy(o.hline)}"/>`;
  g+=`<path class="cv" d="${d}"/>`;
  (o.drops||[]).forEach(p=>{g+=`<line class="drop" x1="${sx(p[0])}" y1="${sy(p[1])}" x2="${sx(p[0])}" y2="${sy(0)}"/>`});
  (o.pts||[]).forEach(p=>{g+=`<circle class="dot hit" cx="${sx(p[0])}" cy="${sy(p[1])}" r="7"/>`});
  g+='</g>';
  (o.labels||[]).forEach(l=>{g+=`<text class="tk" x="${sx(l[0])}" y="${Math.min(H-6,sy(l[1])+(l[2]||0))}" text-anchor="middle">${l[3]}</text>`});
  if(o.hline!=null&&o.hlabel)g+=`<text class="tk" x="8" y="${sy(o.hline)-8}">${o.hlabel}</text>`;
  return `<svg class="plot" viewBox="-30 -10 ${W+44} ${H+30}" role="img" aria-label="${esc(o.aria||'Graf')}">${g}</svg>`;
}

const navEl=document.getElementById('nav'),mainEl=document.getElementById('main');
const lvlH=l=>l?`<span class="lvl" aria-label="Erfiðleiki ${l} af 3">${'●'.repeat(l)}<span class="off">${'●'.repeat(3-l)}</span></span>`:'';
function itemDone(it){return !!STORE.done[it.id]}
function markDone(it){if(!STORE.done[it.id]){STORE.done[it.id]=1;save();renderNav(it);renderProg()}}
function renderProg(){const tot=ITEMS.filter(i=>i.kind!=='sandbox').length,d=ITEMS.filter(i=>i.kind!=='sandbox'&&itemDone(i)).length;document.getElementById('pbar').style.width=(d/tot*100)+'%';document.getElementById('ptxt').textContent=`${d} / ${tot} atriði`}
function renderNav(curIt){
  navEl.innerHTML=`<div class="nav-close"><b>Námsleið</b><button class="btn sm" id="navX">Loka</button></div>`+MODS.map(m=>`<div class="nav-mod"><h3><b>${m.n}</b>${m.title}</h3>`+m.items.map(it=>`<button class="nav-item${it.id===curIt.id?' cur':''}${itemDone(it)?' done':''}" data-go="${it.id}" ${it.id===curIt.id?'aria-current="page"':''}><span class="st">${itemDone(it)?'✓':''}</span><span class="t">${it.title}</span>${lvlH(it.lvl)}</button>`).join('')+'</div>').join('');
}
navEl.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){go(b.dataset.go);document.body.classList.remove('nav-open')}if(e.target.id==='navX')document.body.classList.remove('nav-open')});
document.getElementById('navBtn').addEventListener('click',()=>{document.body.classList.toggle('nav-open');document.getElementById('navBtn').setAttribute('aria-expanded',document.body.classList.contains('nav-open'))});
function go(id){if(location.hash!=='#s'+id)location.hash='s'+id;else show(id)}
function curItem(){const m=location.hash.match(/^#s(\d+-\d+)$/);const id=m?m[1]:STORE.last||'1-1';return ITEMS.find(i=>i.id===id)||ITEMS[0]}
window.addEventListener('hashchange',()=>show(curItem().id));
function show(id){
  const it=ITEMS.find(i=>i.id===id)||ITEMS[0];
  STORE.last=it.id;save();renderNav(it);renderProg();
  const i=ITEMS.indexOf(it),prev=ITEMS[i-1],next=ITEMS[i+1];
  mainEl.innerHTML=`<div class="ihead"><span class="eyebrow">${it.mod.n} · ${it.mod.title}</span><h2>${it.title}</h2><div class="meta">${lvlH(it.lvl)}<span>Atriði ${i+1} af ${ITEMS.length}</span></div></div><div id="body"></div>
    <div class="ifoot">${prev?`<button class="btn" data-go2="${prev.id}">← ${prev.title}</button>`:'<span></span>'}${next?`<button class="btn pri" data-go2="${next.id}">${next.title} →</button>`:''}</div>`;
  mainEl.querySelectorAll('[data-go2]').forEach(b=>b.addEventListener('click',()=>{go(b.dataset.go2);scrollTo({top:0,behavior:'smooth'})}));
  const body=mainEl.querySelector('#body');
  VIEWS[it.kind](body,it,next);
}
const nextBtn=next=>next?`<button class="btn pri" data-gonext="${next.id}">${next.title} →</button>`:'';
function wireNext(el){el.querySelectorAll('[data-gonext]').forEach(b=>b.addEventListener('click',()=>{go(b.dataset.gonext);scrollTo({top:0,behavior:'smooth'})}))}

VIEWS.engine=(body,it,next)=>{
  const list=()=>[...it.probs,...(EXTRA[it.id]||[])];
  let idx=Math.min(STORE.pd['cur'+it.id]||0,list().length-1);
  if(STORE.pd[it.id+'#'+idx]){const f=list().findIndex((_,j)=>!STORE.pd[it.id+'#'+j]);if(f>=0)idx=f}
  body.innerHTML=`<div class="prose" style="margin-bottom:14px"><p>${it.text}</p></div><div id="pb"></div><div id="eng"></div>`;
  const pb=body.querySelector('#pb');
  const nextLabel=()=>idx<list().length-1?'Næsta dæmi →':(next?next.title+' →':'');
  const eng=Engine(body.querySelector('#eng'),{eq:list()[idx],goal:it.goal||'std',nextLabel:nextLabel(),
    onSolved:()=>{probDone(it,idx);drawBar()},
    onNext:()=>{if(idx<list().length-1)setP(idx+1);else if(next){go(next.id);scrollTo({top:0,behavior:'smooth'})}}});
  function setP(j){idx=j;STORE.pd['cur'+it.id]=j;save();eng.load(list()[idx]);drawBar();}
  const cfgRef=()=>{};
  function drawBar(){pb.innerHTML=probBar(it,list(),idx);
    pb.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>setP(+b.dataset.p));
    const nb=pb.querySelector('[data-new]');if(nb)nb.onclick=()=>{(EXTRA[it.id]=EXTRA[it.id]||[]).push(genEq(it.gen));setP(list().length-1)};
    const btn=body.querySelector('[data-act="next"]');if(btn)btn.textContent=nextLabel();
  }
  // uppfæra hnappatexta í hvert sinn sem vélin teiknar borðann
  const obs=new MutationObserver(()=>{const btn=body.querySelector('[data-act="next"]');if(btn&&btn.textContent!==nextLabel())btn.textContent=nextLabel()});
  obs.observe(body.querySelector('#eng'),{childList:true,subtree:true});
  drawBar();
};

function parseNum(s){
  s=String(s).trim().replace(/[−–]/g,'-').replace(',','.').replace(/^\+/,'');
  if(s==='')return null;
  if(!/^-?\d+(\.\d+)?(\/\d+)?$/.test(s))return undefined;
  const [p,q]=s.split('/');let f=toF(p);if(q){if(+q===0)return undefined;f=f.div(+q)}return f;
}
let ABCN=0;
function ABCBox(host,st,onDone){
  const n=++ABCN;const lp=sPoly(st.L);const V={A:lp[2]||F0,B:lp[1]||F0,C:lp[0]||F0};
  const what={A:'stuðullinn við x²',B:'stuðullinn við x',C:'talan án x'};
  host.innerHTML=`<div class="abc"><div class="abc-eq">${eqH(st,false,{labels:true})}</div>
    <div class="abc-fields">${['A','B','C'].map(L=>`<div class="abc-f" data-l="${L}"><div class="fl"><label for="abc${n}${L}">${L} =</label><input id="abc${n}${L}" inputmode="decimal" autocomplete="off" spellcheck="false"><button class="btn sm pm" data-pm="${L}" aria-label="Skipta um formerki á ${L}">±</button></div><span class="what">${what[L]}</span><span class="msg"></span></div>`).join('')}</div>
    <div class="row"><button class="btn pri" data-chk>Athuga</button><button class="btn" data-show hidden>Sýna svar</button></div></div>`;
  const eqEl=host.querySelector('.abc-eq');let tries=0;
  host.querySelectorAll('[data-pm]').forEach(b=>b.onclick=()=>{const i=host.querySelector('#abc'+n+b.dataset.pm);let v=i.value.trim().replace(/[−–]/g,'-');i.value=v.startsWith('-')?v.slice(1):MINUS+v.replace(/^\+/,'');i.focus()});
  host.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')check()}));
  function fbFor(L,v){
    const e=V[L];
    if(v===null)return'Skrifaðu tölu. Ef liðinn vantar er stuðullinn 0.';
    if(v===undefined)return'Skrifaðu heila tölu eða brot, t.d. −3 eða 1/2.';
    if(v.eq(e))return'';
    if(!e.isZero()&&v.abs().eq(e.abs()))return'Athugaðu formerkið. Mínusinn fyrir framan liðinn fylgir með.';
    if(e.isZero())return`Er einhver liður ${L==='B'?'með x':L==='C'?'án x':'með x²'}? Ef hann vantar er ${L} = 0.`;
    if(e.abs().isOne()&&(v.isZero()))return'x er það sama og 1x. Stuðullinn er 1 (eða −1 ef mínus er fyrir framan).';
    const o=['A','B','C'].find(K=>K!==L&&V[K].eq(v));
    if(o)return`Þetta er ${o}. ${L} er ${what[L]}.`;
    return`Ekki rétt. Hvaða tala stendur fyrir framan ${L==='A'?'x²':L==='B'?'x':'(talan án x)'}?`;
  }
  function check(){
    let all=true;tries++;
    ['A','B','C'].forEach(L=>{
      const box=host.querySelector(`.abc-f[data-l="${L}"]`),v=parseNum(box.querySelector('input').value),m=fbFor(L,v);
      box.classList.toggle('ok',!m);box.classList.toggle('no',!!m);box.querySelector('.msg').textContent=m||'Rétt!';
      if(!m)eqEl.classList.add('show-'+L);else{all=false;eqEl.classList.remove('show-'+L)}
    });
    if(all){host.querySelector('[data-chk]').disabled=true;host.querySelectorAll('input,[data-pm]').forEach(x=>x.disabled=true);host.querySelector('[data-show]').hidden=true;onDone&&onDone()}
    else if(tries>=2)host.querySelector('[data-show]').hidden=false;
  }
  host.querySelector('[data-chk]').onclick=check;
  host.querySelector('[data-show]').onclick=()=>{['A','B','C'].forEach(L=>host.querySelector('#abc'+n+L).value=fT(V[L]));check()};
}

/* ================= Lausnarformúlan ================= */
const nH=f=>(f.isNeg()?MINUS:'')+fH(f.abs());
const fracX=(a,b)=>`<span class="fx"><span>${a}</span><span>${b}</span></span>`;
const sqrtX=x=>`<span class="rt"><span>√</span><span class="rb">${x}</span></span>`;
function fsqrt(f){if(f.isNeg())return null;const a=Math.round(Math.sqrt(f.n)),b=Math.round(Math.sqrt(f.d));return a*a===f.n&&b*b===f.d?new F(a,b):null}
const fEq=(v,e)=>v instanceof F&&v.eq(e);
const CIRC=['①','②','③','④','⑤','⑥','⑦'];

function coefFb(L,v,V){
  const e=V[L],what={A:'stuðullinn við x²',B:'stuðullinn við x',C:'talan án x'};
  if(v===null)return'Skrifaðu tölu. Ef liðinn vantar er stuðullinn 0.';
  if(v===undefined)return'Skrifaðu heila tölu eða brot, t.d. −3 eða 1/2.';
  if(v.eq(e))return'';
  if(!e.isZero()&&v.abs().eq(e.abs()))return`${L}: athugaðu formerkið. Mínusinn fyrir framan liðinn fylgir með.`;
  if(e.isZero())return`${L}: er einhver liður ${L==='B'?'með x':L==='C'?'án x':'með x²'}? Ef hann vantar er ${L} = 0.`;
  if(e.abs().isOne()&&v.isZero())return`${L}: x er það sama og 1x. Stuðullinn er 1 (eða −1).`;
  const o=['A','B','C'].find(K=>K!==L&&V[K].eq(v));
  if(o)return`${L}: þetta er ${o}. ${L} er ${what[L]}.`;
  return`${L}: ekki rétt. ${L} er ${what[L]}.`;
}
function verifyLine(A,B,C,r){
  const parts=[A.mul(r).mul(r),B.mul(r),C].filter(x=>!x.isZero());
  const sum=parts.map((x,i)=>i?(x.isNeg()?' − ':' + ')+fH(x.abs()):nH(x)).join('')||'0';
  const rr=r.isNeg()?'('+nH(r)+')':nH(r);
  const sub=[[A,2],[B,1],[C,0]].filter(x=>!x[0].isZero()).map(([c,p],i)=>{
    const sgn=c.isNeg()?(i?' − ':MINUS):(i?' + ':'');const a=c.abs();
    if(p===0)return sgn+fH(a);
    const co=a.isOne()?'':fH(a)+'·';
    return sgn+co+rr+(p===2?'<sup>2</sup>':'');
  }).join('');
  return `<i>x</i> = ${nH(r)}: &nbsp;${sub} = ${sum} = 0 <span class="good">✓</span>`;
}

let SOLN=0;
function Solver(host,src,cfg={}){
  const n=++SOLN;
  const st=typeof src==='string'?parseEq(src):src;
  const lp=sPoly(st.L);const A=lp[2]||F0,B=lp[1]||F0,C=lp[0]||F0;
  const V={A,B,C};
  const B2=B.mul(B),AC4=A.mul(C).mul(4),D=B2.sub(AC4);
  const cnt=D.isZero()?1:D.isNeg()?0:2;
  const sD=fsqrt(D),mB=B.neg(),A2=A.mul(2);
  const x1=sD&&mB.add(sD).div(A2),x2=sD&&mB.sub(sD).div(A2);
  const dv=D.val();
  const pB=`(${nH(B)})`,pA=`(${nH(A)})`,pC=`(${nH(C)})`;
  const steps=[];
  steps.push({ref:'A1',t:'Lestu af A, B og C',
    why:'A er stuðullinn við x², B við x og C er talan án x. Mínus fyrir framan lið fylgir stuðlinum.',
    math:b=>`<i>A</i> = ${b(0)} &nbsp;&nbsp; <i>B</i> = ${b(1)} &nbsp;&nbsp; <i>C</i> = ${b(2)}`,
    exp:[A,B,C],drag:{src:'eq',want:['A','B','C']},hintDrag:'Dragðu liðina úr jöfnunni á réttan staf. Ef lið vantar: dragðu 0.',
    check:v=>['A','B','C'].map((L,i)=>coefFb(L,v[i],V))});
  steps.push({ref:'A2',t:'Settu inn í D, allt í sviga',
    why:'Í formúlunni D = B² − 4AC kemur B, A og C í staðinn fyrir stafina. Sviginn heldur formerkinu með tölunni.',
    math:b=>`<i>D</i> = <i>B</i><sup>2</sup> − 4<i>AC</i> = (${b(0)})<sup>2</sup> − 4 · (${b(1)}) · (${b(2)})`,
    exp:[B,A,C],drag:{src:'vals',keys:['A','B','C'],want:['B','A','C']},hintDrag:'Dragðu B, A og C á sinn stað í formúlunni.',check:v=>[['B',B],['A',A],['C',C]].map(([L,e],i)=>v[i]===null||v[i]===undefined?'Skrifaðu tölu í hvern reit.':v[i].eq(e)?'':v[i].abs().eq(e.abs())?`Hér á ${L} að koma með formerkinu: ${L} = ${nH(e)}.`:`Hér á ${L} að koma. Þú fannst ${L} = ${nH(e)} í skrefinu á undan.`)});
  steps.push({ref:'A2',t:'Reiknaðu D í réttri röð',dcalc:true,exp:[D],
    why:'Röð aðgerða: ① veldið ② margföldunin 4 · A · C ③ síðast plús eða mínus.',
    math:()=>dChainH(E.dlines||canonLines())});
  steps.push({ref:'A2',t:'Hvað segir D?',choice:[['2','2 lausnir'],['1','1 lausn'],['0','Engin lausn']],exp:String(cnt),
    why:'D &gt; 0: tvær lausnir. D = 0: ein lausn. D &lt; 0: engin lausn, því engin tala í öðru veldi verður neikvæð.',
    math:()=>`<i>D</i> = ${nH(D)} &nbsp; ${cnt===2?'&gt; 0':cnt===1?'= 0':'&lt; 0'}`,
    wrong:`D = ${nH(D)} er ${cnt===2?'stærra en 0. Þá gefur ± tvær ólíkar tölur: tvær lausnir':cnt===1?'0. Þá gefur + 0 og − 0 sömu töluna: ein lausn':'minna en 0. Ekki er hægt að taka rót af mínustölu: engin lausn'}.`});
  const full=!cfg.countOnly&&cnt>0&&sD;
  if(full){
    steps.push({ref:'A3',t:'Settu inn í lausnarformúluna',
      why:'B fer í svigann á eftir mínusnum, D undir rótina og A í nefnarann. C er ekki með í þessari formúlu.',
      math:b=>`<i>x</i> = ${fracX(`−<i>B</i> ± ${sqrtX('<i>D</i>')}`,'2<i>A</i>')} = ${fracX(`−(${b(0)}) ± ${sqrtX(b(1))}`,`2 · (${b(2)})`)}`,
      exp:[B,D,A],drag:{src:'vals',keys:['A','B','C','D'],want:['B','D','A']},hintDrag:'Dragðu B, D og A á sinn stað. Eitt spjaldið á ekki heima í formúlunni.'});
    steps.push({ref:'A3',t:'Reiknaðu −B, √D og 2A',
      why:`−B snýr formerkinu á B: −(${nH(B)}) = ${nH(mB)}. √${nH(D)} = ${nH(sD)}, því ${nH(sD)} · ${nH(sD)} = ${nH(D)}. 2A = 2 · ${pA} = ${nH(A2)}.`,
      math:b=>`<i>x</i> = ${fracX(`−(${nH(B)}) ± ${sqrtX(nH(D))}`,`2 · (${nH(A)})`)} = ${fracX(`${b(0)} ± ${b(1)}`,b(2))}`,
      exp:[mB,sD,A2],check:v=>[
        v[0]==null?'Skrifaðu −B.':v[0].eq(mB)?'':(v[0].eq(B)&&!B.isZero())?`−B snýr formerkinu á B: −(${nH(B)}) = ${nH(mB)}.`:'−B: taktu B og snúðu formerkinu.',
        v[1]==null?'Skrifaðu √D.':v[1].eq(sD)?'':v[1].eq(sD.neg())?'Rótin sjálf er jákvæð. Plús og mínus koma með ±.':v[1].eq(D.div(2))?'Rót er ekki það sama og að deila með 2.':`√D: hvaða tala sinnum sjálf sig gefur ${nH(D)}?`,
        v[2]==null?'Skrifaðu 2A.':v[2].eq(A2)?'':v[2].eq(A)?'Nefnarinn er 2A, tvisvar sinnum A.':v[2].abs().eq(A2.abs())?`Athugaðu formerkið: 2 · ${pA} = ${nH(A2)}.`:`2A = 2 · ${pA}.`]});
    if(cnt===2)steps.push({ref:'A3',t:'Reiknaðu báðar lausnirnar',
      why:`Reiknaðu teljarann fyrst, deildu svo með ${nH(A2)}. Einu sinni með + og einu sinni með −.`,
      math:b=>`<i>x</i><sub>1</sub> = ${fracX(`${nH(mB)} + ${nH(sD)}`,nH(A2))} = ${b(0)} &nbsp;&nbsp;&nbsp; <i>x</i><sub>2</sub> = ${fracX(`${nH(mB)} − ${nH(sD)}`,nH(A2))} = ${b(1)}`,
      exp:[x1,x2],check:(v,tries)=>{
        if(fEq(v[0],x2)&&fEq(v[1],x1))return['',''];
        return [[0,x1,mB.add(sD),'+'],[1,x2,mB.sub(sD),'−']].map(([i,e,num,s])=>{const x=v[i];
          if(x===null||x===undefined)return'Skrifaðu tölu (heila tölu eða brot).';
          if(x.eq(e))return'';
          if(x.eq(num))return`Gleymdirðu að deila? ${nH(num)} : ${nH(A2)} = ?`;
          if(x.eq(mB.add(s==='+'?sD:sD.neg()).div(A2).neg()))return'Athugaðu formerkið þegar þú deilir.';
          return tries>=1?`Teljarinn: ${nH(mB)} ${s} ${nH(sD)} = ${nH(num)}. Deildu svo með ${nH(A2)}.`:`Reiknaðu teljarann ${nH(mB)} ${s} ${nH(sD)} fyrst.`})}});
    else steps.push({ref:'A3',t:'Reiknaðu lausnina',
      why:`Þegar D = 0 er ± 0 ekkert. Þá er x = −B / 2A = ${nH(mB)} / ${nH(A2)}.`,
      math:b=>`<i>x</i> = ${fracX(`${nH(mB)} ± 0`,nH(A2))} = ${fracX(nH(mB),nH(A2))} = ${b(0)}`,
      exp:[x1],check:v=>[v[0]==null?'Skrifaðu tölu.':v[0].eq(x1)?'':v[0].eq(mB)?`Deildu líka með ${nH(A2)}.`:`${nH(mB)} : ${nH(A2)} = ?`]});
  }

  const E={i:0,tries:0,last:null,vals:[]};
  host.innerHTML=`<div class="solver"><div class="sv-paper">
      <div class="sv-eq">${eqH(st)}</div>
      <div class="sv-mini"><span class="ref">A3</span><span class="m"><i>x</i> = ${fracX(`−<i>B</i> ± ${sqrtX('<i>D</i>')}`,'2<i>A</i>')}</span><span class="ref">A2</span><span class="m"><i>D</i> = <i>B</i><sup>2</sup> − 4<i>AC</i></span></div>
      <ol class="sv-steps"></ol><div class="sv-end"></div></div>
    <aside class="sv-side">
      <div class="sheet"><div class="k">Formúlublaðið</div>
        <div class="fm" data-ref="A1"><span class="ref">A1</span><span><i>A</i><i>x</i><sup style="font-size:.6em">2</sup> + <i>B</i><i>x</i> + <i>C</i> = 0</span></div>
        <div class="fm" data-ref="A2"><span class="ref">A2</span><span><i>D</i> = <i>B</i><sup style="font-size:.6em">2</sup> − 4<i>AC</i></span></div>
        <div class="fm" data-ref="A3"><span class="ref">A3</span><span><i>x</i> = ${fracX(`−<i>B</i> ± ${sqrtX('<i>D</i>')}`,'2<i>A</i>')}</span></div>
        <div class="dtab"><span class="m d2">D &gt; 0</span><span class="d2">2 lausnir</span><span class="m d1">D = 0</span><span class="d1">1 lausn</span><span class="m d0">D &lt; 0</span><span class="d0">engin lausn</span></div>
      </div>
      <div class="plotwrap sv-graph" hidden></div>
    </aside></div>`;
  const $=s=>host.querySelector(s);
  const list=$('.sv-steps'),end=$('.sv-end'),graph=$('.sv-graph');
  const filledVal=(s,i)=>`<b>${nH(s.exp[i])}</b>`;
  function stepHTML(s,k,state){
    const num=`<span class="sv-n">${k+1}</span>`;
    if(state==='todo')return `<li class="sv-li todo">${num}<div class="sv-body"><div class="sv-t">${s.t}</div></div></li>`;
    if(state==='done')return `<li class="sv-li done">${num}<div class="sv-body"><div class="sv-t">${s.t} <span class="ref">${s.ref}</span></div><div class="sv-math">${s.choice?s.math():s.math(i=>nH(s.exp[i]))}</div></div></li>`;
    let m;
    if(s.dcalc&&!cfg.demo){
      const d=E.dc;
      m=`<div class="dc-lines sv-math">${d.lines.slice(0,-1).map((l,j)=>`<div>${j?'= ':'<i>D</i> = '}${l}</div>`).join('')}</div>
        <div class="sv-math dc-expr">${d.lines.length>1?'= ':'<i>D</i> = '}${dExprH(d,true)}</div>
        <div class="dc-help">Dragðu tvær tölur saman til að margfalda, eða smelltu á það sem þú vilt reikna. <b>Röð:</b> ① veldi ② margföldun ③ plús/mínus.</div>
        <div class="dc-prompt"></div>
        <div class="row"><button class="btn sm" data-dhint>Vísbending</button><button class="btn sm ghost" data-dshow hidden>Sýna svar</button></div>`;
    }
    else if(s.choice)m=`<div class="sv-math">${s.math()}</div><div class="row">${s.choice.map(c=>`<button class="btn" data-ch="${c[0]}">${c[1]}</button>`).join('')}</div>`;
    else if(cfg.demo&&s.dcalc)m=`<div class="sv-math dc-lines">${dChainH(canonLines())}</div>`;
    else if(cfg.demo)m=`<div class="sv-math">${s.math(i=>filledVal(s,i))}</div>`;
    else if(s.drag){
      E.chips=chipsFor(s);E.filled=s.drag.want.map(()=>false);E.pick=null;
      m=`<div class="tray" aria-label="Spjöld til að draga"><span class="tray-l">${s.drag.src==='eq'?'Úr jöfnunni:':'Það sem þú veist:'}</span>${E.chips.map((c,j)=>`<span class="vchip" data-c="${j}" tabindex="0" role="button">${c.lab}</span>`).join('')}</div>
        <div class="sv-math">${s.math(i=>`<span class="slot" data-i="${i}" data-want="${s.drag.want[i]}" tabindex="0" role="button" aria-label="Reitur fyrir ${s.drag.want[i]}"></span>`)}</div>
        <div class="row"><button class="btn sm" data-why>Vísbending</button><button class="btn sm ghost" data-show hidden>Sýna svar</button></div>`;
    }
    else m=`<div class="sv-math">${s.math(i=>`<input class="blank" id="sv${n}-${k}-${i}" autocomplete="off" spellcheck="false" aria-label="Reitur ${i+1}">`)}</div>
      <div class="row"><button class="btn pri sm" data-chk>Athuga</button><button class="btn sm" data-sign title="Skipta um formerki í reitnum">± formerki</button><button class="btn sm" data-why>Vísbending</button><button class="btn sm ghost" data-show hidden>Sýna svar</button></div>`;
    return `<li class="sv-li act">${num}<div class="sv-body"><div class="sv-t">${s.t} <span class="ref">${s.ref}</span></div>${m}
      <div class="sv-msg ${cfg.demo?'why':''}">${cfg.demo?s.why:(s.drag&&!s.choice?s.hintDrag:'')}</div>
      ${cfg.demo&&!s.choice?`<div class="row"><button class="btn pri sm" data-demo>Næsta skref →</button></div>`:''}</div></li>`;
  }
  function render(){
    if(steps[E.i]&&steps[E.i].dcalc&&E.dcStep!==E.i){E.dcStep=E.i;E.dc=dNew();E.dlines=null}
    list.innerHTML=steps.map((s,k)=>stepHTML(s,k,k<E.i?'done':k===E.i?'act':'todo')).join('');
    const ref=steps[E.i]&&steps[E.i].ref;
    host.querySelectorAll('.fm').forEach(f=>f.classList.toggle('on',f.dataset.ref===ref));
    const dk=E.i>3||(E.i===3&&false)?String(cnt):null;
    host.querySelectorAll('.dtab span').forEach(x=>x.classList.toggle('on',E.i>=4||E.i>=steps.length?x.classList.contains('d'+cnt):false));
    if(E.i>=4||E.i>=steps.length)drawGraph(E.i>=steps.length);

    const first=list.querySelector('.sv-li.act input');if(first&&E.i>0&&!cfg.noFocus)first.focus({preventScroll:true});
    if(E.i>0&&!cfg.noFocus){const li=list.querySelector('.sv-li.act');if(li)li.scrollIntoView({behavior:RM.matches?'auto':'smooth',block:'nearest'})}

  }
  function drawGraph(final){

    const roots=final&&sD?(cnt===2?[x1.val(),x2.val()]:[x1.val()]):[];
    const approx=final&&!sD&&cnt>0?[(-B.val()+Math.sqrt(dv))/(2*A.val()),(-B.val()-Math.sqrt(dv))/(2*A.val())].slice(0,cnt):[];
    const all=[...roots,...approx];
    graph.innerHTML=`<div class="k" style="padding:4px 6px">Á grafinu</div>`+plotSVG({xr:[x0,x1b],yr:[y0,y1],fn:x=>A.val()*x*x+B.val()*x+C.val(),pts:all.map(r=>[r,0]),
      labels:roots.map((r,j)=>[r,0,(j%2?-12:22),'x = '+(cnt===2?(j?nH(x2):nH(x1)):nH(x1)).replace(/<[^>]+>/g,'')]),aria:'Fleygboginn og núllstöðvar hans'})+
      `<p class="mut" style="font-size:.85rem;padding:4px 6px">${cnt===2?'Fleygboginn sker x-ásinn á tveimur stöðum.':cnt===1?'Fleygboginn snertir x-ásinn á einum stað.':'Fleygboginn nær ekki að x-ásnum.'}</p>`;
  }
  function finish(){
    let h;
    if(cfg.countOnly&&cnt>0)h=`<div class="sv-done"><h4>D = ${nH(D)}: ${cnt===2?'tvær lausnir':'ein lausn'}</h4><p>Fleygboginn ${cnt===2?'sker':'snertir'} x-ásinn. Í næsta atriði reiknum við lausnirnar sjálfar.</p></div>`;
    else if(cnt===0)h=`<div class="sv-done none"><h4>Engin lausn</h4><p>D = ${nH(D)} er neikvætt. Ekki er hægt að taka rót af mínustölu, svo jafnan hefur enga lausn. Skrifaðu: <b>engin lausn</b>.</p></div>`;
    else if(!sD)h=`<div class="sv-done"><h4>${cnt} lausnir</h4><p>√${nH(D)} er ekki heil tala. Lausnirnar eru <span class="m">x = (${nH(mB)} ± √${nH(D)}) / ${nH(A2)}</span>, u.þ.b. ${[(-B.val()+Math.sqrt(dv))/(2*A.val()),(-B.val()-Math.sqrt(dv))/(2*A.val())].map(v=>nf(+v.toFixed(2))).join(' og ')}.</p></div>`;
    else{

/* --- slembidæmi með fallegum lausnum --- */
function stdStr(a,b,c){return `${sstr([[a,2],[b,1],[c,0]])}=0`}
function genCoef(kind){
  if(kind==='two'){const a=pick([1,1,1,2,-1]);let r1=R(-7,7),r2;do r2=R(-7,7);while(r2===r1);return[a,-a*(r1+r2),a*r1*r2]}
  if(kind==='one'){const r=NZ(-5,5),a=pick([1,1,2]);return[a,-2*a*r,a*r*r]}
  if(kind==='none'){const a=pick([1,1,2]),b=R(-6,6);return[a,b,Math.floor(b*b/(4*a))+R(1,6)]}
  if(kind==='frac'){const a=pick([2,3]);let p;do p=NZ(-5,5);while(p%a===0);const q=NZ(-5,5);return[a,-(p+a*q),p*q]}
  if(kind==='noB'){const a=pick([1,1,2]),r=R(1,8);return[a,0,-a*r*r]}
  if(kind==='noC'){const a=pick([1,2,3]),r=NZ(-6,6);return[a,-a*r,0]}
  return[NZ(-3,3),R(-9,9),NZ(-9,9)];
}
function genS(kind){
  if(GS5[kind])return GS5[kind]();
  for(let t=0;t<50;t++){
    let k=kind;
    if(kind==='dmix')k=pick(['two','one','none','any']);
    if(kind==='oneNone')k=pick(['one','none']);
    if(kind==='hard')k=pick(['frac','noB','noC','frac']);
    if(kind==='combo')k=pick(['two','two','frac','noB']);
    const [a,b,c]=genCoef(k);
    if(kind!=='combo')return stdStr(a,b,c);
    // dreifa liðum á báðar hliðar og bæta sama lið við báðar
    const L=[],Rr=[];[[a,2],[b,1],[c,0]].forEach(([v,p])=>{if(!v)return;if(Math.random()<0.45)Rr.push([-v,p]);else L.push([v,p])});
    if(Math.random()<0.5){const d=NZ(-5,5),p=pick([1,0]);L.push([d,p]);Rr.push([d,p])}
    if(!L.length||!Rr.length)continue;
    const s=`${sstr(shuffle(L))}=${sstr(shuffle(Rr))}`;
    try{if(deg(ePoly(parseEq(s)))===2)return s}catch(_){}
  }
  return 'x^2-2x-8=0';
}

function probView(body,it,next,intro,mount){
  const list=()=>[...it.probs,...(EXTRA[it.id]||[])];
  let idx=0;const f=list().findIndex((_,j)=>!STORE.pd[it.id+'#'+j]);if(f>=0)idx=f;
  body.innerHTML=`${intro?`<div class="prose" style="margin-bottom:14px"><p>${intro}</p></div>`:''}<div id="pb"></div><div id="box"></div><div class="row" id="nx" style="margin-top:14px"></div>`;
  const pb=body.querySelector('#pb'),box=body.querySelector('#box'),nx=body.querySelector('#nx');
  const addNew=()=>{(EXTRA[it.id]=EXTRA[it.id]||[]).push(genS(it.genS));setP(list().length-1)};
  function bar(){pb.innerHTML=probBar(it,list(),idx);pb.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>setP(+b.dataset.p));const nb=pb.querySelector('[data-new]');if(nb)nb.onclick=addNew}
  function setP(j){
    idx=j;nx.innerHTML='';bar();
    mount(box,list()[idx],()=>{
      probDone(it,idx);bar();
      nx.innerHTML=idx<list().length-1?'<button class="btn pri" id="nxp">Næsta dæmi →</button>':(nextBtn(next)+'<button class="btn" id="more">+ Nýtt dæmi</button>');
      const b=nx.querySelector('#nxp');if(b)b.onclick=()=>{setP(idx+1);pb.scrollIntoView({behavior:RM.matches?'auto':'smooth',block:'start'})};
      const mo=nx.querySelector('#more');if(mo)mo.onclick=addNew;
      wireNext(nx);
    });
  }
  setP(idx);
}

/* ================= Almennur skrefari (hlutar 5 og 6) ================= */
let STN=0;
function Steps(host,o){
  const n=++STN,E={i:0,tries:0,last:null,fired:false};
  const steps=o.steps;
  host.innerHTML=`<div class="solver${o.side?'':' one'}"><div class="sv-paper"><div class="sv-eq">${o.top}</div><ol class="sv-steps"></ol><div class="sv-end"></div></div>${o.side?`<aside class="sv-side">${o.side}</aside>`:''}</div>`;
  const list=host.querySelector('.sv-steps'),end=host.querySelector('.sv-end');
  function li(s,k,state){
    const num=`<span class="sv-n">${k+1}</span>`,ref=s.ref?` <span class="ref">${s.ref}</span>`:'';
    if(state==='todo')return `<li class="sv-li todo">${num}<div class="sv-body"><div class="sv-t">${s.t}</div></div></li>`;
    if(state==='done')return `<li class="sv-li done">${num}<div class="sv-body"><div class="sv-t">${s.t}${ref}</div><div class="sv-math">${s.doneH?s.doneH():s.math(i=>nH(s.exp[i]))}</div></div></li>`;
    let m;
    if(s.mount)m='<div class="cust"></div>';
    else if(s.choice)m=`${s.math?`<div class="sv-math">${s.math()}</div>`:''}<div class="row">${s.choice.map(c=>`<button class="btn" data-ch="${c[0]}">${c[1]}</button>`).join('')}</div>`;
    else m=`<div class="sv-math">${s.math(i=>`<input class="blank" id="st${n}-${k}-${i}" autocomplete="off" spellcheck="false" aria-label="Reitur ${i+1}">`)}</div>
      <div class="row"><button class="btn pri sm" data-chk>Athuga</button><button class="btn sm" data-sign>± formerki</button>${s.why?'<button class="btn sm" data-why>Vísbending</button>':''}<button class="btn sm ghost" data-show hidden>Sýna svar</button></div>`;
    return `<li class="sv-li act">${num}<div class="sv-body"><div class="sv-t">${s.t}${ref}</div>${s.intro?`<p class="mut" style="font-size:.92rem">${s.intro}</p>`:''}${m}<div class="sv-msg"></div></div></li>`;
  }
  function render(){
    list.innerHTML=steps.map((s,k)=>li(s,k,k<E.i?'done':k===E.i?'act':'todo')).join('');
    E.tries=0;
    if(E.i>=steps.length){end.innerHTML=o.end?o.end():'';if(!E.fired){E.fired=true;o.onDone&&o.onDone()}return}
    const s=steps[E.i],act=list.querySelector('.sv-li.act');
    if(s.mount)s.mount(act.querySelector('.cust'),()=>{E.i++;render()},msg);
    const inp=act.querySelector('input');if(inp&&E.i>0)inp.focus({preventScroll:true});
    if(E.i>0)act.scrollIntoView({behavior:RM.matches?'auto':'smooth',block:'nearest'});
  }
  function msg(h,c='no'){const b=list.querySelector('.sv-li.act .sv-msg');if(b){b.className='sv-msg '+c;b.innerHTML=h}}
  const ins=()=>[...list.querySelectorAll('.sv-li.act input.blank')];
  function check(){
    const s=steps[E.i],I=ins(),v=I.map(x=>parseNum(x.value));let ms;
    if(s.unordered){
      const e=s.exp,okAll=(fEq(v[0],e[0])&&fEq(v[1],e[1]))||(fEq(v[0],e[1])&&fEq(v[1],e[0]));
      ms=okAll?['','']:v.map((x,i)=>{const hit=e.some(q=>fEq(x,q))&&!(i===1&&fEq(v[0],x));return hit?'':(s.fb?s.fb(i,x,E.tries,v):'Ekki rétt.')});
    }else ms=v.map((x,i)=>x==null?'Skrifaðu tölu.':x.eq(s.exp[i])?'':(s.fb?s.fb(i,x,E.tries,v):'Ekki rétt.'));
    I.forEach((x,i)=>{x.classList.toggle('ok',!ms[i]);x.classList.toggle('no',!!ms[i])});
    const bad=[...new Set(ms.filter(Boolean))];
    if(!bad.length){E.i++;render();return}
    E.tries++;msg(bad.join('<br>'));if(E.tries>=2)list.querySelector('.sv-li.act [data-show]').hidden=false;
  }
  list.addEventListener('focusin',e=>{if(e.target.classList.contains('blank'))E.last=e.target});
  list.addEventListener('keydown',e=>{if(e.target.classList.contains('blank')&&e.key==='Enter'){e.preventDefault();const I=ins(),k=I.indexOf(e.target);if(k<I.length-1&&!I[k+1].value)I[k+1].focus();else check()}});
  list.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||!b.closest('.sv-li.act'))return;const s=steps[E.i];
    if(b.hasAttribute('data-chk'))check();
    else if(b.hasAttribute('data-why'))msg(s.why,'why');
    else if(b.hasAttribute('data-show')){ins().forEach((x,i)=>x.value=fT(s.exp[i]));check()}
    else if(b.hasAttribute('data-sign')){const x=E.last||ins()[0];if(!x)return;const v=x.value.trim().replace(/[−–]/g,'-');x.value=v.startsWith('-')?v.slice(1):MINUS+v.replace(/^\+/,'');x.focus()}
    else if(b.dataset.ch!==undefined){if(b.dataset.ch===s.exp){E.i++;render()}else{b.disabled=true;b.classList.add('no');msg(s.wrong)}}
  });
  render();
}

/* ================= 5. Styttri leiðir ================= */
const stdCoef=st=>{const p=ePoly(st);let A=p[2]||F0,B=p[1]||F0,C=p[0]||F0;if(A.isNeg()){A=A.neg();B=B.neg();C=C.neg()}return{A,B,C}};
const stdSide=({A,B,C})=>[[A,2],[B,1],[C,0]].filter(x=>!x[0].isZero()).map(x=>M(x[0],x[1]));
const eqStd=c=>eqH({L:stdSide(c),R:[]});
const SHORT_SHEET=`<div class="sheet"><div class="k">Núllreglan</div><p class="m" style="font-size:1.15rem">a · b = 0 &nbsp;→&nbsp; a = 0 eða b = 0</p><p class="mut" style="font-size:.88rem">Margfeldi verður bara 0 ef einn þátturinn er 0.</p>
  <div class="k" style="margin-top:6px">Formúlublaðið</div><div class="fm"><span class="ref">Þ4</span><span class="m"><i>x</i>² + <i>bx</i> + <i>c</i> = (<i>x</i> + <i>r</i>)(<i>x</i> + <i>s</i>)</span></div><p class="mut" style="font-size:.85rem">þar sem r · s = c og r + s = b</p></div>`;

function shortNoC(box,eq,done){
  const st=parseEq(eq),{A,B}=stdCoef(st),r=B.neg().div(A);
  const fst={...st};
  let factored=null;
  Steps(box,{top:eqH(st),side:SHORT_SHEET,onDone:done,steps:[
    {t:'Taktu x út fyrir sviga',intro:'Vantar C: bæði x²-liðurinn og x-liðurinn hafa x. Veldu báða liðina (smelltu á þá) og ýttu á „Taka út fyrir sviga…“. Ef eitthvað er hægra megin: færðu það fyrst yfir.',
      doneH:()=>eqH(factored),
      mount:(el,ok)=>{Engine(el,{eq:cloneS(st),goal:'factor',help:false,startMsg:'Markmið: x · ( … ) = 0. Veldu liðina og taktu x út fyrir sviga.',onSolved:s=>{factored=cloneS(s);setTimeout(ok,RM.matches?100:900)}})}},
    {t:'Núllreglan: hvor þáttur getur verið 0',ref:'',intro:'Annaðhvort er x = 0, eða sviginn er 0.',
      math:b=>`${factored?eqH(factored):''} &nbsp;→&nbsp; <i>x</i> = ${b(0)} &nbsp;eða&nbsp; <i>x</i> = ${b(1)}`,
      doneH:()=>`<i>x</i> = 0 &nbsp;eða&nbsp; <i>x</i> = ${nH(r)}`,
      exp:[F0,r],unordered:true,why:`Fyrri þátturinn: x = 0. Seinni: leystu sviginn = 0, þ.e. ${nH(A)}x ${B.isNeg()?'−':'+'} ${nH(B.abs())} = 0.`,
      fb:(i,v,t,vals)=>{if(v==null)return'Skrifaðu tölu.';if(!vals.some(x=>x&&x.isZero()))return'Ekki gleyma <b>x = 0</b>! Það er lausn. Þess vegna má ekki deila með x.';if(v.eq(r.neg()))return'Formerkið snýst þegar talan fer yfir =.';if(v.eq(B.neg()))return`Deildu líka með ${nH(A)}.`;return`Leystu sviginn = 0.`}}
  ],end:()=>`<div class="sv-done"><h4><span class="m">x = 0</span> eða <span class="m">x = ${nH(r)}</span></h4><p>Engin lausnarformúla, ekkert D. <b>Gildra:</b> ef þú deilir báðum megin með x týnist lausnin x = 0.</p></div>`});
}
function shortNoB(box,eq,done){
  const st=parseEq(eq),{A,C}=stdCoef(st),k=C.neg().div(A),sk=fsqrt(k);
  const steps=[
    {t:'Fáðu x² eitt sér',intro:'Færðu töluna yfir = (formerkið snýst) og deildu með A.',
      math:b=>`${eqStd({A,B:F0,C})} &nbsp;→&nbsp; <i>x</i><sup>2</sup> = ${b(0)}`,exp:[k],
      why:`${nH(A)}x² = ${nH(C.neg())}, svo x² = ${nH(C.neg())} : ${nH(A)}.`,
      fb:(i,v)=>v==null?'Skrifaðu tölu.':v.eq(k.neg())?'Formerkið snýst þegar talan fer yfir =.':v.eq(C.neg())&&!A.isOne()?`Deildu líka með A = ${nH(A)}.`:'Ekki rétt.'}];
  if(k.isNeg())steps.push({t:'Hvaða tala í öðru veldi gefur '+nH(k)+'?',math:()=>`<i>x</i><sup>2</sup> = ${nH(k)}`,choice:[['n','Engin lausn'],['y','x = ±√'+fT(k.abs())]],exp:'n',
    wrong:'Engin tala í öðru veldi verður neikvæð: 3² = 9 og (−3)² = 9. Svo er engin lausn.',doneH:()=>`<i>x</i><sup>2</sup> = ${nH(k)} &lt; 0 → engin lausn`});
  else steps.push({t:'Taktu rótina, með ±',intro:'Tvær tölur í öðru veldi gefa sömu útkomu: ein jákvæð og ein neikvæð.',
    math:b=>`<i>x</i> = ±${sqrtX(nH(k))} &nbsp;→&nbsp; <i>x</i> = ${b(0)} &nbsp;eða&nbsp; <i>x</i> = ${b(1)}`,exp:[sk,sk.neg()],unordered:true,
    doneH:()=>`<i>x</i> = ±${sqrtX(nH(k))} = ±${nH(sk)}`,
    why:`${nH(sk)} · ${nH(sk)} = ${nH(k)} og (${nH(sk.neg())}) · (${nH(sk.neg())}) = ${nH(k)}.`,
    fb:(i,v,t,vals)=>v==null?'Skrifaðu tölu.':(vals[0]&&vals[1]&&vals[0].eq(vals[1]))?'Mundu ±: bæði plús og mínus.':v.eq(k)?'Taktu rótina: hvaða tala sinnum sjálf sig gefur '+nH(k)+'?':'Ekki rétt.'});
  Steps(box,{top:eqH(st),side:SHORT_SHEET,onDone:done,steps,end:()=>k.isNeg()?`<div class="sv-done none"><h4>Engin lausn</h4><p>x² getur ekki verið neikvætt.</p></div>`:`<div class="sv-done"><h4><span class="m">x = ±${nH(sk)}</span></h4><p>Ekkert D þurfti. Mundu alltaf <b>±</b>.</p></div>`});
}
function shortGuess(box,eq,done){
  const st=parseEq(eq),{B,C}=stdCoef(st);
  const b=B.n,c=C.n;
  const pairs=[];for(let r=-Math.abs(c);r<=Math.abs(c);r++){if(r===0||c%r)continue;const s=c/r;if(r<=s)pairs.push([r,s])}
  const [r0,s0]=pairs.find(([r,s])=>r+s===b);
  const pr=(x,y)=>`(<i>x</i> ${x<0?'−':'+'} ${Math.abs(x)})(<i>x</i> ${y<0?'−':'+'} ${Math.abs(y)})`;
  Steps(box,{top:eqH(st),side:SHORT_SHEET,onDone:done,steps:[
    {t:`Finndu tvær tölur: margfeldi ${nH(C)}, summa ${nH(B)}`,ref:'Þ4',intro:`Smelltu á pör sem gefa ${nH(C)} þegar þau eru margfölduð. Þá sést summan. Þú leitar að summunni ${nH(B)}.${c<0?' C er mínus, svo önnur talan er mínus.':''}`,
      doneH:()=>`${nH(new F(r0))} · ${s0<0?'('+nH(new F(s0))+')':nH(new F(s0))} = ${nH(C)} &nbsp; og &nbsp; ${nH(new F(r0))} + ${s0<0?'('+nH(new F(s0))+')':nH(new F(s0))} = ${nH(B)}`,
      mount:(el,ok,msg)=>{
        el.innerHTML=`<div class="pairs">${pairs.map(([r,s],j)=>`<button class="btn pair" data-j="${j}"><span class="m">${nH(new F(r))} · ${s<0?'('+nH(new F(s))+')':nH(new F(s))}</span><span class="ps">summa ?</span></button>`).join('')}</div>`;
        el.addEventListener('click',e=>{const bt=e.target.closest('.pair');if(!bt)return;const[r,s]=pairs[+bt.dataset.j];bt.querySelector('.ps').innerHTML=`summa ${nH(new F(r+s))}`;
          if(r+s===b){bt.classList.add('pri');msg(`${nH(new F(r))} + ${s<0?'('+nH(new F(s))+')':nH(new F(s))} = ${nH(B)}. Fundið!`,'ok');setTimeout(ok,RM.matches?100:900)}else{bt.classList.add('miss');msg(`${nH(new F(r))} + ${s<0?'('+nH(new F(s))+')':nH(new F(s))} = ${nH(new F(r+s))}, ekki ${nH(B)}. Prófaðu annað par.`,'why')}})}},
    {t:'Skrifaðu jöfnuna sem tvo þætti',intro:'Tölurnar fara beint inn í svigana, með formerkjunum.',
      math:bb=>`(<i>x</i> + ${bb(0)})(<i>x</i> + ${bb(1)}) = 0`,doneH:()=>`${pr(r0,s0)} = 0`,exp:[new F(r0),new F(s0)],unordered:true,
      fb:(i,v)=>v==null?'Skrifaðu tölu.':(v.eq(-r0)||v.eq(-s0))?'Settu tölurnar inn eins og þær eru. Formerkið snýst ekki fyrr en í næsta skrefi.':'Notaðu tölurnar sem þú fannst.'},
    {t:'Núllreglan',intro:'Hvor svigi getur verið 0. Leystu hvorn fyrir sig.',
      math:bb=>`${pr(r0,s0)} = 0 &nbsp;→&nbsp; <i>x</i> = ${bb(0)} &nbsp;eða&nbsp; <i>x</i> = ${bb(1)}`,doneH:()=>`<i>x</i> = ${nH(new F(-r0))} &nbsp;eða&nbsp; <i>x</i> = ${nH(new F(-s0))}`,
      exp:[new F(-r0),new F(-s0)],unordered:true,why:`x ${r0<0?'−':'+'} ${Math.abs(r0)} = 0 gefur x = ${nH(new F(-r0))}.`,
      fb:(i,v)=>v==null?'Skrifaðu tölu.':(v.eq(r0)||v.eq(s0))?`Formerkið snýst! x ${r0<0?'−':'+'} ${Math.abs(r0)} = 0 → x = ${nH(new F(-r0))}.`:'Ekki rétt.'}
  ],end:()=>`<div class="sv-done"><h4><span class="m">x = ${nH(new F(-r0))}</span> eða <span class="m">x = ${nH(new F(-s0))}</span></h4><p>Prófaðu: lausnirnar eru tölurnar úr sviganum <b>með öfugu formerki</b>.</p></div>`});
}
const GS5={
  sNoC:()=>{const a=pick([1,1,2,3,-1]),r=NZ(-8,8);return pick([stdStr(a,-a*r,0),`${sstr([[a,2]])}=${sstr([[a*r,1]])}`])},

const WHICHQ=[['x^2 - 8x = 0','noC','Vantar C. x(x − 8) = 0 → x = 0 eða x = 8.'],['x^2 - 36 = 0','noB','Vantar B. x² = 36 → x = ±6.'],['x^2 + 5x + 6 = 0','guess','2 · 3 = 6 og 2 + 3 = 5 → (x + 2)(x + 3) = 0.'],['2x^2 + 3x - 5 = 0','formula','A = 2 og allir liðir eru með. Lausnarformúlan.'],
