<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#183e43">
<title>NASA · Skólanámskrá</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="masthead">
  <div class="brand"><b>NASA</b><span>Náttúrufræði- og samfélagsgreinar<br>Hönnun skólanámskrár · 8.–10. bekkur</span></div>
  <div class="toolbar head-tools">
    <button id="openFile" title="Opna námskrá úr JSON-skrá">Opna skrá</button>
    <button id="saveFile" title="Sækja námskrána sem JSON-skrá">Sækja JSON</button>
    <button id="pdfTop" class="primary" title="Sækja námskrána sem PDF">Sækja PDF</button>
  </div>
</header>
<nav class="stepper" id="stepper" aria-label="Skref"></nav>
<main id="view" tabindex="-1"></main>
<footer class="foot"><span id="saveState" role="status" aria-live="polite"></span><span>Norðlingaskóli · NASA</span></footer>
<input type="file" id="fileInput" class="file" accept=".json,application/json" multiple>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="js/markdown.js"></script>
<script src="js/curriculum.js"></script>
<script src="js/defaults.js"></script>
<script src="js/app.js"></script>
<script src="js/pdf.js"></script>
</body>
</html>
