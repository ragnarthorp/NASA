<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rafmagnsfræði 1 upprifjun</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Útlit: rannsóknarstofuborð. Ljós grunnur með koparlit sem áherslu og grænan rafrásaplötulit sem aukalit.
   Haus með námskeiðskóða, flipar efst, efni í einum dálki (max 980px). */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --sunk:#e8eceb; --ink:#1b252d; --muted:#56646d; --line:#d3dbdc;
  --copper:#a9521f; --copper-soft:#f5e4d8; --board:#1d5b48; --board-soft:#deede7;
  --ok:#277246; --okbg:#e3f2e8; --bad:#ad3527; --badbg:#f8e3df; --wire:#34424b;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171b; --surface:#192127; --sunk:#0d1215; --ink:#e3e9ea; --muted:#9aa8ae; --line:#2b373e;
  --copper:#e48d58; --copper-soft:#3a2418; --board:#63c29e; --board-soft:#15302a;
  --ok:#6fcf93; --okbg:#173325; --bad:#f08a7a; --badbg:#3a1d19; --wire:#b9c6cb; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171b; --surface:#192127; --sunk:#0d1215; --ink:#e3e9ea; --muted:#9aa8ae; --line:#2b373e;
  --copper:#e48d58; --copper-soft:#3a2418; --board:#63c29e; --board-soft:#15302a;
  --ok:#6fcf93; --okbg:#173325; --bad:#f08a7a; --badbg:#3a1d19; --wire:#b9c6cb; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--copper);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,5vw,42px)}
h2{font-size:28px}
h3{font-size:21px}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font:600 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Haus og flipar */
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font:700 22px/1 var(--f-display);letter-spacing:.01em}
.brand span{font:600 11px/1 var(--f-mono);color:var(--copper);letter-spacing:.06em}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-left:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;padding:7px 12px;border-radius:8px}
nav.tabs a:hover{color:var(--ink);background:var(--sunk)}
nav.tabs a[aria-current="page"]{color:var(--ink);background:var(--copper-soft);box-shadow:inset 0 -2px 0 var(--copper)}
main{padding-block:28px 60px}
section.view{display:grid;gap:28px}

/* Almennar einingar */
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:15px}
.btn:hover{border-color:var(--copper)}
.btn.primary{background:var(--copper);border-color:var(--copper);color:var(--surface)}
.btn.small{padding:4px 10px;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.lead{font-size:19px;color:var(--muted);max-width:62ch}
.prose{display:grid;gap:12px;max-width:70ch}
.prose ul,.prose ol{margin:0;padding-left:22px;display:grid;gap:4px}
.key{border-left:3px solid var(--copper);padding:4px 0 4px 14px;display:grid;gap:6px}
.formula{font:600 22px/1.3 var(--f-mono);color:var(--board);background:var(--board-soft);border-radius:8px;padding:10px 14px;display:inline-block}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px/1.2 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
td.mono{white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.note{font-size:14px;color:var(--muted)}
.tag{display:inline-block;font:600 11px/1 var(--f-mono);letter-spacing:.05em;padding:4px 7px;border-radius:5px;background:var(--sunk);color:var(--muted)}
.tag.ok{background:var(--okbg);color:var(--ok)}
sup{font-size:.7em}

/* Yfirlit */
.hero{display:grid;gap:14px}
.route{display:grid;gap:10px;counter-reset:s}
.route a{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.route a:hover{border-color:var(--copper)}
.route .num{font:600 15px/1 var(--f-mono);color:var(--copper)}
.route .t{font-weight:700;font-size:17px}
.route .d{font-size:14px;color:var(--muted)}
.meter{display:block;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px;max-width:220px}
.meter i{display:block;height:100%;background:var(--board)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.steps div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:4px;font-size:15px}
.steps b{font-family:var(--f-display);font-size:19px}

/* Kaflar */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips a{text-decoration:none;color:var(--muted);font-size:14px;font-weight:600;border:1px solid var(--line);border-radius:20px;padding:4px 12px;background:var(--surface)}
.chips a[aria-current="page"]{color:var(--surface);background:var(--ink);border-color:var(--ink)}
.chips a.done::after{content:" ✓";color:var(--ok)}
.chips a[aria-current="page"].done::after{color:var(--surface)}
.ch-head{display:grid;gap:8px}
.example{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px}
.example ol{margin:0;padding-left:22px;display:grid;gap:8px}
.example li{font-size:16px}
.example li .mono{background:var(--sunk);padding:1px 6px;border-radius:4px}
.ch-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:18px}

/* Spurningar */
.qlist{display:grid;gap:12px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px;min-width:0}
.q.right{border-color:var(--ok)}
.q.wrong{border-color:var(--bad)}
.q .qt{font-weight:600}
.q .qn{font:600 12px/1 var(--f-mono);color:var(--copper);margin-right:6px}
.opts{display:grid;gap:6px}
.opt{text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;font-size:16px}
.opt:hover:not(:disabled){border-color:var(--copper)}
.opt:disabled{cursor:default}
.opt.is-right{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.is-wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.numrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.numrow input{width:200px;max-width:100%}
input[type=text],select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
input[type=text]:focus{border-color:var(--copper);outline:none}
.fb{font-size:15px;border-radius:8px;padding:10px 12px;background:var(--sunk)}
.fb.ok{background:var(--okbg)}
.fb.bad{background:var(--badbg)}
.fb b{display:block;margin-bottom:2px}
.selfgrade{display:flex;gap:8px;flex-wrap:wrap}
.symbol{color:var(--ink);background:var(--bg);border-radius:8px;padding:6px;width:120px}
.symbol svg{display:block;width:100%;height:auto}

/* Reiknivélar */
.calc{display:grid;gap:14px}
.calc h3{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.field{display:grid;gap:4px}
.field label{font:600 13px/1.2 var(--f-mono);color:var(--muted)}
.field input{width:100%}
.field small{font:12px/1.3 var(--f-mono);color:var(--muted);min-height:1.3em}
.field.out input{border-color:var(--board);background:var(--board-soft);color:var(--board);font-weight:600}
.out-box{background:var(--sunk);border-radius:8px;padding:12px 14px;font-size:15px;display:grid;gap:4px}
.big{font:600 26px/1.2 var(--f-mono);color:var(--board)}
.swatches{display:flex;flex-wrap:wrap;gap:4px}
.sw{width:30px;height:30px;border-radius:6px;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.band-row{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center}
.band-row .label{line-height:1.3}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.circuit{width:100%;max-width:420px;color:var(--wire)}

/* Glósublað */
.sheet{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.sheet .panel{padding:16px;display:grid;gap:8px;align-content:start}
.sheet h3{font-size:19px;color:var(--copper)}
.sheet table{font-size:14px}
.sheet th,.sheet td{padding:4px 6px}
.symgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.symgrid figure{margin:0;display:grid;gap:2px;justify-items:center;text-align:center;font-size:12px}
.symgrid svg{width:76px;height:38px;color:var(--ink)}
.cc{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;border:1px solid var(--line);margin-right:6px}

/* Próf */
.scorebar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.scorebar .big{font-size:22px}

@media (max-width:560px){
  body{font-size:16px}
  .route a{grid-template-columns:44px 1fr}
  .route a .tag{grid-column:2}
  .band-row{grid-template-columns:1fr}
  .scorebar{top:calc(env(safe-area-inset-top,0px) + 96px)}
}
@media (prefers-reduced-motion:no-preference){.q,.opt,.btn{transition:border-color .15s,background-color .15s}}
@media print{
  header.top,.no-print,.chips,.ch-foot{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  main{padding:0}
  .panel{break-inside:avoid;border-color:#bbb}
  .sheet{grid-template-columns:1fr 1fr;gap:8px}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><b>Rafmagnsfræði 1</b><span>RAFM1GA05AR</span></div>
    <nav class="tabs" aria-label="Hlutar vefsins">
      <a href="#yfirlit">Yfirlit</a>
      <a href="#kafli-frumeind" data-tab="kafli">Kaflar</a>
      <a href="#reiknivelar">Reiknivélar</a>
      <a href="#glosur">Glósublað</a>
      <a href="#profa">Æfingapróf</a>
    </nav>
  </div>
</header>
<main class="wrap" id="main" tabindex="-1"></main>

<script>
"use strict";
/* ============ Hjálparföll ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STORE = "rafm1-upprifjun";
let state = { done: {}, stats: {}, best: null };
try { const s = JSON.parse(localStorage.getItem(STORE)); if (s) state = Object.assign(state, s); } catch (e) {}
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];

/* Forskeyti */
const PREFIX = [
  { p: "T", n: "tera", e: 12 }, { p: "G", n: "gíga", e: 9 }, { p: "M", n: "mega", e: 6 }, { p: "k", n: "kíló", e: 3 },
  { p: "", n: "(grunneining)", e: 0 }, { p: "m", n: "milli", e: -3 }, { p: "µ", n: "míkró", e: -6 }, { p: "n", n: "nanó", e: -9 }, { p: "p", n: "píkó", e: -12 }
];
const PMAP = { T: 12, G: 9, M: 6, k: 3, K: 3, m: -3, u: -6, "µ": -6, "μ": -6, n: -9, p: -12 };

/* Talnalestur: tekur við "0,23", "1.200", "10 mA", "1,2k", "5x10^-6", "5·10-6 A", "3,3e3" */
function toF(s) {
  s = s.replace(/\s/g, "");
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  return parseFloat(s);
}
function parseQty(str) {
  if (str == null) return NaN;
  let s = String(str).trim().replace(/[−–]/g, "-").replace(/[×·•*]/g, "x").replace(/⁻/g, "-")
    .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, c => "⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(c));
  if (!s) return NaN;
  let num, rest, m = s.match(/^([-+]?[\d.,\s]*\d)\s*x\s*10\s*\^?\s*([-+]?\d+)\s*(.*)$/i);
  if (m) { num = toF(m[1]) * Math.pow(10, parseInt(m[2], 10)); rest = m[3]; }
  else {
    m = s.match(/^([-+]?[\d.,]*\d(?:e[-+]?\d+)?)\s*(.*)$/i) || s.match(/^([-+]?\d[\d.,\s]*\d)\s*(.*)$/);
    if (!m) return NaN;
    num = /e/i.test(m[1]) ? parseFloat(m[1].replace(",", ".")) : toF(m[1]); rest = m[2];
  }
  rest = rest.trim().replace(/ohm|Ω|ω|V|A|W|Hz|s$/gi, "").trim();
  if (rest) { if (rest.length === 1 && rest in PMAP) num *= Math.pow(10, PMAP[rest]); else return NaN; }
  return num;
}
/* Íslensk talnaritun: komma sem tugabrot */
function fnum(x, sig = 4) {
  if (!isFinite(x)) return "–";
  const v = Number(x.toPrecision(sig));
  if (Math.abs(v) >= 1e4 && Math.abs(v) < 1e15) return v.toLocaleString("de-DE", { maximumFractionDigits: 6 });
  const s = String(v);
  if (/e/.test(s)) return sci(v);
  return s.replace(".", ",");
}
function fbase(x) { /* venjulegt tugabrot án þúsundapunkta fyrir lítil gildi */
  if (!isFinite(x)) return "–";
  if (x !== 0 && Math.abs(x) < 1e-4) return sci(x);
  return fnum(x, 6);
}
function eng(x, unit, sig = 4) {
  if (!isFinite(x)) return "–";
  if (x === 0) return "0 " + unit;
  const e3 = Math.max(-12, Math.min(12, Math.floor(Math.log10(Math.abs(x)) / 3) * 3));
  const pr = PREFIX.find(p => p.e === e3);
  return fnum(x / Math.pow(10, e3), sig) + " " + pr.p + unit;
}
function sup(n) { return "<sup>" + String(n).replace("-", "−") + "</sup>"; }
function sci(x) {
  if (x === 0) return "0";
  const e = Math.floor(Math.log10(Math.abs(x)));
  return String(Number((x / Math.pow(10, e)).toPrecision(4))).replace(".", ",") + "·10" + sup(e);
}
function engPow(x) {
  if (x === 0) return "0";
  const e = Math.floor(Math.log10(Math.abs(x)) / 3) * 3;
  return String(Number((x / Math.pow(10, e)).toPrecision(5))).replace(".", ",") + "·10" + sup(e);
}
const plain = x => String(Number(x.toPrecision(5))).replace(".", ",");
const near = (a, b) => isFinite(a) && Math.abs(a - b) <= Math.max(Math.abs(b) * 0.011, 1e-15);

/* ============ Teiknitákn (SVG) ============ */
const S = (inner, vb = "0 0 80 40") => `<svg viewBox="${vb}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const SYM = {
  vidnam: { n: "Viðnám (mótstaða)", s: S('<path d="M4 20h18M58 20h18"/><rect x="22" y="12" width="36" height="16" rx="1"/>') },
  breytivid: { n: "Breytilegt viðnám", s: S('<path d="M4 20h18M58 20h18"/><rect x="22" y="12" width="36" height="16" rx="1"/><path d="M26 34L56 6"/><path d="M50 6h6v6"/>') },
  thettir: { n: "Þéttir", s: S('<path d="M4 20h31M45 20h31M35 6v28M45 6v28"/>') },
  elthettir: { n: "Rafgreiningarþéttir (pólaður)", s: S('<path d="M4 20h31M45 20h31M35 6v28"/><rect x="43" y="6" width="4" height="28" fill="currentColor"/><path d="M26 8h6M29 5v6"/>') },
  spola: { n: "Spóla", s: S('<path d="M4 22h12M64 22h12"/><path d="M16 22a6 6 0 0 1 12 0a6 6 0 0 1 12 0a6 6 0 0 1 12 0a6 6 0 0 1 12 0"/>') },
  spennir: { n: "Spennir", s: S('<path d="M10 4v8a5 5 0 0 1 0 10a5 5 0 0 1 0 10v4M70 4v8a5 5 0 0 0 0 10a5 5 0 0 0 0 10v4M36 4v32M44 4v32"/>') },
  dioda: { n: "Díóða", s: S('<path d="M4 20h26M50 20h26"/><path d="M30 8v24l20-12z" fill="currentColor"/><path d="M50 8v24"/>') },
  led: { n: "Ljóstvistur (LED)", s: S('<path d="M4 24h22M46 24h30"/><path d="M26 12v24l20-12z" fill="currentColor"/><path d="M46 12v24M50 10l8-8M56 2h2v2M58 14l8-8M64 6h2v2"/>') },
  smari: { n: "Smári (NPN)", s: S('<circle cx="44" cy="20" r="17"/><path d="M4 20h30M34 10v20M34 15l14-10v-3M34 25l14 10v3"/><path d="M41 33l7 2-3-6" fill="currentColor"/>') },
  rafhlada: { n: "Rafhlaða / jafnspennugjafi", s: S('<path d="M4 20h30M46 20h30M34 6v28"/><path d="M46 13v14" stroke-width="5"/><path d="M22 6h6M25 3v6"/>') },
  ridgjafi: { n: "Riðspennugjafi", s: S('<path d="M4 20h20M56 20h20"/><circle cx="40" cy="20" r="16"/><path d="M30 20c3-9 7-9 10 0s7 9 10 0"/>') },
  pera: { n: "Ljósapera", s: S('<path d="M4 20h20M56 20h20"/><circle cx="40" cy="20" r="16"/><path d="M29 9l22 22M51 9L29 31"/>') },
  rofi: { n: "Rofi (opinn)", s: S('<path d="M4 26h20M56 26h20"/><circle cx="24" cy="26" r="2" fill="currentColor"/><circle cx="56" cy="26" r="2" fill="currentColor"/><path d="M24 26L54 12"/>') },
  oryggi: { n: "Öryggi (vartappi)", s: S('<path d="M4 20h76"/><rect x="22" y="12" width="36" height="16" rx="1"/>') },

  { k: "rauður", hex: "#cc2a1e", d: 2, m: 2, t: 2 }, { k: "appelsínugulur", hex: "#ee7a1a", d: 3, m: 3 },

  { k: "gull", hex: "#c59a2c", m: -1, t: 5 }, { k: "silfur", hex: "#c0c4c8", m: -2, t: 10 }
];
const C = k => COLORS.find(c => c.k === k);
function resistorSVG(bands) {
  const xs = bands.length === 5 ? [62, 82, 102, 122, 156] : [66, 90, 114, 156];
  const b = bands.map((k, i) => `<rect x="${xs[i]}" y="18" width="11" height="44" fill="${C(k).hex}" stroke="#0003" stroke-width="1"/>`).join("");
  return `<svg viewBox="0 0 240 80" role="img" aria-label="Viðnám með röndunum ${bands.join(", ")}" style="width:100%;max-width:300px">
    <path d="M4 40h46M190 40h46" stroke="#9aa3a8" stroke-width="5" stroke-linecap="round"/>
    <path d="M50 22c0-8 22-8 26-4h88c4-4 26-4 26 4v36c0 8-22 8-26 4H76c-4 4-26 4-26-4z" fill="#d9c59b" stroke="#a8916a" stroke-width="1.5"/>${b}</svg>`;
}
function readBands(bands) {
  const n = bands.length, digits = bands.slice(0, n - 2).map(k => C(k).d);
  const mult = C(bands[n - 2]).m, tol = C(bands[n - 1]).t;
  if (digits.some(d => d == null) || mult == null) return null;
  const val = parseInt(digits.join(""), 10) * Math.pow(10, mult);
  return { val, tol, digits, mult };
}
function bandsFor(val, five) {
  if (!(val > 0)) return null;
  const nd = five ? 3 : 2;
  let e = Math.floor(Math.log10(val)) - (nd - 1);
  let sig = Math.round(val / Math.pow(10, e));
  if (sig >= Math.pow(10, nd)) { sig /= 10; e++; }
  if (e < -2 || e > 9) return null;
  const ds = String(sig).padStart(nd, "0").split("").map(Number);
  const mult = COLORS.find(c => c.m === e);
  return { bands: ds.map(d => COLORS.find(c => c.d === d).k).concat(mult.k), exact: sig * Math.pow(10, e) };
}

function circuitSVG(mode) {
  const dot = (x, y) => `<circle cx="${x}" cy="${y}" r="3.5" fill="currentColor"/>`;
  const meter = (x, y, t, col) => `<circle cx="${x}" cy="${y}" r="16" style="fill:var(--surface);stroke:${col}" stroke-width="2.6"/><text x="${x}" y="${y + 7}" font-size="19" text-anchor="middle" style="fill:${col}" stroke="none" font-family="sans-serif" font-weight="700">${t}</text>`;
  const col = "var(--copper)";
  let left = mode === "ohm"
    ? `<path d="M40 40v40M40 120v40" stroke-dasharray="5 5"/><text x="50" y="104" font-size="12" style="fill:var(--muted)" stroke="none" font-family="sans-serif">spenna aftengd</text>`
    : `<path d="M40 40v54M40 106v54M26 94h28"/><path d="M33 106h14" stroke-width="5"/><text x="58" y="92" font-size="13" fill="currentColor" stroke="none" font-family="sans-serif">+</text>`;
  let top = mode === "amp" ? `<path d="M40 40h94M166 40h94"/>${meter(150, 40, "A", col)}` : `<path d="M40 40h220"/>`;
  let side = mode === "volt" || mode === "ohm"
    ? `<path d="M260 60h60v24M320 116v24h-60" style="stroke:${col}"/>${dot(260, 60)}${dot(260, 140)}${meter(320, 100, mode === "volt" ? "V" : "Ω", col)}` : "";
  return `<svg class="circuit" viewBox="0 0 360 190" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" role="img" aria-label="Rafrás með rafhlöðu og peru">
    ${left}${top}<path d="M40 160h220M260 40v46M260 114v46"/>
    <circle cx="260" cy="100" r="14"/><path d="M250 90l20 20M270 90l-20 20"/>${side}</svg>`;
}

}
const PICK_GROUPS = [/smár/i, /spennir/i, /þéttir/i, /viðnám/i, /mótor/i, /spennugjafi/i];
const sameGroup = (a, b) => a === b || PICK_GROUPS.some(r => r.test(a) && r.test(b));
const PICK_POOL = [...new Set(BANK.filter(q => q.type === "pick").map(q => q.a).concat(Object.values(SYM).map(s => s.n)))];

/* ============ Spurningaspjöld ============ */
let qSeq = 0;
function renderQ(q, num, onScore) {
  const el = document.createElement("div");
  el.className = "q";
  const uid = "q" + (++qSeq);
  let html = `<p class="qt"><span class="qn">${num}</span>${q.q}</p>`;
  if (q.sym) html += `<div class="symbol">${SYM[q.sym].s}</div>`;
  if (q.bands) html += resistorSVG(q.bands);
  let opts = null;
  if (q.type === "mc") opts = q.o.map((t, i) => ({ t, ok: i === q.a }));
  if (q.type === "pick") {
    const wrong = shuffle(PICK_POOL.filter(n => !sameGroup(n, q.a))).slice(0, 3);
    opts = shuffle([q.a, ...wrong]).map(t => ({ t: esc(t), ok: t === q.a }));
  }
  if (opts) html += `<div class="opts">${opts.map((o, i) => `<button type="button" class="opt" data-i="${i}">${o.t}</button>`).join("")}</div>`;
  if (q.type === "num") html += `<div class="numrow"><input type="text" id="${uid}" inputmode="text" autocomplete="off" aria-label="Svar" placeholder="Svar${q.unit ? " í " + q.unit : ""}"><span class="mono">${q.unit || ""}</span><button type="button" class="btn small" data-check>Athuga</button><button type="button" class="btn small" data-show>Sýna lausn</button></div>`;
  if (q.type === "open") html += `<div class="selfgrade"><button type="button" class="btn small" data-reveal>Sýna svar</button></div>`;
  html += `<div class="fb" hidden></div>`;
  el.innerHTML = html;
  const fb = $(".fb", el);
  let scored = false;
  const finish = (ok, msg) => {
    fb.hidden = false;
    fb.className = "fb " + (ok ? "ok" : "bad");
    fb.innerHTML = msg;
    el.classList.toggle("right", ok); el.classList.toggle("wrong", !ok);
    state.stats[q.id] = ok; save();
    if (!scored) { scored = true; onScore && onScore(ok); }
  };
  if (opts) el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    const o = opts[+b.dataset.i];
    el.querySelectorAll(".opt").forEach((x, i) => { x.disabled = true; if (opts[i].ok) x.classList.add("is-right"); });
    if (!o.ok) b.classList.add("is-wrong");
    finish(o.ok, `<b>${o.ok ? "Rétt!" : "Ekki alveg."}</b>${q.exp || (o.ok ? "" : "Rétta svarið er merkt með grænu.")}`);
  }));
  if (q.type === "num") {
    const inp = $("input", el);
    const check = () => {
      const v = parseQty(inp.value);
      if (!isFinite(v)) { fb.hidden = false; fb.className = "fb"; fb.innerHTML = "Ég skil ekki þetta svar. Skrifaðu tölu, t.d. <span class=\"mono\">0,55</span>, <span class=\"mono\">4,7k</span> eða <span class=\"mono\">12x10^-6</span>."; return; }
      const ok = near(v, q.a);
      finish(ok, `<b>${ok ? "Rétt!" : "Ekki rétt. Þú svaraðir " + esc(q.unit ? eng(v, q.unit) : fbase(v)) + "."}</b>Svar: <span class="mono">${q.unit ? eng(q.a, q.unit) : fbase(q.a)}</span>. ${q.exp || ""}`);
    };
    $("[data-check]", el).addEventListener("click", check);
    inp.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
    $("[data-show]", el).addEventListener("click", () => finish(false, `<b>Lausn</b><span class="mono">${q.unit ? eng(q.a, q.unit) : fbase(q.a)}</span>. ${q.exp || ""}`));
  }
  if (q.type === "open") {
    const sg = $(".selfgrade", el);
    $("[data-reveal]", el).addEventListener("click", () => {
      fb.hidden = false; fb.className = "fb"; fb.innerHTML = `<b>Svar</b>${q.a}`;
      sg.innerHTML = `<span class="note" style="align-self:center">Kunnirðu þetta?</span><button type="button" class="btn small" data-g="1">Já, ég kunni þetta</button><button type="button" class="btn small" data-g="0">Nei, þarf að æfa</button>`;
      sg.querySelectorAll("[data-g]").forEach(b => b.addEventListener("click", () => {
        sg.querySelectorAll("button").forEach(x => x.disabled = true);
        finish(b.dataset.g === "1", `<b>Svar</b>${q.a}`);
      }));
    });
  }
  return el;
}

      <div class="out-box" id="colOut"></div>
      <h3 style="font-size:18px">Öfugt: frá gildi í liti</h3>
      <div class="fields"><div class="field"><label for="revIn">Gildi (Ω)</label><input type="text" id="revIn" autocomplete="off" value="220"><small></small></div></div>
      <div class="out-box" id="revOut"></div>
    </div>

    <div class="panel calc" id="c-mm">
      <h3>Stilling fjölsviðsmælis</h3>
      <div class="fields">
        <div class="field"><label for="mmType">Hvað viltu mæla?</label><select id="mmType">
          <option value="dcv">Jafnspennu (DC V)</option><option value="acv">Riðspennu (AC V)</option><option value="dca">Jafnstraum (DC A)</option><option value="ohm">Viðnám (Ω)</option></select><small></small></div>
        <div class="field"><label for="mmVal">Gildi sem þú átt von á</label><input type="text" id="mmVal" autocomplete="off" value="12"><small></small></div>
      </div>
      <div class="out-box" id="mmOut"></div>
      <p class="note">Sviðin miðast við algengan fjölsviðsmæli (t.d. DT-830). Þinn mælir getur haft önnur svið, en reglan er sú sama.</p>
    </div>`;

  /* Ohm */
  const F = ["U", "I", "R", "P"], unit = { U: "V", I: "A", R: "Ω", P: "W" };
  const inp = k => $("#o" + k, s);
  let computed = new Set();
  function ohm() {
    const v = {}, given = [];
    F.forEach(k => {
      const f = inp(k), small = f.nextElementSibling;
      if (computed.has(k)) return;
      const x = parseQty(f.value);
      if (f.value.trim() && isFinite(x)) { v[k] = x; given.push(k); small.textContent = "= " + fbase(x) + " " + unit[k]; }
      else small.textContent = f.value.trim() ? "Ólæsilegt gildi" : "";
    });
    const out = $("#ohmOut", s);
    F.forEach(k => { if (computed.has(k)) { inp(k).value = ""; inp(k).parentElement.classList.remove("out"); inp(k).nextElementSibling.textContent = ""; } });
    computed = new Set();
    if (given.length !== 2) { out.innerHTML = given.length < 2 ? "Fylltu inn tvær stærðir." : "Of margar stærðir. Hreinsaðu þannig að aðeins tvær séu eftir."; return; }
    const { U, I, R, P } = v, g = given.join(""), st = [];
    let r = {};
    const f = (k, x) => fbase(x) + " " + unit[k];
    if (g === "UI") { r.R = U / I; r.P = U * I; st.push(`R = U / I = ${f("U", U)} / ${f("I", I)}`, `P = U · I = ${f("U", U)} · ${f("I", I)}`); }
    if (g === "UR") { r.I = U / R; r.P = U * U / R; st.push(`I = U / R = ${f("U", U)} / ${f("R", R)}`, `P = U² / R`); }
    if (g === "UP") { r.I = P / U; r.R = U * U / P; st.push(`I = P / U = ${f("P", P)} / ${f("U", U)}`, `R = U² / P`); }
    if (g === "IR") { r.U = I * R; r.P = I * I * R; st.push(`U = I · R = ${f("I", I)} · ${f("R", R)}`, `P = I² · R`); }
    if (g === "IP") { r.U = P / I; r.R = P / (I * I); st.push(`U = P / I = ${f("P", P)} / ${f("I", I)}`, `R = P / I²`); }
    if (g === "RP") { r.U = Math.sqrt(P * R); r.I = Math.sqrt(P / R); st.push(`U = √(P · R)`, `I = √(P / R)`); }
    Object.entries(r).forEach(([k, x]) => { inp(k).value = plain(x); inp(k).parentElement.classList.add("out"); inp(k).nextElementSibling.textContent = "= " + eng(x, unit[k]); computed.add(k); });
    out.innerHTML = st.map((t, i) => { const k = Object.keys(r)[i]; return `<span class="mono">${t} = <b>${eng(r[k], unit[k])}</b></span>`; }).join("") + `<span class="note">Grunneiningar: ${F.map(k => `${k} = ${fbase(v[k] ?? r[k])} ${unit[k]}`).join(" · ")}</span>`;
  }
  F.forEach(k => inp(k).addEventListener("input", () => { if (computed.has(k)) { computed.delete(k); inp(k).parentElement.classList.remove("out"); } ohm(); }));
  $("#ohmClear", s).addEventListener("click", () => { F.forEach(k => { inp(k).value = ""; inp(k).parentElement.classList.remove("out"); }); computed = new Set(); ohm(); });
  inp("U").value = "230"; inp("I").value = "230 mA"; ohm();

  /* Forskeyti */
  function pre() {
    const raw = $("#pIn", s).value, u = $("#pUnit", s).value, x = parseQty(raw), sm = $("#pIn", s).nextElementSibling;
    if (!isFinite(x)) { sm.textContent = raw.trim() ? "Ólæsilegt gildi" : ""; $("#preOut", s).innerHTML = "Skrifaðu gildi, t.d. 33260, 25m eða 5x10^-6."; $("#preTbl", s).innerHTML = ""; return; }
    sm.textContent = "= " + fbase(x) + " " + u;
    $("#preOut", s).innerHTML = `<span class="big">${eng(x, u)}</span><span class="mono">Tugabrot: ${fbase(x)} ${u}</span><span class="mono">Vísindalegur ritháttur: ${sci(x)} ${u}</span><span class="mono">Verkfræðilegur (veldi í 3-um): ${engPow(x)} ${u}</span>`;
    $("#preTbl", s).innerHTML = `<thead><tr><th>Forskeyti</th><th>Gildi</th><th>Reikningur</th></tr></thead><tbody>${PREFIX.filter(p => p.e <= 9 && p.e >= -9).map(p => {
      const y = x / Math.pow(10, p.e); return `<tr${eng(x, u) === fnum(y) + " " + p.p + u ? ' style="background:var(--board-soft)"' : ""}><td>${p.n}</td><td class="mono">${fnum(y, 6)} ${p.p}${u}</td><td class="mono note">${p.e === 0 ? "–" : (p.e > 0 ? "÷ " : "× ") + fnum(Math.pow(10, Math.abs(p.e)))}</td></tr>`; }).join("")}</tbody>`;
  }
  $("#pIn", s).addEventListener("input", pre); $("#pUnit", s).addEventListener("change", pre); pre();

  /* Litakóði */
  let bands = ["gulur", "fjólublár", "rauður", "gull"];
  function bandOpts(i, n) {
    const isTol = i === n - 1, isMul = i === n - 2;

  }
  function colDraw() {
    const n = bands.length;

    $("#bandPick", s).innerHTML = bands.map((b, i) => `<div class="band-row"><span class="label">${i === n - 1 ? "Vikmörk" : i === n - 2 ? "Margfaldari" : (i + 1) + ". tölustafur"}<br><span style="text-transform:none;letter-spacing:0;font-weight:400">${b}</span></span><div class="swatches">${bandOpts(i, n).map(c => `<button type="button" class="sw" style="background:${c.hex}" title="${c.k}" aria-label="${c.k}" aria-pressed="${c.k === b}" data-b="${i}" data-c="${c.k}"></button>`).join("")}</div></div>`).join("");
    const r = readBands(bands);
    $("#colOut", s).innerHTML = `<span class="big">${eng(r.val, "Ω")} ±${String(r.tol).replace(".", ",")}%</span>
      <span class="mono">${r.digits.join("")} × 10${sup(r.mult)} = ${fbase(r.val)} Ω</span>
      <span class="note">Raungildið er á bilinu ${eng(r.val * (1 - r.tol / 100), "Ω")} til ${eng(r.val * (1 + r.tol / 100), "Ω")}.</span>`;

  s.querySelectorAll("[data-n]").forEach(b => b.addEventListener("click", () => {
    const n = +b.dataset.n;
    s.querySelectorAll("[data-n]").forEach(x => x.setAttribute("aria-pressed", x === b));

  colDraw();
  function rev() {

    out.innerHTML = `<span class="label">4 rendur (±5%)</span>${resistorSVG(b4.bands.concat("gull"))}<span>${b4.bands.join(", ")}, gull${near(b4.exact, x) ? "" : ` <span class="note">(næsta gildi: ${eng(b4.exact, "Ω")})</span>`}</span>
      <span class="label" style="margin-top:8px">5 rendur (±1%)</span>${resistorSVG(b5.bands.concat("brúnn"))}<span>${b5.bands.join(", ")}, brúnn</span>`;
  }
  $("#revIn", s).addEventListener("input", rev); rev();

  /* Fjölsviðsmælir */
  const RANGES = {
    dcv: { u: "V", r: [[0.2, "200 mV"], [2, "2 V"], [20, "20 V"], [200, "200 V"], [1000, "1000 V"]], sym: "V⎓ (DCV)", con: "<b>samsíða</b>: yfir íhlutinn, rásin óbreytt" },
    acv: { u: "V", r: [[200, "200 V"], [750, "750 V"]], sym: "V~ (ACV)", con: "<b>samsíða</b>: yfir íhlutinn. Farðu varlega við 230 V!" },
    dca: { u: "A", r: [[200e-6, "200 µA"], [2e-3, "2 mA"], [20e-3, "20 mA"], [0.2, "200 mA"], [10, "10 A"]], sym: "A⎓ (DCA)", con: "<b>raðtengt</b>: rjúfðu rásina og settu mælinn inn í hana" },
    ohm: { u: "Ω", r: [[200, "200 Ω"], [2e3, "2 kΩ"], [20e3, "20 kΩ"], [200e3, "200 kΩ"], [2e6, "2 MΩ"]], sym: "Ω", con: "yfir íhlutinn, <b>án spennu</b>: aftengdu spennugjafann fyrst" }
  };
  function mm() {
    const t = $("#mmType", s).value, R = RANGES[t], x = Math.abs(parseQty($("#mmVal", s).value)), out = $("#mmOut", s);
    $("#mmVal", s).nextElementSibling.textContent = isFinite(x) ? "= " + eng(x, R.u) : "";
    if (!isFinite(x)) { out.innerHTML = "Skrifaðu gildið sem þú átt von á, t.d. 12, 300m eða 4,7k."; return; }
    const hit = R.r.find(([lim]) => x < lim);

    out.innerHTML = hit
      ? `<span class="big">${hit[1]} · ${R.sym}</span>
         <span>Rauð leiðsla í <b class="mono">${red}</b>, svört í <b class="mono">COM</b>.</span>
         <span>Tenging: ${R.con}.</span>
         <span class="note">Þetta er minnsta sviðið sem er stærra en ${eng(x, R.u)}. Ef skjárinn sýnir „1“ lengst til vinstri er gildið of stórt fyrir sviðið: veldu næsta svið fyrir ofan.</span>
         ${t === "dca" ? `<span class="note"><b>Aldrei</b> setja mælinn yfir spennu á meðan hann er á amper-sviði: það veldur skammhlaupi.</span>` : ""}`
      : `<span class="big">Of stórt gildi</span><span>Mælirinn ræður ekki við ${eng(x, R.u)} á þessu sviði. Ekki mæla, fáðu aðstoð kennara.</span>`;

}

const E12 = [1, 1.2, 1.5, 1.8, 2.2, 2.7, 3.3, 3.9, 4.7, 5.6, 6.8, 8.2];
function genOhm() {
  const R = pick(E12) * pick([10, 100, 1000]), I = pick([2, 5, 10, 20, 25, 50, 100]) / 1000, U = R * I;
  const t = pick(["U", "I", "R"]), rs = eng(R, "Ω"), is = eng(I, "A"), us = eng(U, "V", 3);
  if (t === "U") return { id: "g", ch: "ohm", type: "num", q: `Straumurinn ${is} fer um ${rs} viðnám. Hve há er spennan yfir það?`, a: U, unit: "V", exp: `Breyta: ${is} = ${fbase(I)} A og ${rs} = ${fbase(R)} Ω. U = I · R = ${fbase(I)} · ${fbase(R)} = ${fbase(U)} V` };
  if (t === "I") return { id: "g", ch: "ohm", type: "num", q: `Spennan ${us} er yfir ${rs} viðnámi. Hve mikill straumur fer um það?`, a: U / R, unit: "A", exp: `Breyta: ${rs} = ${fbase(R)} Ω. I = U / R = ${fbase(U)} / ${fbase(R)} = ${fbase(U / R)} A = ${eng(U / R, "A")}` };
  return { id: "g", ch: "ohm", type: "num", q: `${us} spenna gefur ${is} straum. Hve stórt er viðnámið?`, a: R, unit: "Ω", exp: `Breyta: ${is} = ${fbase(I)} A. R = U / I = ${fbase(U)} / ${fbase(I)} = ${fbase(R)} Ω = ${eng(R, "Ω")}` };
}
function genPrefix() {
  const u = pick(["V", "A", "Ω"]), from = pick([{ p: "m", e: -3 }, { p: "k", e: 3 }, { p: "µ", e: -6 }, { p: "M", e: 6 }]);
  const v = pick([2, 5, 12, 25, 47, 100, 330, 0.5, 1.5]), base = v * Math.pow(10, from.e);
  return { id: "g", ch: "einingar", type: "num", q: `Hvað er ${fnum(v)} ${from.p}${u} í grunneiningunni ${u}?`, a: base, unit: u,
    exp: `${from.p} = 10${sup(from.e)}, svo ${fnum(v)} ${from.p}${u} = ${fnum(v)}·10${sup(from.e)} ${u} = ${fbase(base)} ${u}. Þú mátt skrifa t.d. ${fnum(v)}x10^${from.e}.` };
}
function genColor() {
  const d1 = 1 + Math.floor(Math.random() * 9), d2 = Math.floor(Math.random() * 10), m = Math.floor(Math.random() * 5);
  const b = [COLORS.find(c => c.d === d1).k, COLORS.find(c => c.d === d2).k, COLORS.find(c => c.m === m).k, "gull"];
  const q = colorQ("g", b); return q;
}
function viewExam() {
  const s = document.createElement("section");

  s.innerHTML = `

      <p class="lead">20 spurningar: 14 úr verkefnunum og 6 nýjar reikningsspurningar með handahófstölum. Hafðu glósublaðið lokað og reiknaðu á blað.</p></div>
    <div class="scorebar"><span class="big mono" id="sc">0 / 0</span><span class="note" id="scText">Svaraðu spurningunum. Staðan uppfærist jafnóðum.</span><button type="button" class="btn small" id="newExam" style="margin-left:auto">Nýtt próf</button></div>
    <div class="qlist" id="examList"></div>
    <div class="panel" id="examEnd" hidden></div>`;
  let right = 0, answered = 0, total = 0;
  function build() {
    right = answered = 0;
    const byCh = CHAPTERS.map(c => shuffle(BANK.filter(q => q.ch === c.id)).slice(0, 2));
    let qs = shuffle(byCh.flat()).slice(0, 14);
    qs = shuffle(qs.concat([genOhm(), genOhm(), genOhm(), genPrefix(), genPrefix(), genColor()]));
    total = qs.length;
    const list = $("#examList", s); list.innerHTML = "";
    qs.forEach((q, i) => list.appendChild(renderQ(q, (i + 1) + ".", ok => { answered++; if (ok) right++; upd(); })));

  }
  function upd() {
    $("#sc", s).textContent = `${right} / ${answered}`;
    $("#scText", s).textContent = `${answered} af ${total} svarað`;
    if (answered === total) {
      const pct = Math.round(100 * right / total);
      if (state.best == null || pct > state.best) { state.best = pct; save(); }
      const weak = CHAPTERS.filter(c => BANK.some(q => q.ch === c.id && state.stats[q.id] === false));
      const end = $("#examEnd", s); end.hidden = false;
      end.innerHTML = `<h2>Niðurstaða: ${right} af ${total} (${pct}%)</h2>
        <p>${pct >= 90 ? "Frábært! Þú ert vel undirbúin/n." : pct >= 70 ? "Gott! Farðu yfir það sem fór úrskeiðis og taktu annað próf." : "Farðu aftur í kaflana og sýnidæmin, og taktu svo nýtt próf."}</p>

    }
  }
  $("#newExam", s).addEventListener("click", () => { build(); window.scrollTo(0, 0); });
  build();
  return s;
}

/* ============ Leiðsögn ============ */
function route() {
  let h = (location.hash || "#yfirlit").slice(1);
  let node;
  if (h.startsWith("kafli-") && CHAPTERS.some(c => "kafli-" + c.id === h)) node = viewChapter(h.slice(6));
  else if (h === "reiknivelar") node = viewCalc();
  else if (h === "glosur") node = viewSheet();
  else if (h === "profa") node = viewExam();
  else { h = "yfirlit"; node = viewHome(); }
  main.innerHTML = "";
  if (typeof node === "string") main.innerHTML = node; else main.appendChild(node);
  document.querySelectorAll("nav.tabs a").forEach(a => {
    const cur = a.dataset.tab === "kafli" ? h.startsWith("kafli-") : a.getAttribute("href") === "#" + h;
    if (cur) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  const kt = $('nav.tabs a[data-tab="kafli"]');
  const firstOpen = CHAPTERS.find(c => !state.done[c.id]) || CHAPTERS[0];
  if (!h.startsWith("kafli-")) kt.setAttribute("href", "#kafli-" + firstOpen.id);
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
