<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14161c">
<title>Spilastokkurinn</title>
<link rel="stylesheet" href="css/spil.css">
</head>
<body>
<header class="top">
  <div class="logo"><span class="logo-a">Spila</span><span class="logo-b">stokkurinn</span></div>
  <div class="stats">
    <div class="stat"><b id="statFlipped">0</b><span>af 20 snúið</span></div>
    <div class="stat score"><b id="statScore">0</b><span>stig</span></div>
    <button id="reset" class="btn ghost" title="Stokka og byrja upp á nýtt">Stokka upp</button>
  </div>
</header>

<main>
  <p class="intro">Veldu spil. Leystu þrautina til að snúa því við. Spilið getur verið <b class="t-bolvun">bölvun</b>, <b class="t-verkefni">verkefni</b> eða <b class="t-spurning">spurning</b>.</p>
  <div class="deck" id="deck" role="list"></div>
</main>

<dialog id="puzzle" class="modal">
  <form method="dialog" id="puzzleForm" class="panel">
    <p class="kicker">Þraut · spil <span id="puzzleNo"></span></p>
    <h2 id="puzzleQ"></h2>
    <div id="puzzleBody"></div>
    <p class="feedback" id="puzzleFeedback" role="status" aria-live="polite"></p>
    <div class="actions">
      <button type="button" class="btn ghost" id="puzzleCancel">Hætta við</button>
      <button type="submit" class="btn primary" value="svara">Svara</button>
    </div>
  </form>
</dialog>

<dialog id="view" class="modal modal-card">
  <div id="viewCard"></div>
  <div class="actions" id="viewActions"></div>
</dialog>

<script src="js/spil-gogn.js"></script>
<script src="js/spil.js"></script>
</body>
</html>
